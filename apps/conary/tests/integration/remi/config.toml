# tests/integration/remi/config.toml
# Integration test configuration -- single source of truth for all endpoints,
# distro mappings, and fixture definitions.
#
# Environment variable overrides:
#   REMI_ENDPOINT  - override [remi] endpoint
#   DB_PATH        - override [paths] db
#   CONARY_BIN     - override [paths] conary_bin
#   RESULTS_DIR    - override [paths] results_dir
#   DISTRO         - select which [distros.*] section to use

[remi]
endpoint = "https://remi.conary.io"

[paths]
db = "/var/lib/conary/conary.db"
conary_bin = "/usr/bin/conary"
results_dir = "/results"
fixture_dir = "/opt/remi-tests/fixtures"

# Distro-specific settings. Key = DISTRO env var value.
#
# Every distro stages the one host-independent artifact from
# scripts/build-static-conary.sh; Ubuntu's userland mismatch with the build host
# was the forcing case that used to make it compile in-container (issue #313).
[distros.fedora44]
remi_distro = "fedora-44"
repo_name = "remi-fedora-44"
build_context = "static-binary"
test_packages = [
    { package = "which", binary = "/usr/bin/which" },
    { package = "tree", binary = "/usr/bin/tree" },
    { package = "jq", binary = "/usr/bin/jq" },
]

