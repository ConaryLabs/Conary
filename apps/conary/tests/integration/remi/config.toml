# tests/integration/remi/config.toml
# Integration test configuration -- single source of truth for all endpoints,
# distro mappings, and fixture definitions.
#
# Environment variable overrides:
#   REMI_ENDPOINT  - override [remi] endpoint
#   DB_PATH        - override [paths] db
#   CONARY_BIN     - override [paths] conary_bin
#   RESULTS_DIR    - override [paths] results_dir
#   DISTRO         - select which [distros.*] section to use

[remi]
endpoint = "https://remi.conary.io"

[paths]
db = "/var/lib/conary/conary.db"
conary_bin = "/usr/bin/conary"
results_dir = "/results"
fixture_dir = "/opt/remi-tests/fixtures"

# Distro-specific settings. Key = DISTRO env var value.
[distros.fedora44]
remi_distro = "fedora-44"
repo_name = "remi-fedora-44"
test_packages = [
    { package = "which", binary = "/usr/bin/which" },
    { package = "tree", binary = "/usr/bin/tree" },
    { package = "jq", binary = "/usr/bin/jq" },
]

[distros."ubuntu-26.04"]
remi_distro = "ubuntu-26.04"
repo_name = "remi-ubuntu-26.04"
test_packages = [
    { package = "patch", binary = "/usr/bin/patch" },
    { package = "nano", binary = "/usr/bin/nano" },
    { package = "jq", binary = "/usr/bin/jq" },
]

[distros.arch]
remi_distro = "arch"
repo_name = "remi-arch"
test_packages = [
    { package = "which", binary = "/usr/bin/which" },
    { package = "tree", binary = "/usr/bin/tree" },
    { package = "jq", binary = "/usr/bin/jq" },
]

# Default repos to remove after init (avoid slow syncs)
[setup]
remove_default_repos = [
    "arch-core", "arch-extra", "arch-multilib",
    "fedora-44", "ubuntu-26.04",
]

# Test fixture packages (Phase 2)
[fixtures]
package = "conary-test-fixture"
file = "/usr/share/conary-test/hello.txt"
added_file = "/usr/share/conary-test/added.txt"
marker = "/var/lib/conary-test/installed"

[fixtures.v1]
version = "1.0.0"
ccs_file = "conary-test-fixture-1.0.0-1.ccs"
hello_sha256 = "18933c865fcf7230f8ea99b059747facc14285b7ed649758115f9c9a73f42a53"

[fixtures.v2]
version = "2.0.0"
ccs_file = "conary-test-fixture-2.0.0-1.ccs"
hello_sha256 = "bd80c5e8a7138bd13d0f10e1358bda6f9727c266b6909d4b6c9293ab141ec1db"
added_sha256 = "9767b0b4d55db9aee6638c9875b5cefea50c952cc77fbc5703ebc866b0daba3c"
