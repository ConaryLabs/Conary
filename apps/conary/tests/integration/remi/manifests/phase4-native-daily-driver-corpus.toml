# --------------------------------------------------------------------------
# TNPM13: daily-driver corpus build
# --------------------------------------------------------------------------

[[test]]
id = "TNPM13"
name = "daily_driver_corpus_build"
description = "Build exact v1 and v2 native corpus packages with hardlinks, service, versioned config, dependency, scriptlet, alternative target, large payload, and kernel-adjacent files"
group = "daily-driver-corpus"
timeout = 240
fatal = true

[[test.step]]
run = "rm -rf /tmp/native-pm-corpus /tmp/native-pm-corpus-src /tmp/native-pm-corpus-conflict /tmp/native-pm-corpus-conflict-src && cp -a /opt/remi-tests/fixtures/phase4-daily-driver-corpus /tmp/native-pm-corpus-src && mkdir -p /tmp/native-pm-corpus-src/stage/opt /tmp/native-pm-corpus-src/stage/usr/share/phase4-corpus /tmp/native-pm-corpus-src/stage/usr/lib/phase4-corpus/state && chmod 0750 /tmp/native-pm-corpus-src/stage/opt /tmp/native-pm-corpus-src/stage/usr/lib/phase4-corpus/state && ln -s phase4-corpus /tmp/native-pm-corpus-src/stage/usr/bin/phase4-corpus-link && printf 'shared hardlink corpus payload\\n' > /tmp/native-pm-corpus-src/stage/usr/lib/phase4-corpus/hardlink-anchor && ln /tmp/native-pm-corpus-src/stage/usr/lib/phase4-corpus/hardlink-anchor /tmp/native-pm-corpus-src/stage/usr/lib/phase4-corpus/hardlink-copy && touch -d @1700000000 /tmp/native-pm-corpus-src/stage/usr/lib/phase4-corpus/hardlink-anchor && dd if=/dev/zero of=/tmp/native-pm-corpus-src/stage/usr/share/phase4-corpus/large-payload.bin bs=1048576 count=2 && mkdir -p /tmp/native-pm-corpus && CONARY_BIN=${CONARY_BIN} /opt/remi-tests/fixtures/native/build-native-fixtures.sh ${native_target} /tmp/native-pm-corpus /tmp/native-pm-corpus-src && . /tmp/native-pm-corpus/native-fixture.env && test -f \"$NATIVE_PKG_FILE\" && test \"$NATIVE_TARGET\" = \"${native_target}\" && test ${#NATIVE_PKG_SHA256} -eq 64 && case \"$NATIVE_PKG_FILE\" in /tmp/native-pm-corpus/${native_glob}) true ;; *) echo \"unexpected native corpus package path: $NATIVE_PKG_FILE\"; exit 1 ;; esac"

[test.step.assert]
exit_code = 0

[[test.step]]
run = ". /tmp/native-pm-corpus/native-fixture.env && case \"${native_target}\" in rpm) rpm -qp --qf '[%{FILENAMES}|%{FILEMODES}|%{FILEUSERNAME}|%{FILEGROUPNAME}\\n]' \"$NATIVE_PKG_FILE\" | grep -Fx '/opt|16872|root|root' ;; *) true ;; esac"

[test.step.assert]
exit_code = 0

[[test.step]]
run = ". /tmp/native-pm-corpus/native-fixture.env && case \"${native_target}\" in rpm) rpm -qp --provides \"$NATIVE_PKG_FILE\" | grep -Fx 'phase4-daily-driver-corpus = 1.0' ;; deb) test \"$(dpkg-deb --field \"$NATIVE_PKG_FILE\" Provides)\" = 'phase4-corpus-tool, phase4-daily-driver-corpus (= 1.0)' ;; arch) bsdtar -xOf \"$NATIVE_PKG_FILE\" .PKGINFO | grep -Fx 'provides = phase4-daily-driver-corpus=1.0' ;; esac"

[test.step.assert]
exit_code = 0

[[test.step]]
run = ". /tmp/native-pm-corpus/native-fixture.env && rm -rf /tmp/native-pm-corpus-hardlink-root && /opt/remi-tests/fixtures/native/assert-native-hardlink.sh \"$NATIVE_TARGET\" \"$NATIVE_PKG_FILE\" /tmp/native-pm-corpus-hardlink-root /usr/lib/phase4-corpus/hardlink-anchor /usr/lib/phase4-corpus/hardlink-copy 0 0 1700000000"

[test.step.assert]
exit_code = 0

[[test.step]]
run = "CONARY_BIN=${CONARY_BIN} /opt/remi-tests/fixtures/native/build-daily-driver-update-fixture.sh ${native_target} /tmp/native-pm-corpus-src /tmp/native-pm-corpus-v2-src /tmp/native-pm-corpus-v2"

[test.step.assert]
exit_code = 0

[[test.step]]
run = ". /tmp/native-pm-corpus-v2/native-fixture.env && rm -rf /tmp/native-pm-corpus-v2-root && /opt/remi-tests/fixtures/native/assert-native-hardlink.sh \"$NATIVE_TARGET\" \"$NATIVE_PKG_FILE\" /tmp/native-pm-corpus-v2-root /usr/lib/phase4-corpus/hardlink-anchor /usr/lib/phase4-corpus/hardlink-copy 0 0 1700000000 && test \"$(sha256sum /tmp/native-pm-corpus-v2-root/etc/phase4-corpus/app.conf | awk '{print $1}')\" = 97d836d4bf6c4c49fa763836c117d738fef15b7d995bc2cf82e2a02704364d27 && case \"${native_target}\" in rpm) test \"$(rpm -qp --qf '%{VERSION}-%{RELEASE}' \"$NATIVE_PKG_FILE\")\" = \"${native_corpus_update_version}\" ;; deb) test \"$(dpkg-deb --field \"$NATIVE_PKG_FILE\" Version)\" = \"${native_corpus_update_version}\" ;; arch) bsdtar -xOf \"$NATIVE_PKG_FILE\" .PKGINFO | grep -Fx \"pkgver = ${native_corpus_update_version}\" ;; esac"

[test.step.assert]
exit_code = 0
# --------------------------------------------------------------------------
# TNPM14: daily-driver corpus install and selected-root surface
# --------------------------------------------------------------------------

[[test]]
id = "TNPM14"
name = "daily_driver_corpus_install_and_surface"
description = "Install the corpus package and verify its hardlink, daily-driver files, service unit, users/groups, trigger, and scriptlet side effects"
group = "daily-driver-corpus"
timeout = 240
fatal = true
depends_on = ["TNPM13"]

[[test.step]]
run = "${CONARY_BIN} system trigger remove phase4-corpus-trigger --db-path ${DB_PATH} >/dev/null 2>&1 || true; ${CONARY_BIN} system trigger add phase4-corpus-trigger --pattern /usr/lib/systemd/system/phase4-corpus.service --handler /usr/bin/true --db-path ${DB_PATH}"

[test.step.assert]
exit_code = 0
stdout_contains = "Created trigger: phase4-corpus-trigger"

[[test.step]]
run = ". /tmp/native-pm-corpus/native-fixture.env && CONARY_TEST_SKIP_GENERATION_MOUNT=1 ${CONARY_BIN} install \"$NATIVE_PKG_FILE\" --convert-to-ccs --from ${native_profile} --db-path ${DB_PATH} --root /conary --yes --sandbox always"

[test.step.assert]
exit_code = 0
stdout_contains_any = ["Successfully installed", "Installed", "phase4-daily-driver-corpus"]

[[test.step]]
run = "sqlite3 ${DB_PATH} \"SELECT t.name || '|' || t.version || '|' || COALESCE(t.package_release, '') || '|' || COALESCE(t.architecture, '') || '|' || COALESCE(t.version_scheme, '') || '|' || COALESCE(r.name, '') || '|' || COALESCE(t.source_profile, '') || '|' || COALESCE(t.install_source, '') || '|' || COALESCE(t.install_reason, '') FROM troves t LEFT JOIN repositories r ON r.id = t.installed_from_repository_id WHERE t.name = 'phase4-repository-fixture'\""

[test.step.assert]
exit_code = 0
stdout_contains = "phase4-repository-fixture|1.0.0|1|${native_arch}|${native_scheme}|${REPO_NAME}|${native_profile}|repository|dependency"

[[test.step]]
run = "/opt/remi-tests/fixtures/native/assert-selected-generation.py --root /conary --expect-sha256 /usr/bin/phase4-corpus=565d3f61ffdbbca53c7371588ce6884b680dfa1d1c1bd7fe3954b4ab957e0676 --expect-sha256 /usr/bin/phase4-corpus-alt=1c279f8af2faaed5ae4aad470ab37742b2cede45b42b65d961f2bb33233e5ad3 --expect-symlink /usr/bin/phase4-corpus-link=phase4-corpus --expect-directory /opt=0750 --expect-directory /usr/lib/phase4-corpus/state=0750 --expect-hardlink /usr/lib/phase4-corpus/hardlink-anchor=/usr/lib/phase4-corpus/hardlink-copy --expect-node-metadata /usr/lib/phase4-corpus/hardlink-anchor=${native_corpus_payload_user},${native_corpus_payload_group},1700000000,0 --expect-node-metadata /usr/lib/phase4-corpus/hardlink-copy=${native_corpus_payload_user},${native_corpus_payload_group},1700000000,0 --expect-sha256 /etc/phase4-corpus/app.conf=8b3ca388884ac9c33e5e1c849ac30bc59aa9d494e7afc5d91fb56c8a4e760eb2 --expect-sha256 /etc/phase4-corpus/app-local.conf=9773fc86d4e388ba3f5eba7408708b46ce20738acf98fc55a4e5f584bbe8af66 --expect-sha256 /etc/phase4-corpus/app-deleted.conf=d9697bd8e59efc7dc9863c9ae9b0c3745262015b3552a20712a9bcbfc3e47f79 --expect-sha256 /usr/lib/systemd/system/phase4-corpus.service=20200a86933288373c109a2e3289b2314ff6015886bfbad9bec6e613421e756a --expect-sha256 /usr/lib/kernel/install.d/95-phase4-corpus.install=8753356f470ea82416c2d7a71cbf8367d4cbe1a8b78f3276fe45035e114c3674 --present /usr/share/phase4-corpus/large-payload.bin --present /usr/share/phase4-repository-fixture/probe.txt --expect-sha256 /var/lib/phase4-corpus/scriptlet.marker=a51a6c19a1ffc7416827e89adf20749d23ad42452c396cf7e627409f2896922c --expect-user phase4-corpus-user=/var/lib/phase4-corpus,/bin/false,phase4-corpus-group || { sqlite3 ${DB_PATH} \"SELECT source_entry || '|' || failure_kind || '|' || message FROM lifecycle_events ORDER BY id\" >&2; exit 1; }"

[test.step.assert]
exit_code = 0

# --------------------------------------------------------------------------
# TNPM15: daily-driver corpus exact metadata
# --------------------------------------------------------------------------

[[test]]
id = "TNPM15"
name = "daily_driver_corpus_exact_metadata"
description = "Installed corpus metadata records package identity, files, dependencies, config rows, native lifecycle authority, and triggers"
group = "daily-driver-corpus"
timeout = 90
fatal = true
depends_on = ["TNPM14"]

[[test.step]]
run = "sqlite3 ${DB_PATH} \"SELECT COUNT(*) || ' troves' FROM troves WHERE name = 'phase4-daily-driver-corpus'; SELECT name || '|' || version || '|' || COALESCE(architecture, '') || '|' || COALESCE(version_scheme, '') || '|' || COALESCE(source_profile, '') || '|' || COALESCE(install_source, '') || '|' || COALESCE(install_reason, '') FROM troves WHERE name = 'phase4-daily-driver-corpus'\""

[test.step.assert]
exit_code = 0
stdout_contains_all = ["1 troves", "phase4-daily-driver-corpus|${native_corpus_fixture_version}|${native_arch}|${native_scheme}|${native_profile}|file|explicit"]

[[test.step]]
run = "sqlite3 ${DB_PATH} \"SELECT COUNT(*) || ' regular files' FROM files WHERE trove_id = (SELECT id FROM troves WHERE name = 'phase4-daily-driver-corpus') AND json_extract(payload_node_json, '$.source.kind.type') = 'regular'; SELECT path || '|' || coalesce(content_size, '-') || '|' || json_extract(payload_node_json, '$.source.kind.type') FROM files WHERE trove_id = (SELECT id FROM troves WHERE name = 'phase4-daily-driver-corpus') AND json_extract(payload_node_json, '$.source.kind.type') = 'regular' ORDER BY path\""

[test.step.assert]
exit_code = 0
stdout_contains_all = ["9 regular files", "/etc/phase4-corpus/app.conf", "/etc/phase4-corpus/app-deleted.conf", "/etc/phase4-corpus/app-local.conf", "/usr/bin/phase4-corpus-alt", "/usr/lib/kernel/install.d/95-phase4-corpus.install", "/usr/lib/systemd/system/phase4-corpus.service", "/usr/share/phase4-corpus/large-payload.bin|2097152|regular"]

[[test.step]]
run = "sqlite3 ${DB_PATH} \"SELECT path || '|' || json_extract(payload_node_json, '$.source.kind.type') || '|' || printf('%04o', json_extract(payload_node_json, '$.source.mode') & 4095) FROM files WHERE trove_id = (SELECT id FROM troves WHERE name = 'phase4-daily-driver-corpus') AND path IN ('/opt', '/usr/lib/phase4-corpus/state') ORDER BY path; SELECT path || '|' || json_extract(payload_node_json, '$.source.kind.type') || '|' || json_extract(payload_node_json, '$.source.kind.target') FROM files WHERE trove_id = (SELECT id FROM troves WHERE name = 'phase4-daily-driver-corpus') AND path = '/usr/bin/phase4-corpus-link'\""

[test.step.assert]
exit_code = 0
stdout_contains_all = ["/opt|directory|0750", "/usr/lib/phase4-corpus/state|directory|0750", "/usr/bin/phase4-corpus-link|symlink|phase4-corpus"]

[[test.step]]
run = "sqlite3 ${DB_PATH} \"SELECT COUNT(*) || ' hardlinks' FROM files WHERE trove_id = (SELECT id FROM troves WHERE name = 'phase4-daily-driver-corpus') AND json_extract(payload_node_json, '$.source.kind.type') = 'hardlink'; SELECT path || '|' || json_extract(payload_node_json, '$.source.kind.type') FROM files WHERE trove_id = (SELECT id FROM troves WHERE name = 'phase4-daily-driver-corpus') AND path IN ('/usr/lib/phase4-corpus/hardlink-anchor', '/usr/lib/phase4-corpus/hardlink-copy') ORDER BY path\""

[test.step.assert]
exit_code = 0
stdout_contains_all = ["1 hardlinks", "/usr/lib/phase4-corpus/hardlink-anchor|", "/usr/lib/phase4-corpus/hardlink-copy|"]

[[test.step]]
run = "sqlite3 ${DB_PATH} \"SELECT COUNT(*) || ' requirement groups' FROM package_requirement_groups WHERE trove_id = (SELECT id FROM troves WHERE name = 'phase4-daily-driver-corpus'); SELECT COALESCE((SELECT group_concat(kind || '|' || version_scheme || '|' || requirement_json, char(10)) FROM package_requirement_groups WHERE trove_id = (SELECT id FROM troves WHERE name = 'phase4-daily-driver-corpus') ORDER BY id), 'no-deps'); SELECT json_extract(requirement_json, '$.expression.operands.name') || '|' || json_extract(requirement_json, '$.expression.operands.version_constraint') FROM package_requirement_groups WHERE trove_id = (SELECT id FROM troves WHERE name = 'phase4-daily-driver-corpus') AND json_extract(requirement_json, '$.expression.operands.name') = 'phase4-repository-fixture'\""

[test.step.assert]
exit_code = 0
stdout_contains_all = ["${native_corpus_dependency_count} requirement groups", "${native_corpus_dependency_probe}", "phase4-repository-fixture|= 1.0.0"]

[[test.step]]
run = "sqlite3 ${DB_PATH} \"SELECT COUNT(*) || ' config rows' FROM config_files WHERE trove_id = (SELECT id FROM troves WHERE name = 'phase4-daily-driver-corpus'); SELECT path || '|' || noreplace || '|' || status || '|' || source FROM config_files WHERE trove_id = (SELECT id FROM troves WHERE name = 'phase4-daily-driver-corpus') ORDER BY path\""

[test.step.assert]
exit_code = 0
