capabilities = ["native_lifecycle", "selected_root_generation"]

[[test.corpus.coverage]]
semantic = "failure_activation"
artifact_roles = ["install_request"]

[[test.step]]
run = "generation=$(sqlite3 ${DB_PATH} \"SELECT MAX(generation_number) FROM generation_activation_intents WHERE status = 'pending'\") && test -n \"$generation\" && test -f \"/conary/generations/$generation/.conary-artifact.json\" && printf 'quiet conary.generation=%s\\n' \"$generation\" > /tmp/w7-proc-cmdline && before_current=$(readlink /conary/current) && before_generations=$(find /conary/generations -mindepth 1 -maxdepth 1 -type d | wc -l) && before_requests=$(sqlite3 ${DB_PATH} 'SELECT COUNT(*) FROM activation_requests') && before_troves=$(sqlite3 ${DB_PATH} 'SELECT COUNT(*) FROM troves') && if CONARY_TEST_PROC_CMDLINE_PATH=/tmp/w7-proc-cmdline ${CONARY_BIN} generation activate --db-path ${DB_PATH} > /tmp/w7-activation-failure.log 2>&1; then cat /tmp/w7-activation-failure.log; exit 1; fi && grep -F 'generation activation request(s) remain retryable' /tmp/w7-activation-failure.log && test \"$(readlink /conary/current)\" = \"$before_current\" && test \"$(find /conary/generations -mindepth 1 -maxdepth 1 -type d | wc -l)\" = \"$before_generations\" && test \"$(sqlite3 ${DB_PATH} 'SELECT COUNT(*) FROM activation_requests')\" = \"$before_requests\" && test \"$(sqlite3 ${DB_PATH} 'SELECT COUNT(*) FROM troves')\" = \"$before_troves\" && test -f /conary/usr/share/w7-trust-valid-a/proof.txt && sqlite3 ${DB_PATH} \"PRAGMA quick_check; SELECT status || '|' || attempt_count || '|' || COALESCE(last_error, '') FROM generation_activation_intents WHERE generation_number = $generation ORDER BY request_id\""

[test.step.assert]
exit_code = 0
stdout_contains_all = ["ok", "failed|1|activation interface verification failed"]

