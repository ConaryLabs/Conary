[[suite.setup]]
conary = "system init"

[suite.setup.assert]
exit_code = 0

[[suite.setup]]
run = "${CONARY_BIN} repo remove ${REPO_NAME} --db-path ${DB_PATH} >/dev/null 2>&1 || true"

[[suite.setup]]
run = "rm -rf /tmp/native-pm-corpus-repo && CONARY_BIN=${CONARY_BIN} /opt/remi-tests/fixtures/native/build-pinned-binary-fixture.sh ${native_target} /tmp/native-pm-corpus-repo http://127.0.0.1:18084"

[suite.setup.assert]
exit_code = 0

[[suite.setup]]
conary = "repo add ${REPO_NAME} http://127.0.0.1:18084 --package-format json --default-strategy binary --ccs-package-key ${FIXTURE_CCS_PUBLIC_KEY} --source-profile ${native_profile}"

[suite.setup.assert]
exit_code = 0

[[suite.setup]]
conary = "repo sync ${REPO_NAME} --force"

[suite.setup.assert]
exit_code = 0

[[suite.setup]]
run = "CONARY_BIN=${CONARY_BIN} /opt/remi-tests/fixtures/native/prepare-selected-root.sh ${DB_PATH} /conary"

[suite.setup.assert]
exit_code = 0

[[suite.setup]]
run = "rm -rf /tmp/w7-trust && mkdir -p /tmp/w7-trust && CONARY_FIXTURES_ROOT=/opt/remi-tests/fixtures /opt/remi-tests/fixtures/native/build-w7-trust-fixture.sh /tmp/w7-trust"

[suite.setup.assert]
exit_code = 0

[[suite.setup]]
run = "set -e; . /tmp/w7-trust/w7-trust-fixture.env; ${CONARY_BIN} repo remove w7trust --db-path ${DB_PATH} >/dev/null 2>&1 || true; ${CONARY_BIN} repo add w7trust http://127.0.0.1:18084 --package-format arch --database w7trust --arch-keyring file:///tmp/w7-trust/w7trust.gpg --arch-keyring-format open-pgp --arch-master-key \"${W7_TRUST_MASTER_FINGERPRINT}\" --arch-packager-key-threshold 1 --arch-database-signature optional --source-profile arch --source-id conary-w7 --repository-id trust-corpus --stream-kind rolling --stream-id w7 --follow --db-path ${DB_PATH}"

[suite.setup.assert]
exit_code = 0

[[suite.setup]]
conary = "repo sync w7trust --force"

[suite.setup.assert]
exit_code = 0

