# tests/integration/remi/manifests/phase4-native-daily-driver-corpus.toml
#
# Focused attributable W7 daily-driver corpus over host-native package artifacts.

[suite]
name = "Phase 4: Native Daily-Driver Corpus"
phase = 4
timeout = 1500

[suite.corpus]
required = [
    "identity_exact_version",
    "identity_epoch_release",
    "identity_architecture_independent",
    "identity_native_architecture",
    "payload_files",
    "payload_directories",
    "payload_symlinks",
    "payload_hardlinks",
    "payload_sparse_files",
    "payload_large_files",
    "metadata_xattrs",
    "metadata_capabilities",
    "metadata_ownership",
    "metadata_timestamps",
    "relations_versioned_dependency",
    "relations_virtual_provide",
    "relations_same_name_compatibility_provide",
    "relations_conflict",
    "relations_replacement",
    "configuration_matched_config",
    "configuration_unmatched_declaration",
    "configuration_local_modification",
    "configuration_deletion",
    "configuration_upgrade",
    "configuration_removal",
    "lifecycle_none",
    "lifecycle_shell",
    "lifecycle_non_shell_interpreter",
    "lifecycle_trigger",
    "lifecycle_transaction_hook",
    "trust_multiple_valid_signing_keys",
    "trust_signing_subkeys",
    "trust_expired_key",
    "trust_revoked_key",
    "trust_unknown_key",
    "runtime_service_activation",
    "runtime_target_helper",
    "runtime_deferred_generation_work",
    "failure_interrupted_download",
    "failure_conversion",
    "failure_payload_mutation",
    "failure_lifecycle",
    "failure_publication",
    "failure_activation",
]

[suite.mock_server]
port = 18084

