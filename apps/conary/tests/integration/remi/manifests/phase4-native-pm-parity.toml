# --------------------------------------------------------------------------
# TNPM09: forced deferred follow-up
# --------------------------------------------------------------------------

[[test]]
id = "TNPM09"
name = "forced_deferred_follow_up"
description = "A forced generation rebuild failure records deferred follow-up without failing the package mutation"
timeout = 180
fatal = true
depends_on = ["TNPM08"]

[[test.step]]
run = ". /tmp/native-pm-parity/native-fixture.env && CONARY_TEST_SKIP_GENERATION_MOUNT=1 CONARY_TEST_FAIL_GENERATION_REBUILD=slice-d-forced ${CONARY_BIN} install \"$NATIVE_PKG_FILE\" --convert-to-ccs --db-path ${DB_PATH} --root /conary --no-deps --yes --sandbox always 2>&1"

[test.step.assert]
exit_code = 0
stdout_contains = "pending"

[[test.step]]
run = "sqlite3 ${DB_PATH} \"SELECT COALESCE(metadata, '') FROM changesets WHERE description = 'Install phase4-runtime-fixture-${native_fixture_version}' ORDER BY id DESC LIMIT 1\""

[test.step.assert]
exit_code = 0
stdout_contains_all = ["deferred_follow_up", "generation_rebuild", "forced generation rebuild failure for test: slice-d-forced"]

[[test.step]]
conary = "system history"

[test.step.assert]
exit_code = 0
stdout_contains_all = ["Install phase4-runtime-fixture-${native_fixture_version}", "[deferred]", "generation_rebuild"]

# --------------------------------------------------------------------------
# TNPM10: repository install and daily query surface
# --------------------------------------------------------------------------

[[test]]
id = "TNPM10"
name = "repository_install_and_queries"
description = "Install a signed source-scheme CCS package from the pinned repository and verify daily-driver query commands"
timeout = 240
fatal = true
depends_on = ["TNPM09"]

[[test.step]]
run = "CONARY_TEST_SKIP_GENERATION_MOUNT=1 ${CONARY_BIN} install ${repo_install_pkg} --repo ${REPO_NAME} --db-path ${DB_PATH} --root /conary --no-deps --yes --sandbox always"

[test.step.assert]
exit_code = 0
stdout_contains = "${repo_install_pkg}"

[[test.step]]
run = "/opt/remi-tests/fixtures/native/assert-selected-generation.py --root /conary --present ${repo_install_path} --expect-sha256 /usr/bin/phase4-runtime-fixture=517631de24336343a6aaf1a8f704d326299c14c619fe8c8d75d17824d074bd7f"

[test.step.assert]
exit_code = 0

[[test.step]]
run = "sqlite3 ${DB_PATH} \"SELECT COUNT(*) || ' repo troves' FROM troves WHERE name = '${repo_install_pkg}'; SELECT t.name || '|' || COALESCE(r.name, '') || '|' || COALESCE(t.source_profile, '') || '|' || COALESCE(t.version_scheme, '') || '|' || COALESCE(t.install_source, '') || '|' || COALESCE(t.install_reason, '') FROM troves t LEFT JOIN repositories r ON r.id = t.installed_from_repository_id WHERE t.name = '${repo_install_pkg}'\""

[test.step.assert]
exit_code = 0
stdout_contains_all = ["1 repo troves", "${repo_install_pkg}|${REPO_NAME}|${native_profile}|${native_scheme}|repository|explicit"]

[[test.step]]
conary = "list ${repo_install_pkg} --info"

[test.step.assert]
exit_code = 0
stdout_contains_all = ["Name        : ${repo_install_pkg}", "Authority   : conary-owned", "Repository  : ${REPO_NAME}"]

[[test.step]]
conary = "list ${repo_install_pkg} --files"

[test.step.assert]
exit_code = 0
stdout_contains = "${repo_install_path}"

[[test.step]]
conary = "list --path ${repo_install_path}"

[test.step.assert]
exit_code = 0
stdout_contains = "${repo_install_pkg}"

# --------------------------------------------------------------------------
# TNPM11: security metadata honesty
# --------------------------------------------------------------------------

[[test]]
id = "TNPM11"
name = "security_metadata_honesty"
description = "Security-only update refuses before mutation when source advisory metadata support is unknown"
timeout = 90
fatal = true
depends_on = ["TNPM10"]

[[test.step]]
run = "BEFORE=$(sqlite3 ${DB_PATH} \"SELECT version FROM troves WHERE name = '${repo_install_pkg}'\"); echo \"$BEFORE\" > /tmp/native-pm-security-before; CONARY_BIN=${CONARY_BIN} /opt/remi-tests/fixtures/native/prepare-unknown-security-repository.sh ${repo_install_pkg} ${repo_seed_security_version} ${native_scheme} ${native_arch} ${native_profile} ${DB_PATH}"

[test.step.assert]
exit_code = 0

[[test.step]]
run = "CONARY_TEST_SKIP_GENERATION_MOUNT=1 ${CONARY_BIN} update --security ${repo_install_pkg} --db-path ${DB_PATH} --root /conary --yes --sandbox always 2>&1"

[test.step.assert]
exit_code_not = 0
stdout_contains = "security metadata"

[[test.step]]
run = "BEFORE=$(cat /tmp/native-pm-security-before); AFTER=$(sqlite3 ${DB_PATH} \"SELECT version FROM troves WHERE name = '${repo_install_pkg}'\"); test \"$BEFORE\" = \"$AFTER\""

[test.step.assert]
exit_code = 0

