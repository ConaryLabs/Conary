[test.step.assert]
exit_code = 0

[[test.step]]
run = "${CONARY_BIN} autoremove --db-path ${DB_PATH} --root /conary --dry-run"

[test.step.assert]
exit_code = 0
stdout_contains_all = ["Found", "${repo_install_pkg}", "Dry run"]

