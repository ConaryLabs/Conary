# tests/integration/remi/manifests/phase4-native-pm-parity.toml
#
# Phase 4 native package-manager parity matrix.
# This suite is the Slice D release evidence for Conary-owned package flows.

[suite]
name = "Phase 4: Native Package Manager Parity Matrix"
phase = 4
timeout = 3600

[suite.mock_server]
port = 18083

[[suite.mock_server.routes]]
path = "/v1/index/fedora?page=1&per_page=128&include=versions"
status = 200
body_file = "/tmp/native-pm-pinned-repo/index-fedora.json"
headers = { "Content-Type" = "application/json" }

[[suite.mock_server.routes]]
path = "/v1/index/ubuntu?page=1&per_page=128&include=versions"
status = 200
body_file = "/tmp/native-pm-pinned-repo/index-ubuntu.json"
headers = { "Content-Type" = "application/json" }

[[suite.mock_server.routes]]
path = "/v1/index/arch?page=1&per_page=128&include=versions"
status = 200
body_file = "/tmp/native-pm-pinned-repo/index-arch.json"
headers = { "Content-Type" = "application/json" }

[[suite.mock_server.routes]]
path = "/v1/fedora/packages/phase4-repository-fixture/download?version=1.0.0&release=1&arch=x86_64"
status = 200
body_file = "/tmp/native-pm-pinned-repo/phase4-repository-fixture-1.0.0-1.ccs"
headers = { "Content-Type" = "application/octet-stream" }

[[suite.mock_server.routes]]
path = "/v1/ubuntu/packages/phase4-repository-fixture/download?version=1.0.0&release=1&arch=amd64"
status = 200
body_file = "/tmp/native-pm-pinned-repo/phase4-repository-fixture-1.0.0-1.ccs"
headers = { "Content-Type" = "application/octet-stream" }

[[suite.mock_server.routes]]
path = "/v1/arch/packages/phase4-repository-fixture/download?version=1.0.0&release=1&arch=x86_64"
status = 200
body_file = "/tmp/native-pm-pinned-repo/phase4-repository-fixture-1.0.0-1.ccs"
headers = { "Content-Type" = "application/octet-stream" }

[[suite.setup]]
conary = "system init"

[suite.setup.assert]
exit_code = 0

[[suite.setup]]
run = "${CONARY_BIN} repo remove ${REPO_NAME} --db-path ${DB_PATH} >/dev/null 2>&1 || true"

[[suite.setup]]
run = "rm -rf /tmp/native-pm-pinned-repo && CONARY_BIN=${CONARY_BIN} /opt/remi-tests/fixtures/native/build-pinned-remi-fixture.sh ${native_target} /tmp/native-pm-pinned-repo"

[suite.setup.assert]
exit_code = 0

[[suite.setup]]
conary = "repo add ${REPO_NAME} http://127.0.0.1:18083 --package-format json --default-strategy remi --remi-endpoint http://127.0.0.1:18083 --ccs-package-key ${FIXTURE_CCS_PUBLIC_KEY} --source-profile ${native_profile}"

[suite.setup.assert]
exit_code = 0

[[suite.setup]]
run = "CONARY_BIN=${CONARY_BIN} /opt/remi-tests/fixtures/native/prepare-selected-root.sh ${DB_PATH} /conary"

[suite.setup.assert]
exit_code = 0

[distro_overrides.fedora44]
native_target = "rpm"
native_glob = "*.rpm"
native_arch = "x86_64"
native_scheme = "rpm"
native_profile = "fedora-44"
native_fixture_version = "1.0.0-1"
native_update_version = "1.0.1-1"
native_dependency_count = "1"
native_dependency_probe = 'depends|rpm|{"kind":"Depends","behavior":"Hard","expression":{"operator":"atom","operands":{"name":"config(phase4-runtime-fixture)","capability_kind":null,"version_constraint":"= 1.0.0-1","architecture_qualifier":{"kind":"unqualified"},"native_text":null}},"alternatives":[{"name":"config(phase4-runtime-fixture)","capability_kind":null,"version_constraint":"= 1.0.0-1","architecture_qualifier":{"kind":"unqualified"},"native_text":null}],"description":null,"native_text":"config(phase4-runtime-fixture) = 1.0.0-1"}'
native_config_count = "1"
native_config_source = "rpm"
native_lifecycle_fidelity = "native-free"
native_provider_count = "7"
native_file_provider_count = "3"
native_file_provider_set = "/etc/phase4-runtime-fixture/app.conf,/usr/bin/phase4-runtime-fixture,/usr/include/phase4-runtime-fixture/api.h"
repo_install_pkg = "phase4-repository-fixture"
repo_install_path = "/usr/share/phase4-repository-fixture/probe.txt"
repo_seed_security_version = "9999.0-1"

[distro_overrides."ubuntu-26.04"]
native_target = "deb"
native_glob = "*.deb"
native_arch = "amd64"
native_scheme = "debian"
native_profile = "ubuntu-26.04"
native_fixture_version = "1.0.0-1"
native_update_version = "1.0.1-1"
native_dependency_count = "0"
native_dependency_probe = "no-deps"
native_config_count = "1"
native_config_source = "deb"
native_lifecycle_fidelity = "native-free"
native_provider_count = "4"
native_file_provider_count = "3"
native_file_provider_set = "/etc/phase4-runtime-fixture/app.conf,/usr/bin/phase4-runtime-fixture,/usr/include/phase4-runtime-fixture/api.h"
repo_install_pkg = "phase4-repository-fixture"
repo_install_path = "/usr/share/phase4-repository-fixture/probe.txt"
repo_seed_security_version = "9999.0"

[distro_overrides.arch]
native_target = "arch"
native_glob = "*.pkg.tar.zst"
native_arch = "x86_64"
native_scheme = "arch"
native_profile = "arch"
native_fixture_version = "1.0.0-1"
native_update_version = "1.0.1-1"
native_dependency_count = "0"
native_dependency_probe = "no-deps"
native_config_count = "1"
native_config_source = "arch"
native_lifecycle_fidelity = "native-free"
native_provider_count = "4"
native_file_provider_count = "3"
native_file_provider_set = "/etc/phase4-runtime-fixture/app.conf,/usr/bin/phase4-runtime-fixture,/usr/include/phase4-runtime-fixture/api.h"
repo_install_pkg = "phase4-repository-fixture"
repo_install_path = "/usr/share/phase4-repository-fixture/probe.txt"
repo_seed_security_version = "9999.0-1"

# --------------------------------------------------------------------------
# TNPM01: repository sync and search
# --------------------------------------------------------------------------

[[test]]
id = "TNPM01"
name = "repo_sync_and_search"
description = "Pinned loopback repository metadata sync and search are usable"
timeout = 300
fatal = true

[[test.step]]
conary = "repo sync ${REPO_NAME} --force"

[test.step.assert]
exit_code = 0
stdout_contains_any = ["[ok]", "Synchronized", "packages"]

[[test.step]]
conary = "search ${repo_install_pkg}"

[test.step.assert]
exit_code = 0
stdout_contains = "${repo_install_pkg}"
stdout_not_contains = "No packages found"

# --------------------------------------------------------------------------
# TNPM02: local native fixture build
# --------------------------------------------------------------------------

[[test]]
id = "TNPM02"
name = "local_native_fixture_build"
description = "Build the local native fixture in the host distro format"
timeout = 180
fatal = true
depends_on = ["TNPM01"]

[[test.step]]
run = "rm -rf /tmp/native-pm-parity /tmp/native-pm-parity-v2 /tmp/native-pm-parity-v2-src && mkdir -p /tmp/native-pm-parity && CONARY_BIN=${CONARY_BIN} /opt/remi-tests/fixtures/native/build-native-fixtures.sh ${native_target} /tmp/native-pm-parity /opt/remi-tests/fixtures/phase4-runtime-fixture && . /tmp/native-pm-parity/native-fixture.env && test -f \"$NATIVE_PKG_FILE\" && test \"$NATIVE_TARGET\" = \"${native_target}\" && test ${#NATIVE_PKG_SHA256} -eq 64 && case \"$NATIVE_PKG_FILE\" in /tmp/native-pm-parity/${native_glob}) true ;; *) echo \"unexpected native package path: $NATIVE_PKG_FILE\"; exit 1 ;; esac"

[test.step.assert]
exit_code = 0

# --------------------------------------------------------------------------
# TNPM02X: every source format installs on every target profile
# --------------------------------------------------------------------------

[[test]]
id = "TNPM02X"
name = "cross_source_format_lifecycle_matrix"
description = "RPM, DEB, and Arch install, update, rollback, and remove traces match native package-manager authority through selected-generation execution without runtime delegation"
timeout = 1200
fatal = true
depends_on = ["TNPM02"]

[[test.step]]
run = "CONARY_BIN=${CONARY_BIN} /opt/remi-tests/fixtures/native/run-cross-source-lifecycle-matrix.sh ${native_target}"

[test.step.assert]
exit_code = 0

# --------------------------------------------------------------------------
# TNPM03: local native install to the selected generation
# --------------------------------------------------------------------------

[[test]]
id = "TNPM03"
name = "local_native_install"
description = "Convert and install a local native package into the selected generation and exact CAS"
timeout = 180
fatal = true
depends_on = ["TNPM02X"]

[[test.step]]
run = ". /tmp/native-pm-parity/native-fixture.env && CONARY_TEST_SKIP_GENERATION_MOUNT=1 ${CONARY_BIN} install \"$NATIVE_PKG_FILE\" --convert-to-ccs --from ${native_profile} --db-path ${DB_PATH} --root /conary --no-deps --yes --sandbox always"

[test.step.assert]
exit_code = 0
stdout_contains_any = ["Successfully installed", "Installed", "phase4-runtime-fixture"]

[[test.step]]
run = "/opt/remi-tests/fixtures/native/assert-selected-generation.py --root /conary --expect-sha256 /etc/phase4-runtime-fixture/app.conf=1da0b50cb027387347265437a11956c1433788d045e4c63b379a1e0740882e7c --expect-sha256 /usr/bin/phase4-runtime-fixture=517631de24336343a6aaf1a8f704d326299c14c619fe8c8d75d17824d074bd7f --expect-sha256 /usr/include/phase4-runtime-fixture/api.h=88904c275ae0f26a566c03f488ae82869c47ac921fb6f0cf7979d5845f199c88"

[test.step.assert]
exit_code = 0

# --------------------------------------------------------------------------
# TNPM04: exact local native metadata
# --------------------------------------------------------------------------

[[test]]
id = "TNPM04"
name = "local_native_exact_metadata"
description = "Installed native fixture has exact package, file, provider, dependency, config, and native lifecycle metadata"
timeout = 60
fatal = true
depends_on = ["TNPM03"]

[[test.step]]
run = "sqlite3 ${DB_PATH} \"SELECT COUNT(*) || ' troves' FROM troves WHERE name = 'phase4-runtime-fixture'; SELECT name || '|' || version || '|' || COALESCE(architecture, '') || '|' || COALESCE(version_scheme, '') || '|' || COALESCE(source_profile, '') || '|' || COALESCE(install_source, '') || '|' || COALESCE(install_reason, '') FROM troves WHERE name = 'phase4-runtime-fixture'\""

[test.step.assert]
exit_code = 0
stdout_contains_all = ["1 troves", "phase4-runtime-fixture|${native_fixture_version}|${native_arch}|${native_scheme}|${native_profile}|file|explicit"]

[[test.step]]
run = "sqlite3 ${DB_PATH} \"SELECT COUNT(*) || ' regular files' FROM files WHERE trove_id = (SELECT id FROM troves WHERE name = 'phase4-runtime-fixture') AND json_extract(payload_node_json, '$.source.kind.type') = 'regular'; SELECT path || '|' || coalesce(content_sha256, '-') || '|' || coalesce(content_size, '-') || '|' || json_extract(payload_node_json, '$.source.kind.type') || '|' || json_extract(payload_node_json, '$.source.mode') FROM files WHERE trove_id = (SELECT id FROM troves WHERE name = 'phase4-runtime-fixture') AND json_extract(payload_node_json, '$.source.kind.type') = 'regular' ORDER BY path\""

[test.step.assert]
exit_code = 0
stdout_contains_all = ["3 regular files", "/etc/phase4-runtime-fixture/app.conf|1da0b50cb027387347265437a11956c1433788d045e4c63b379a1e0740882e7c|61|regular|33188", "/usr/bin/phase4-runtime-fixture|517631de24336343a6aaf1a8f704d326299c14c619fe8c8d75d17824d074bd7f|44|regular|33188", "/usr/include/phase4-runtime-fixture/api.h|88904c275ae0f26a566c03f488ae82869c47ac921fb6f0cf7979d5845f199c88|130|regular|33188"]

[[test.step]]
run = "sqlite3 ${DB_PATH} \"SELECT COUNT(*) || ' provides' FROM provides WHERE trove_id = (SELECT id FROM troves WHERE name = 'phase4-runtime-fixture'); SELECT COUNT(*) || ' file provides' FROM provides WHERE trove_id = (SELECT id FROM troves WHERE name = 'phase4-runtime-fixture') AND kind = 'file'; SELECT capability || '|' || COALESCE(version, '') || '|' || COALESCE(kind, '') FROM provides WHERE trove_id = (SELECT id FROM troves WHERE name = 'phase4-runtime-fixture') AND kind = 'package'; SELECT COALESCE((SELECT group_concat(capability, ',') FROM (SELECT capability FROM provides WHERE trove_id = (SELECT id FROM troves WHERE name = 'phase4-runtime-fixture') AND kind = 'file' ORDER BY capability)), 'no file provides')\""

[test.step.assert]
exit_code = 0
stdout_contains_all = ["${native_provider_count} provides", "${native_file_provider_count} file provides", "phase4-runtime-fixture|${native_fixture_version}|package", "${native_file_provider_set}"]

[[test.step]]
run = "sqlite3 ${DB_PATH} \"SELECT COUNT(*) || ' requirement groups' FROM package_requirement_groups WHERE trove_id = (SELECT id FROM troves WHERE name = 'phase4-runtime-fixture')\""

[test.step.assert]
exit_code = 0
stdout_contains = "${native_dependency_count} requirement groups"

[[test.step]]
run = "sqlite3 ${DB_PATH} \"SELECT COALESCE((SELECT group_concat(kind || '|' || version_scheme || '|' || requirement_json, char(10)) FROM package_requirement_groups WHERE trove_id = (SELECT id FROM troves WHERE name = 'phase4-runtime-fixture') ORDER BY id), 'no-deps')\""

[test.step.assert]
exit_code = 0
stdout_contains = "${native_dependency_probe}"

[[test.step]]
run = "sqlite3 ${DB_PATH} \"SELECT COUNT(*) || ' config rows' FROM config_files WHERE trove_id = (SELECT id FROM troves WHERE name = 'phase4-runtime-fixture')\""

[test.step.assert]
exit_code = 0
stdout_contains = "${native_config_count} config rows"

[[test.step]]
run = "sqlite3 ${DB_PATH} \"SELECT path || '|' || original_hash || '|' || COALESCE(current_hash, '') || '|' || noreplace || '|' || status || '|' || source FROM config_files WHERE trove_id = (SELECT id FROM troves WHERE name = 'phase4-runtime-fixture') ORDER BY path\""

[test.step.assert]
exit_code = 0
stdout_contains = "/etc/phase4-runtime-fixture/app.conf|1da0b50cb027387347265437a11956c1433788d045e4c63b379a1e0740882e7c|1da0b50cb027387347265437a11956c1433788d045e4c63b379a1e0740882e7c|1|pristine|${native_config_source}"

[[test.step]]
run = "sqlite3 ${DB_PATH} \"SELECT COUNT(*) || ' lifecycle bundles' FROM installed_native_lifecycle_bundles WHERE trove_id = (SELECT id FROM troves WHERE name = 'phase4-runtime-fixture'); SELECT source_format || '|' || source_package || '|' || source_version || '|' || scriptlet_fidelity || '|' || lifecycle_state FROM installed_native_lifecycle_bundles WHERE trove_id = (SELECT id FROM troves WHERE name = 'phase4-runtime-fixture')\""

[test.step.assert]
exit_code = 0
stdout_contains_all = ["1 lifecycle bundles", "${native_target}|phase4-runtime-fixture|${native_fixture_version}|${native_lifecycle_fidelity}|installed"]

# --------------------------------------------------------------------------
# TNPM05: daily query surface
# --------------------------------------------------------------------------

[[test]]
id = "TNPM05"
name = "local_native_daily_queries"
description = "List, info, files, path ownership, whatprovides, and whatbreaks answer daily-driver questions"
timeout = 90
depends_on = ["TNPM04"]

[[test.step]]
conary = "list phase4-runtime-fixture --info"

[test.step.assert]
exit_code = 0
stdout_contains_all = ["Name        : phase4-runtime-fixture", "Version     : ${native_fixture_version}", "Authority   : conary-owned", "Source      : file", "Install Type: Explicit", "Pinned      : no"]

[[test.step]]
conary = "list phase4-runtime-fixture --files"

[test.step.assert]
exit_code = 0
stdout_contains_all = ["/usr/bin/phase4-runtime-fixture", "/etc/phase4-runtime-fixture/app.conf"]

[[test.step]]
conary = "list --path /usr/bin/phase4-runtime-fixture"

[test.step.assert]
exit_code = 0
stdout_contains_all = ["phase4-runtime-fixture ${native_fixture_version} provides:", "/usr/bin/phase4-runtime-fixture"]

[[test.step]]
conary = "query whatprovides phase4-runtime-fixture"

[test.step.assert]
exit_code = 0
stdout_contains_all = ["Capability 'phase4-runtime-fixture' is provided by:", "phase4-runtime-fixture ${native_fixture_version}"]

[[test.step]]
conary = "query whatbreaks phase4-runtime-fixture"

[test.step.assert]
exit_code = 0
stdout_contains = "can be safely removed"

# --------------------------------------------------------------------------
# TNPM06: pin blocks mutation before files or DB are changed
# --------------------------------------------------------------------------

[[test]]
id = "TNPM06"
name = "pin_blocks_remove"
description = "Pinned Conary-owned package cannot be removed and remains intact"
timeout = 90
fatal = true
depends_on = ["TNPM05"]

[[test.step]]
conary = "pin phase4-runtime-fixture"

[test.step.assert]
exit_code = 0
stdout_contains = "Pinned package 'phase4-runtime-fixture'"

[[test.step]]
run = "CONARY_TEST_SKIP_GENERATION_MOUNT=1 ${CONARY_BIN} remove phase4-runtime-fixture --db-path ${DB_PATH} --root /conary --sandbox always --yes 2>&1"

[test.step.assert]
exit_code_not = 0
stdout_contains = "pinned and cannot be removed"

[[test.step]]
run = "/opt/remi-tests/fixtures/native/assert-selected-generation.py --root /conary --expect-sha256 /usr/bin/phase4-runtime-fixture=517631de24336343a6aaf1a8f704d326299c14c619fe8c8d75d17824d074bd7f"

[test.step.assert]
exit_code = 0

[[test.step]]
run = "sqlite3 ${DB_PATH} \"SELECT COUNT(*) || ' installed' FROM troves WHERE name = 'phase4-runtime-fixture'\""

[test.step.assert]
exit_code = 0
stdout_contains = "1 installed"

[[test.step]]
conary = "query whatbreaks phase4-runtime-fixture"

[test.step.assert]
exit_code = 0
stdout_contains = "remove would be refused before mutation"

# --------------------------------------------------------------------------
# TNPM07: unpin and update through conary update
# --------------------------------------------------------------------------

[[test]]
id = "TNPM07"
name = "unpin_and_update_local_native"
description = "Unpin restores mutation, then conary update applies an exactly typed signed CCS package from synchronized repository metadata"
timeout = 240
fatal = true
depends_on = ["TNPM06"]

[[test.step]]
conary = "unpin phase4-runtime-fixture"

[test.step.assert]
exit_code = 0
stdout_contains = "Unpinned package 'phase4-runtime-fixture'"

[[test.step]]
run = "CONARY_BIN=${CONARY_BIN} /opt/remi-tests/fixtures/native/prepare-signed-update-repository.sh ${native_target} ${native_profile} ${DB_PATH}"

[test.step.assert]
exit_code = 0

[[test.step]]
run = "sqlite3 ${DB_PATH} \"SELECT r.default_strategy || '|' || r.source_profile || '|' || rp.name || '|' || rp.version || '|' || rp.version_scheme || '|' || rp.architecture || '|' || k.status FROM repositories r JOIN repository_packages rp ON rp.repository_id = r.id JOIN repository_package_keys k ON k.repository_id = r.id WHERE r.name = 'slice-d-local-update'\""

[test.step.assert]
exit_code = 0
stdout_contains = "binary|${native_profile}|phase4-runtime-fixture|${native_update_version}|${native_scheme}|${native_arch}|active"

[[test.step]]
run = "CONARY_TEST_SKIP_GENERATION_MOUNT=1 ${CONARY_BIN} update phase4-runtime-fixture --db-path ${DB_PATH} --root /conary --yes --sandbox always"

[test.step.assert]
exit_code = 0
stdout_contains = "phase4-runtime-fixture"

[[test.step]]
run = "/opt/remi-tests/fixtures/native/assert-selected-generation.py --root /conary --expect-sha256 /etc/phase4-runtime-fixture/app.conf=2c76059e3429b1a8429d7026acabffefe3bc738c7344b3f345c2e4d502b1e8dc --expect-sha256 /usr/bin/phase4-runtime-fixture=67366d905b9464bec8c4ff41021bd536292488fc1777cbf6a1fb41a438b2a283"

[test.step.assert]
exit_code = 0

[[test.step]]
run = "sqlite3 ${DB_PATH} \"SELECT name || '|' || version || '|' || COALESCE(architecture, '') || '|' || COALESCE(version_scheme, '') || '|' || COALESCE(source_profile, '') FROM troves WHERE name = 'phase4-runtime-fixture'\""

[test.step.assert]
exit_code = 0
stdout_contains = "phase4-runtime-fixture|${native_update_version}|${native_arch}|${native_scheme}|${native_profile}"

[[test.step]]
conary = "list phase4-runtime-fixture --info"

[test.step.assert]
exit_code = 0
stdout_contains = "Version     : ${native_update_version}"

# --------------------------------------------------------------------------
# TNPM08: remove and history
# --------------------------------------------------------------------------

[[test]]
id = "TNPM08"
name = "remove_updated_local_native"
description = "Remove the updated Conary-owned native package and verify history"
timeout = 120
fatal = true
depends_on = ["TNPM07"]

[[test.step]]
run = "CONARY_TEST_SKIP_GENERATION_MOUNT=1 ${CONARY_BIN} remove phase4-runtime-fixture --db-path ${DB_PATH} --root /conary --sandbox always --yes"

[test.step.assert]
exit_code = 0
stdout_contains = "Removed package: phase4-runtime-fixture version ${native_update_version}"

