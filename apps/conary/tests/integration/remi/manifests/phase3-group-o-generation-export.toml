# tests/integration/remi/manifests/phase3-group-o-generation-export.toml
#
# Phase 3, Group O: Generation artifact export validation.
#
# These tests build generation-derived qcow2 images, copy them out of the
# source guest, then boot the generated images as local QEMU inputs.
#
# The source image must already be generation-builder-ready: cpio, dracut,
# depmod, systemd-repart, qemu-img, mkfs tools, and composefs inspection tools
# are fixture inputs. The suite must not install those helper tools through
# Conary on a partial live root before the system is generation-owned.
#
# TGE02 is the supported-host basis: it assembles a Fedora 44 root on a scratch
# disk out of ordinary repository installs, with no bootstrap surface involved.
# It pins the Fedora 44 source profile rather than following the ${REMI_DISTRO}
# selector, because its package set is Fedora's.

[suite]
name = "Generation Artifact Export QEMU"
phase = 3

[[test]]
id = "TGE01"
name = "installed_generation_export_fails_closed_without_self_contained_root"
description = "A runtime generation whose base OS is not represented in Conary CAS must fail before publishing a bootable artifact"
timeout = 900
group = "generation-export"
fatal = true

[[test.step]]
[test.step.qemu_boot]
image = "fedora44-guest-v2"
memory_mb = 2048
timeout_seconds = 900
ssh_port = 2240
stage_conary = true
commands = [
    "conary system init",
    "mkdir -p /var/tmp/conary-generation-export",
    "conary system generation build --yes > /var/tmp/conary-generation-export/build.log 2>&1; code=$?; cat /var/tmp/conary-generation-export/build.log; test \"$code\" -ne 0",
    "grep -q 'not self-contained' /var/tmp/conary-generation-export/build.log",
    "grep -Eq '(/sbin/init|unresolved CAS-backed path)' /var/tmp/conary-generation-export/build.log",
    "test ! -e /conary/generations/0/.conary-artifact.json",
    "echo installed-generation-export-failed-closed",
]
expect_output = [
    "installed-generation-export-failed-closed",
]

[test.step.assert]
exit_code = 0

[[test]]
id = "TGE03"
name = "installed_generation_build_rejects_missing_runtime_cas_object"
description = "A CAS-backed installed runtime generation fails before artifact publication if an included regular-file CAS object disappears"
timeout = 1800
group = "generation-export"

[[test.step]]
[test.step.qemu_boot]
image = "fedora44-guest-v2"
memory_mb = 2048
timeout_seconds = 1500
ssh_port = 2244
stage_conary = true
commands = [
    "conary system init",
    "for cmd in sqlite3 cpio dracut depmod; do command -v \"$cmd\" >/dev/null || { echo \"generation-builder-ready QEMU fixture missing $cmd\"; exit 1; }; done",
    "test -d /usr/lib/dracut || { echo 'generation-builder-ready QEMU fixture missing /usr/lib/dracut'; exit 1; }",
    "conary system adopt --system --full",
    "DB=/var/lib/conary/conary.db; HASH=$(sqlite3 \"$DB\" \"select f.content_sha256 from files f join troves t on t.id = f.trove_id where t.install_source in ('adopted-full','taken','repository','file') and f.content_sha256 is not null and length(f.content_sha256) = 64 and f.content_sha256 not glob '*[^0-9a-f]*' and f.path not like '/var/%' and f.path not like '/tmp/%' and f.path not like '/run/%' and f.path not like '/home/%' and f.path not like '/root/%' and f.path not like '/srv/%' and f.path not like '/opt/%' and f.path not like '/proc/%' and f.path not like '/sys/%' and f.path not like '/dev/%' and f.path not like '/mnt/%' and f.path not like '/media/%' limit 1\"); test -n \"$HASH\"; PREFIX=$(printf '%s' \"$HASH\" | cut -c1-2); SUFFIX=$(printf '%s' \"$HASH\" | cut -c3-); OBJ_BASE=$(readlink -f /conary/objects); test -d \"$OBJ_BASE\"; OBJ=$OBJ_BASE/$PREFIX/$SUFFIX; test -f \"$OBJ\"; rm -f \"$OBJ\"; echo \"$HASH\" > /var/tmp/missing-cas.hash",
    "conary system generation build --yes > /var/tmp/missing-cas.log 2>&1; code=$?; cat /var/tmp/missing-cas.log; test \"$code\" -ne 0",
    "grep -Eq 'missing CAS object|Checksum mismatch|size mismatch' /var/tmp/missing-cas.log",
    "test -z \"$(find /conary/generations -mindepth 2 -maxdepth 2 -name .conary-artifact.json -print -quit 2>/dev/null)\"",
    "echo installed-runtime-missing-cas-rejected",
]
expect_output = [
    "installed-runtime-missing-cas-rejected",
]

[test.step.assert]
exit_code = 0

[[test]]
id = "TGE04"
name = "installed_runtime_generation_export_boots"
description = "A full CAS-backed installed runtime generation exports to qcow2 and boots under UEFI"
timeout = 7200
group = "generation-export"

[[test.step]]
[test.step.qemu_boot]
image = "fedora44-guest-v2"
memory_mb = 2048
timeout_seconds = 5400
ssh_port = 2245
stage_conary = true
scratch_disk_mb = 65536
commands = [
    "conary system init",
    "for cmd in sqlite3 cpio dracut depmod systemd-repart qemu-img mkfs.ext4 mkfs.vfat composefs-info; do command -v \"$cmd\" >/dev/null || { echo \"generation-builder-ready QEMU fixture missing $cmd\"; exit 1; }; done",
    "test -d /usr/lib/dracut || { echo 'generation-builder-ready QEMU fixture missing /usr/lib/dracut'; exit 1; }",
    "test -f /usr/lib/systemd/boot/efi/systemd-bootx64.efi || { echo 'generation-builder-ready QEMU fixture missing systemd-boot EFI binary'; exit 1; }",
    "test -f /usr/lib64/ld-linux-x86-64.so.2 && test ! -L /usr/lib64/ld-linux-x86-64.so.2 || { echo 'Fedora runtime loader is not the expected regular source file' >&2; exit 1; }",
    "mkdir -p /etc/ssh/authorized_keys /etc/ssh/sshd_config.d; test -s /root/.ssh/authorized_keys; cp /root/.ssh/authorized_keys /etc/ssh/authorized_keys/root; chmod 0644 /etc/ssh/authorized_keys/root; printf '%s\\n' 'AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys/%u' > /etc/ssh/sshd_config.d/90-conary-test-authorized-keys.conf; sshd_config=/etc/ssh/sshd_config; sshd_config_tmp=/etc/ssh/sshd_config.conary-test; if ! grep -q '/etc/ssh/authorized_keys/%u' \"$sshd_config\"; then { printf '%s\\n' 'AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys/%u'; cat \"$sshd_config\"; } > \"$sshd_config_tmp\"; mv \"$sshd_config_tmp\" \"$sshd_config\"; fi",
    "conary system adopt --system --full",
    "for i in $(seq 1 20); do test -b /dev/disk/by-id/virtio-conary-scratch && exit 0; sleep 1; done; ls -l /dev/disk/by-id /dev/vd*; false",
    "mkfs.ext4 -F /dev/disk/by-id/virtio-conary-scratch",
    "mkdir -p /mnt/conary-scratch",
    "mount -o noatime /dev/disk/by-id/virtio-conary-scratch /mnt/conary-scratch",
    "mkdir -p /mnt/conary-scratch/export",
    "set -e; set +e; conary system generation build --yes > /var/tmp/installed-runtime-build.log 2>&1; BUILD_CODE=$?; set -e; cat /var/tmp/installed-runtime-build.log; test \"$BUILD_CODE\" -eq 0; GEN=$(sed -n 's/.*Generation \\([0-9][0-9]*\\).*/\\1/p' /var/tmp/installed-runtime-build.log | tail -1); test -n \"$GEN\"; echo \"$GEN\" > /mnt/conary-scratch/export/installed-runtime-generation.txt; for REQUIRED in .conary-artifact.json cas-manifest.json boot-assets/manifest.json; do test -f /conary/generations/$GEN/$REQUIRED || { echo \"generation $GEN missing $REQUIRED\" >&2; exit 1; }; done; composefs-info ls /conary/generations/$GEN/root.erofs > /var/tmp/installed-runtime-root-listing.txt; grep -Eq '^/usr/lib64/ld-linux-x86-64\\.so\\.2[[:space:]]+@ [0-9a-f]{2}/[0-9a-f]{62}$' /var/tmp/installed-runtime-root-listing.txt || { echo 'generation did not preserve Fedora runtime loader as a CAS-backed regular file' >&2; grep -E '^/(usr/)?lib64/ld-linux|^/lib64' /var/tmp/installed-runtime-root-listing.txt >&2 || true; exit 1; }; conary system generation export --path /conary/generations/$GEN --format qcow2 --output /mnt/conary-scratch/export/installed-runtime-generation.qcow2",
    "test -s /mnt/conary-scratch/export/installed-runtime-generation.qcow2",
    "echo installed-runtime-generation-export-ok",
]
copy_from_guest = [
    { source = "/mnt/conary-scratch/export/installed-runtime-generation.qcow2", dest = "/tmp/conary-generation-export/installed-runtime-generation.qcow2" },
    { source = "/mnt/conary-scratch/export/installed-runtime-generation.txt", dest = "/tmp/conary-generation-export/installed-runtime-generation.txt" },
]
expect_output = [
    "installed-runtime-generation-export-ok",
]

[test.step.assert]
exit_code = 0

[[test.step]]
[test.step.qemu_boot]
image = "local-installed-runtime-generation-export"
local_image_path = "/tmp/conary-generation-export/installed-runtime-generation.qcow2"
memory_mb = 2048
timeout_seconds = 420
ssh_port = 2246
copy_to_guest = [
    { source = "/tmp/conary-generation-export/installed-runtime-generation.txt", dest = "/tmp/expected-generation" },
]
commands = [
    "EXPECTED=$(cat /tmp/expected-generation); tr ' ' '\\n' < /proc/cmdline | grep -Fxq -- \"conary.generation=$EXPECTED\"",
    "EXPECTED=$(cat /tmp/expected-generation); test -f /conary/generations/$EXPECTED/.conary-artifact.json",
    "EXPECTED=$(cat /tmp/expected-generation); test -f /conary/generations/$EXPECTED/cas-manifest.json",
    "EXPECTED=$(cat /tmp/expected-generation); test -f /conary/generations/$EXPECTED/boot-assets/manifest.json",
    "EXPECTED=$(cat /tmp/expected-generation); TARGET=$(readlink /conary/current); test \"$TARGET\" = \"generations/$EXPECTED\" || test \"$TARGET\" = \"$EXPECTED\" || test \"$(readlink -f /conary/current)\" = \"/conary/generations/$EXPECTED\"",
    "echo installed-runtime-generation-export-booted",
]
expect_output = [
    "installed-runtime-generation-export-booted",
]

[test.step.assert]
exit_code = 0

[[test]]
id = "TGE05"
name = "installed_runtime_generation_export_preserves_file_capability_xattrs"
description = "Export baseline and upgraded installed-runtime generations, then boot both qcow2 artifacts to prove captured-root lifecycle continuity and security.capability rollback-equivalent behavior"
timeout = 10800
group = "generation-export"

[[test.step]]
[test.step.qemu_boot]
image = "fedora44-guest-v2"
memory_mb = 2048
timeout_seconds = 7200
ssh_port = 2247
stage_conary = true
scratch_disk_mb = 65536
commands = [
    "conary system init",
    "for cmd in sqlite3 cpio dracut depmod systemd-repart qemu-img mkfs.ext4 mkfs.vfat composefs-info; do command -v \"$cmd\" >/dev/null || { echo \"generation-builder-ready QEMU fixture missing $cmd\"; exit 1; }; done",
    "test -d /usr/lib/dracut || { echo 'generation-builder-ready QEMU fixture missing /usr/lib/dracut'; exit 1; }",
    "test -f /usr/lib/systemd/boot/efi/systemd-bootx64.efi || { echo 'generation-builder-ready QEMU fixture missing systemd-boot EFI binary'; exit 1; }",
    "mkdir -p /etc/ssh/authorized_keys /etc/ssh/sshd_config.d; test -s /root/.ssh/authorized_keys; cp /root/.ssh/authorized_keys /etc/ssh/authorized_keys/root; chmod 0644 /etc/ssh/authorized_keys/root; printf '%s\\n' 'AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys/%u' > /etc/ssh/sshd_config.d/90-conary-test-authorized-keys.conf; sshd_config=/etc/ssh/sshd_config; sshd_config_tmp=/etc/ssh/sshd_config.conary-test; if ! grep -q '/etc/ssh/authorized_keys/%u' \"$sshd_config\"; then { printf '%s\\n' 'AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys/%u'; cat \"$sshd_config\"; } > \"$sshd_config_tmp\"; mv \"$sshd_config_tmp\" \"$sshd_config\"; fi",
    "conary system adopt --system --full",
    "for i in $(seq 1 20); do test -b /dev/disk/by-id/virtio-conary-scratch && exit 0; sleep 1; done; ls -l /dev/disk/by-id /dev/vd*; false",
    "mkfs.ext4 -F /dev/disk/by-id/virtio-conary-scratch",
    "mkdir -p /mnt/conary-scratch",
    "mount -o noatime /dev/disk/by-id/virtio-conary-scratch /mnt/conary-scratch",
    "mkdir -p /mnt/conary-scratch/export",
    "conary system generation build --yes > /var/tmp/generation-capability-seed.log 2>&1; cat /var/tmp/generation-capability-seed.log; SEED_GEN=$(awk '/^Generation [0-9][0-9]* built[.]$/ {print $2}' /var/tmp/generation-capability-seed.log | tail -1); test -n \"$SEED_GEN\"; conary system generation switch \"$SEED_GEN\" --yes; test -L /conary/current",
    "rm -rf /tmp/group-o-cap-base /tmp/group-o-cap-base-output && mkdir -p /tmp/group-o-cap-base/stage/usr/bin /tmp/group-o-cap-base-output && printf '#!/bin/sh\\necho baseline authority\\n' > /tmp/group-o-cap-base/stage/usr/bin/group-o-cap-demo && chmod 0755 /tmp/group-o-cap-base/stage/usr/bin/group-o-cap-demo && conary ccs init /tmp/group-o-cap-base --name group-o-cap-demo --version 1.0.0 && conary ccs build /tmp/group-o-cap-base --output /tmp/group-o-cap-base-output --source /tmp/group-o-cap-base/stage/usr/bin --install-prefix /usr/bin --key ${FIXTURE_CCS_KEY}",
    "set -e; BASE_CCS=$(ls /tmp/group-o-cap-base-output/*.ccs | head -1); test -n \"$BASE_CCS\"; set +e; conary ccs install --yes \"$BASE_CCS\" --policy ${FIXTURE_CCS_POLICY} --sandbox always > /var/tmp/group-o-cap-base-install.log 2>&1; INSTALL_CODE=$?; set -e; cat /var/tmp/group-o-cap-base-install.log; test \"$INSTALL_CODE\" -eq 0; BASELINE_GEN=$(readlink -f /conary/current | sed 's#.*/##'); test -n \"$BASELINE_GEN\"; printf '%s\\n' \"$BASELINE_GEN\" > /mnt/conary-scratch/export/group-o-cap-baseline-generation.txt; conary system generation info \"$BASELINE_GEN\" > /var/tmp/group-o-cap-baseline-info.txt; cat /var/tmp/group-o-cap-baseline-info.txt; composefs-info dump /conary/generations/$BASELINE_GEN/root.erofs > /var/tmp/group-o-cap-baseline-root-dump.txt; test \"$(grep -Ec '^/usr/bin/group-o-cap-demo([[:space:]]|$)' /var/tmp/group-o-cap-baseline-root-dump.txt)\" -eq 1; ! grep -E '^/usr/bin/group-o-cap-demo([[:space:]].*)?security\\.capability=' /var/tmp/group-o-cap-baseline-root-dump.txt; conary system generation export --path /conary/generations/$BASELINE_GEN --format qcow2 --output /mnt/conary-scratch/export/group-o-cap-baseline-generation.qcow2",
    "rm -rf /tmp/group-o-cap-upgrade /tmp/group-o-cap-upgrade-output && mkdir -p /tmp/group-o-cap-upgrade/stage/usr/bin /tmp/group-o-cap-upgrade-output && printf '#!/bin/sh\\necho capability authority\\n' > /tmp/group-o-cap-upgrade/stage/usr/bin/group-o-cap-demo && chmod 0755 /tmp/group-o-cap-upgrade/stage/usr/bin/group-o-cap-demo && conary ccs init /tmp/group-o-cap-upgrade --name group-o-cap-demo --version 2.0.0 && printf '\\n[[file_capabilities]]\\npath = \"/usr/bin/group-o-cap-demo\"\\ncapabilities = [\"cap_net_bind_service\"]\\npermitted = true\\neffective = true\\ninheritable = false\\n' >> /tmp/group-o-cap-upgrade/ccs.toml && conary ccs build /tmp/group-o-cap-upgrade --output /tmp/group-o-cap-upgrade-output --source /tmp/group-o-cap-upgrade/stage/usr/bin --install-prefix /usr/bin --key ${FIXTURE_CCS_KEY}",
    "set -e; CAP_CCS=$(ls /tmp/group-o-cap-upgrade-output/*.ccs | head -1); test -n \"$CAP_CCS\"; set +e; conary ccs install --yes \"$CAP_CCS\" --policy ${FIXTURE_CCS_POLICY} --sandbox always > /var/tmp/group-o-cap-upgrade-install.log 2>&1; INSTALL_CODE=$?; set -e; cat /var/tmp/group-o-cap-upgrade-install.log; test \"$INSTALL_CODE\" -eq 0; CAP_GEN=$(readlink -f /conary/current | sed 's#.*/##'); test -n \"$CAP_GEN\"; test \"$CAP_GEN\" != \"$(cat /mnt/conary-scratch/export/group-o-cap-baseline-generation.txt)\"; printf '%s\\n' \"$CAP_GEN\" > /mnt/conary-scratch/export/group-o-cap-enabled-generation.txt; conary system generation info \"$CAP_GEN\" > /var/tmp/group-o-cap-enabled-info.txt; cat /var/tmp/group-o-cap-enabled-info.txt; composefs-info dump /conary/generations/$CAP_GEN/root.erofs > /var/tmp/group-o-cap-enabled-root-dump.txt; test \"$(grep -Ec '^/usr/bin/group-o-cap-demo([[:space:]]|$)' /var/tmp/group-o-cap-enabled-root-dump.txt)\" -eq 1; grep -E '^/usr/bin/group-o-cap-demo([[:space:]].*)?security\\.capability=' /var/tmp/group-o-cap-enabled-root-dump.txt; conary system generation export --path /conary/generations/$CAP_GEN --format qcow2 --output /mnt/conary-scratch/export/group-o-cap-enabled-generation.qcow2",
    "test -s /mnt/conary-scratch/export/group-o-cap-baseline-generation.qcow2",
    "test -s /mnt/conary-scratch/export/group-o-cap-enabled-generation.qcow2",
    "echo installed-runtime-generation-file-capability-export-ok",
]
copy_to_guest = [
    { source = "apps/conary/tests/fixtures/ccs-test-authority", dest = "/opt/remi-tests/fixtures/ccs-test-authority" },
]
copy_from_guest = [
    { source = "/mnt/conary-scratch/export/group-o-cap-baseline-generation.qcow2", dest = "/tmp/conary-generation-export/group-o-cap-baseline-generation.qcow2" },
    { source = "/mnt/conary-scratch/export/group-o-cap-baseline-generation.txt", dest = "/tmp/conary-generation-export/group-o-cap-baseline-generation.txt" },
    { source = "/mnt/conary-scratch/export/group-o-cap-enabled-generation.qcow2", dest = "/tmp/conary-generation-export/group-o-cap-enabled-generation.qcow2" },
    { source = "/mnt/conary-scratch/export/group-o-cap-enabled-generation.txt", dest = "/tmp/conary-generation-export/group-o-cap-enabled-generation.txt" },
]
expect_output = [
    "installed-runtime-generation-file-capability-export-ok",
]

[test.step.assert]
exit_code = 0

[[test.step]]
[test.step.qemu_boot]
image = "local-group-o-cap-baseline-generation-export"
local_image_path = "/tmp/conary-generation-export/group-o-cap-baseline-generation.qcow2"
memory_mb = 2048
timeout_seconds = 420
ssh_port = 2248
copy_to_guest = [
    { source = "/tmp/conary-generation-export/group-o-cap-baseline-generation.txt", dest = "/tmp/expected-generation" },
]
commands = [
    "EXPECTED=$(cat /tmp/expected-generation); tr ' ' '\\n' < /proc/cmdline | grep -Fxq -- \"conary.generation=$EXPECTED\"",
    "EXPECTED=$(cat /tmp/expected-generation); TARGET=$(readlink /conary/current); test \"$TARGET\" = \"generations/$EXPECTED\" || test \"$TARGET\" = \"$EXPECTED\" || test \"$(readlink -f /conary/current)\" = \"/conary/generations/$EXPECTED\"",
    "test -L /etc/systemd/system/dbus.service",
    "test -L /etc/systemd/system/multi-user.target.wants/sshd.service",
    "test -L /etc/systemd/system/multi-user.target.wants/NetworkManager.service",
    "test -s /etc/ssh/authorized_keys/root",
    "grep -q '/etc/ssh/authorized_keys/%u' /etc/ssh/sshd_config",
    "test -x /usr/bin/group-o-cap-demo",
    "if command -v getcap >/dev/null 2>&1; then OUT=$(getcap -n /usr/bin/group-o-cap-demo 2>/dev/null || true); printf '%s\\n' \"$OUT\"; test -z \"$OUT\"; elif command -v getfattr >/dev/null 2>&1; then ! getfattr --only-values -n security.capability /usr/bin/group-o-cap-demo >/tmp/group-o-cap.bin 2>/dev/null; elif command -v attr >/dev/null 2>&1; then ! attr -q -g security.capability /usr/bin/group-o-cap-demo >/tmp/group-o-cap.bin 2>/dev/null; elif command -v python3 >/dev/null 2>&1; then python3 -c 'import os,sys; raise SystemExit(0 if \"security.capability\" not in os.listxattr(sys.argv[1]) else 1)' /usr/bin/group-o-cap-demo; else echo 'missing capability inspection helper' >&2; exit 1; fi",
    "echo installed-runtime-generation-file-capability-baseline-ok",
]
expect_output = [
    "installed-runtime-generation-file-capability-baseline-ok",
]

[test.step.assert]
exit_code = 0

[[test.step]]
[test.step.qemu_boot]
image = "local-group-o-cap-enabled-generation-export"
local_image_path = "/tmp/conary-generation-export/group-o-cap-enabled-generation.qcow2"
memory_mb = 2048
timeout_seconds = 420
ssh_port = 2249
copy_to_guest = [
    { source = "/tmp/conary-generation-export/group-o-cap-enabled-generation.txt", dest = "/tmp/expected-generation" },
]
commands = [
    "EXPECTED=$(cat /tmp/expected-generation); tr ' ' '\\n' < /proc/cmdline | grep -Fxq -- \"conary.generation=$EXPECTED\"",
    "EXPECTED=$(cat /tmp/expected-generation); TARGET=$(readlink /conary/current); test \"$TARGET\" = \"generations/$EXPECTED\" || test \"$TARGET\" = \"$EXPECTED\" || test \"$(readlink -f /conary/current)\" = \"/conary/generations/$EXPECTED\"",
    "test -L /etc/systemd/system/dbus.service",
    "test -L /etc/systemd/system/multi-user.target.wants/sshd.service",
    "test -L /etc/systemd/system/multi-user.target.wants/NetworkManager.service",
    "test -s /etc/ssh/authorized_keys/root",
    "grep -q '/etc/ssh/authorized_keys/%u' /etc/ssh/sshd_config",
    "test -x /usr/bin/group-o-cap-demo",
    "if command -v getcap >/dev/null 2>&1; then OUT=$(getcap -n /usr/bin/group-o-cap-demo 2>/dev/null || true); printf '%s\\n' \"$OUT\"; printf '%s\\n' \"$OUT\" | grep -Eq 'cap_net_bind_service=ep'; elif command -v python3 >/dev/null 2>&1; then python3 -c 'import os,sys; expected=bytes.fromhex(\"0100000200040000000000000000000000000000\"); actual=os.getxattr(sys.argv[1], \"security.capability\"); raise SystemExit(0 if actual == expected else 1)' /usr/bin/group-o-cap-demo; elif command -v getfattr >/dev/null 2>&1 && command -v od >/dev/null 2>&1; then getfattr --only-values -n security.capability /usr/bin/group-o-cap-demo 2>/dev/null | od -An -tx1 -v | tr -d ' \\n' | grep -qx '0100000200040000000000000000000000000000'; elif command -v attr >/dev/null 2>&1 && command -v od >/dev/null 2>&1; then attr -q -g security.capability /usr/bin/group-o-cap-demo 2>/dev/null | od -An -tx1 -v | tr -d ' \\n' | grep -qx '0100000200040000000000000000000000000000'; else echo 'missing capability inspection helper' >&2; exit 1; fi",
    "echo installed-runtime-generation-file-capability-enabled-ok",
]
expect_output = [
    "installed-runtime-generation-file-capability-enabled-ok",
]

[test.step.assert]
exit_code = 0


[[test]]
id = "TGE02"
name = "supported_host_generation_export_boots"
description = "Assemble a Fedora 44 root from ordinary repository installs, publish it as a generation, export it to qcow2, then boot it under UEFI"
timeout = 7200
group = "generation-export"

[[test.step]]
[test.step.qemu_boot]
image = "fedora44-guest-v2"
memory_mb = 2048
timeout_seconds = 5400
ssh_port = 2242
stage_conary = true
scratch_disk_mb = 65536
copy_to_guest = [
    { source = "apps/conary/tests/fixtures/supported-host-generation-export", dest = "/opt/remi-tests/fixtures/supported-host-generation-export" },
    { source = "apps/conary/tests/fixtures/ccs-test-authority", dest = "/opt/remi-tests/fixtures/ccs-test-authority" },
]
commands = [
    "for cmd in sqlite3 cpio dracut depmod systemd-repart qemu-img mkfs.ext4 mkfs.vfat composefs-info; do command -v \"$cmd\" >/dev/null || { echo \"generation-builder-ready QEMU fixture missing $cmd\"; exit 1; }; done",
    "test -d /usr/lib/dracut || { echo 'generation-builder-ready QEMU fixture missing /usr/lib/dracut'; exit 1; }",
    "test -f /opt/remi-tests/fixtures/supported-host-generation-export/fixture-system.toml",
    "test -f /opt/remi-tests/fixtures/supported-host-generation-export/conary-qemu-test-access/ccs.toml",
    "test -f /opt/remi-tests/fixtures/supported-host-generation-export/conary-qemu-test-access/stage-links.sh",
    "for i in $(seq 1 20); do test -b /dev/disk/by-id/virtio-conary-scratch && exit 0; sleep 1; done; ls -l /dev/disk/by-id /dev/vd*; false",
    "mkfs.ext4 -F -O verity /dev/disk/by-id/virtio-conary-scratch",
    "mkdir -p /mnt/conary-scratch",
    "mount -o noatime /dev/disk/by-id/virtio-conary-scratch /mnt/conary-scratch",
    "mkdir -p /mnt/conary-scratch/sys /mnt/conary-scratch/export /mnt/conary-scratch/access-output",
    "set -e; ACCESS=/opt/remi-tests/fixtures/supported-host-generation-export/conary-qemu-test-access; KEYFILE=$ACCESS/stage/etc/ssh/authorized_keys/root; test -s /root/.ssh/authorized_keys; KEY=$(head -n 1 /root/.ssh/authorized_keys); test -n \"$KEY\"; grep -q '__CONARY_QEMU_TEST_PUBLIC_KEY__' \"$KEYFILE\"; sed -i \"s|__CONARY_QEMU_TEST_PUBLIC_KEY__|$KEY|\" \"$KEYFILE\"; ! grep -q '__CONARY_QEMU_TEST_PUBLIC_KEY__' \"$KEYFILE\"",
    "set -e; ACCESS=/opt/remi-tests/fixtures/supported-host-generation-export/conary-qemu-test-access; sh \"$ACCESS/stage-links.sh\" \"$ACCESS/stage\"; test -L \"$ACCESS/stage/etc/systemd/system/multi-user.target.wants/sshd.service\"; conary ccs build \"$ACCESS\" --output /mnt/conary-scratch/access-output --source \"$ACCESS/stage\" --key ${FIXTURE_CCS_KEY}",
    "ACCESS_CCS=$(ls /mnt/conary-scratch/access-output/*.ccs | head -1); test -n \"$ACCESS_CCS\"; printf '%s\\n' \"$ACCESS_CCS\" > /mnt/conary-scratch/access-ccs-path",
    "conary system init --db-path /mnt/conary-scratch/sys/conary.db",
    "conary repo add supported-host-fedora-44 ${REMI_ENDPOINT} --package-format json --default-strategy remi --remi-endpoint ${REMI_ENDPOINT} --source-profile fedora-44 --db-path /mnt/conary-scratch/sys/conary.db",
    "conary repo sync supported-host-fedora-44 --force --db-path /mnt/conary-scratch/sys/conary.db",
    "set -e; ACCESS_CCS=$(cat /mnt/conary-scratch/access-ccs-path); set +e; conary ccs install --yes \"$ACCESS_CCS\" --policy ${FIXTURE_CCS_POLICY} --sandbox always --db-path /mnt/conary-scratch/sys/conary.db > /var/tmp/supported-host-access-install.log 2>&1; INSTALL_CODE=$?; set -e; cat /var/tmp/supported-host-access-install.log; test \"$INSTALL_CODE\" -eq 0",
    "set -e; set +e; conary model apply --model /opt/remi-tests/fixtures/supported-host-generation-export/fixture-system.toml --db-path /mnt/conary-scratch/sys/conary.db --yes --no-autoremove > /var/tmp/supported-host-model-apply.log 2>&1; APPLY_CODE=$?; set -e; cat /var/tmp/supported-host-model-apply.log; test \"$APPLY_CODE\" -eq 0",
    "set -e; set +e; conary system generation publish --yes --db-path /mnt/conary-scratch/sys/conary.db > /var/tmp/supported-host-publish.log 2>&1; PUBLISH_CODE=$?; set -e; cat /var/tmp/supported-host-publish.log; if [ \"$PUBLISH_CODE\" -ne 0 ]; then sqlite3 -line /mnt/conary-scratch/sys/conary.db \"SELECT id, trigger_changeset_id, phase, status, state_number, generation_number, last_error FROM generation_publications WHERE recoverable = 1 ORDER BY id DESC LIMIT 1;\"; exit \"$PUBLISH_CODE\"; fi; GEN=$(sed -n 's/^Generation publication complete: generation \\([0-9][0-9]*\\) selected\\.$/\\1/p' /var/tmp/supported-host-publish.log | tail -1); test -n \"$GEN\"; printf '%s\\n' \"$GEN\" > /mnt/conary-scratch/export/supported-host-generation.txt",
    "set -e; GEN=$(cat /mnt/conary-scratch/export/supported-host-generation.txt); test -f /mnt/conary-scratch/sys/generations/$GEN/.conary-artifact.json; test -f /mnt/conary-scratch/sys/generations/$GEN/cas-manifest.json; test -f /mnt/conary-scratch/sys/generations/$GEN/boot-assets/manifest.json",
    "set -e; GEN=$(cat /mnt/conary-scratch/export/supported-host-generation.txt); composefs-info ls /mnt/conary-scratch/sys/generations/$GEN/root.erofs > /var/tmp/supported-host-root-listing.txt; grep -Eq '^/sbin[[:space:]].*-> /?usr/sbin$' /var/tmp/supported-host-root-listing.txt; grep -Eq '^/usr/sbin[[:space:]].*-> /?(usr/)?bin$' /var/tmp/supported-host-root-listing.txt",
    "set -e; GEN=$(cat /mnt/conary-scratch/export/supported-host-generation.txt); conary system generation export --path /mnt/conary-scratch/sys/generations/$GEN --format qcow2 --output /mnt/conary-scratch/export/supported-host-generation.qcow2",
    "test -s /mnt/conary-scratch/export/supported-host-generation.qcow2",
    "echo supported-host-generation-export-ok",
]
copy_from_guest = [
    { source = "/mnt/conary-scratch/export/supported-host-generation.qcow2", dest = "/tmp/conary-generation-export/supported-host-generation.qcow2" },
    { source = "/mnt/conary-scratch/export/supported-host-generation.txt", dest = "/tmp/conary-generation-export/supported-host-generation.txt" },
]
expect_output = [
    "supported-host-generation-export-ok",
]

[test.step.assert]
exit_code = 0

[[test.step]]
[test.step.qemu_boot]
image = "local-supported-host-generation-export"
local_image_path = "/tmp/conary-generation-export/supported-host-generation.qcow2"
memory_mb = 2048
timeout_seconds = 420
ssh_port = 2243
copy_to_guest = [
    { source = "/tmp/conary-generation-export/supported-host-generation.txt", dest = "/tmp/expected-generation" },
]
commands = [
    "EXPECTED=$(cat /tmp/expected-generation); tr ' ' '\\n' < /proc/cmdline | grep -Fxq -- \"conary.generation=$EXPECTED\"",
    "EXPECTED=$(cat /tmp/expected-generation); test -f /conary/generations/$EXPECTED/.conary-artifact.json",
    "EXPECTED=$(cat /tmp/expected-generation); test -f /conary/generations/$EXPECTED/cas-manifest.json",
    "EXPECTED=$(cat /tmp/expected-generation); test -f /conary/generations/$EXPECTED/boot-assets/manifest.json",
    "EXPECTED=$(cat /tmp/expected-generation); TARGET=$(readlink /conary/current); test \"$TARGET\" = \"generations/$EXPECTED\" || test \"$TARGET\" = \"$EXPECTED\" || test \"$(readlink -f /conary/current)\" = \"/conary/generations/$EXPECTED\"",
    "echo supported-host-generation-export-booted",
]
expect_output = [
    "supported-host-generation-export-booted",
]

[test.step.assert]
exit_code = 0
