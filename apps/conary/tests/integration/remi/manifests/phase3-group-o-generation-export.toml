# tests/integration/remi/manifests/phase3-group-o-generation-export.toml
#
# Phase 3, Group O: Generation artifact export validation.
#
# These tests build generation-derived qcow2 images, copy them out of the
# source guest, then boot the generated images as local QEMU inputs.
#
# The source image must already be generation-builder-ready: cpio, dracut,
# depmod, systemd-repart, qemu-img, mkfs tools, and composefs inspection tools
# are fixture inputs. The suite must not install those helper tools through
# Conary on a partial live root before the system is generation-owned.

[suite]
name = "Generation Artifact Export QEMU"
phase = 3

[[test]]
id = "TGE01"
name = "installed_generation_export_fails_closed_without_self_contained_root"
description = "A runtime generation whose base OS is not represented in Conary CAS must fail before publishing a bootable artifact"
timeout = 900
group = "generation-export"
fatal = true

[[test.step]]
[test.step.qemu_boot]
image = "minimal-boot-v4"
memory_mb = 2048
timeout_seconds = 900
ssh_port = 2240
stage_conary = true
commands = [
    "conary system init",
    "mkdir -p /var/tmp/conary-generation-export",
    "conary system generation build --yes > /var/tmp/conary-generation-export/build.log 2>&1; code=$?; cat /var/tmp/conary-generation-export/build.log; test \"$code\" -ne 0",
    "grep -q 'not self-contained' /var/tmp/conary-generation-export/build.log",
    "grep -Eq '(/sbin/init|unresolved CAS-backed path)' /var/tmp/conary-generation-export/build.log",
    "test ! -e /conary/generations/0/.conary-artifact.json",
    "echo installed-generation-export-failed-closed",
]
expect_output = [
    "installed-generation-export-failed-closed",
]

[test.step.assert]
exit_code = 0

[[test]]
id = "TGE03"
name = "installed_generation_build_rejects_missing_runtime_cas_object"
description = "A CAS-backed installed runtime generation fails before artifact publication if an included regular-file CAS object disappears"
timeout = 1800
group = "generation-export"

[[test.step]]
[test.step.qemu_boot]
image = "minimal-boot-v4"
memory_mb = 2048
timeout_seconds = 1500
ssh_port = 2244
stage_conary = true
commands = [
    "conary system init",
    "for cmd in sqlite3 cpio dracut depmod; do command -v \"$cmd\" >/dev/null || { echo \"generation-builder-ready QEMU fixture missing $cmd\"; exit 1; }; done",
    "test -d /usr/lib/dracut || { echo 'generation-builder-ready QEMU fixture missing /usr/lib/dracut'; exit 1; }",
    "conary system adopt --system --full",
    "DB=/var/lib/conary/conary.db; HASH=$(sqlite3 \"$DB\" \"select f.sha256_hash from files f join troves t on t.id = f.trove_id where t.install_source in ('adopted-full','taken','repository','file') and f.symlink_target is null and length(f.sha256_hash) = 64 and f.sha256_hash not glob '*[^0-9a-f]*' and ((f.permissions & 61440) = 0 or (f.permissions & 61440) = 32768) and f.path not like '/var/%' and f.path not like '/tmp/%' and f.path not like '/run/%' and f.path not like '/home/%' and f.path not like '/root/%' and f.path not like '/srv/%' and f.path not like '/opt/%' and f.path not like '/proc/%' and f.path not like '/sys/%' and f.path not like '/dev/%' and f.path not like '/mnt/%' and f.path not like '/media/%' limit 1\"); test -n \"$HASH\"; PREFIX=$(printf '%s' \"$HASH\" | cut -c1-2); SUFFIX=$(printf '%s' \"$HASH\" | cut -c3-); OBJ_BASE=$(readlink -f /conary/objects); test -d \"$OBJ_BASE\"; OBJ=$OBJ_BASE/$PREFIX/$SUFFIX; test -f \"$OBJ\"; rm -f \"$OBJ\"; echo \"$HASH\" > /var/tmp/missing-cas.hash",
    "conary system generation build --yes > /var/tmp/missing-cas.log 2>&1; code=$?; cat /var/tmp/missing-cas.log; test \"$code\" -ne 0",
    "grep -Eq 'missing CAS object|Checksum mismatch|size mismatch' /var/tmp/missing-cas.log",
    "test -z \"$(find /conary/generations -mindepth 2 -maxdepth 2 -name .conary-artifact.json -print -quit 2>/dev/null)\"",
    "echo installed-runtime-missing-cas-rejected",
]
expect_output = [
    "installed-runtime-missing-cas-rejected",
]

[test.step.assert]
exit_code = 0

[[test]]
id = "TGE04"
name = "installed_runtime_generation_export_boots"
description = "A full CAS-backed installed runtime generation exports to qcow2 and boots under UEFI"
timeout = 7200
group = "generation-export"

[[test.step]]
[test.step.qemu_boot]
image = "minimal-boot-v4"
memory_mb = 2048
timeout_seconds = 5400
ssh_port = 2245
stage_conary = true
scratch_disk_mb = 65536
commands = [
    "conary system init",
    "for cmd in sqlite3 cpio dracut depmod systemd-repart qemu-img mkfs.ext4 mkfs.vfat composefs-info; do command -v \"$cmd\" >/dev/null || { echo \"generation-builder-ready QEMU fixture missing $cmd\"; exit 1; }; done",
    "test -d /usr/lib/dracut || { echo 'generation-builder-ready QEMU fixture missing /usr/lib/dracut'; exit 1; }",
    "mkdir -p /etc/ssh/authorized_keys /etc/ssh/sshd_config.d; test -s /root/.ssh/authorized_keys; cp /root/.ssh/authorized_keys /etc/ssh/authorized_keys/root; chmod 0644 /etc/ssh/authorized_keys/root; printf '%s\\n' 'AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys/%u' > /etc/ssh/sshd_config.d/90-conary-test-authorized-keys.conf; sshd_config=/etc/ssh/sshd_config; sshd_config_tmp=/etc/ssh/sshd_config.conary-test; if ! grep -q '/etc/ssh/authorized_keys/%u' \"$sshd_config\"; then { printf '%s\\n' 'AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys/%u'; cat \"$sshd_config\"; } > \"$sshd_config_tmp\"; mv \"$sshd_config_tmp\" \"$sshd_config\"; fi",
    "conary system adopt --system --full",
    "for i in $(seq 1 20); do test -b /dev/disk/by-id/virtio-conary-scratch && exit 0; sleep 1; done; ls -l /dev/disk/by-id /dev/vd*; false",
    "mkfs.ext4 -F /dev/disk/by-id/virtio-conary-scratch",
    "mkdir -p /mnt/conary-scratch",
    "mount -o noatime /dev/disk/by-id/virtio-conary-scratch /mnt/conary-scratch",
    "mkdir -p /mnt/conary-scratch/export",
    "set -e; conary system generation build --yes > /var/tmp/installed-runtime-build.log 2>&1; cat /var/tmp/installed-runtime-build.log; GEN=$(sed -n 's/.*Generation \\([0-9][0-9]*\\).*/\\1/p' /var/tmp/installed-runtime-build.log | tail -1); test -n \"$GEN\"; echo \"$GEN\" > /mnt/conary-scratch/export/installed-runtime-generation.txt; test -f /conary/generations/$GEN/.conary-artifact.json; test -f /conary/generations/$GEN/cas-manifest.json; test -f /conary/generations/$GEN/boot-assets/manifest.json; composefs-info ls /conary/generations/$GEN/root.erofs | grep -q '^/usr/lib64/ld-linux-x86-64\\.so\\.2[[:space:]].*-> ../lib/ld-linux-x86-64\\.so\\.2'; conary system generation export --path /conary/generations/$GEN --format qcow2 --output /mnt/conary-scratch/export/installed-runtime-generation.qcow2",
    "test -s /mnt/conary-scratch/export/installed-runtime-generation.qcow2",
    "echo installed-runtime-generation-export-ok",
]
copy_from_guest = [
    { source = "/mnt/conary-scratch/export/installed-runtime-generation.qcow2", dest = "/tmp/conary-generation-export/installed-runtime-generation.qcow2" },
    { source = "/mnt/conary-scratch/export/installed-runtime-generation.txt", dest = "/tmp/conary-generation-export/installed-runtime-generation.txt" },
]
expect_output = [
    "installed-runtime-generation-export-ok",
]

[test.step.assert]
exit_code = 0

[[test.step]]
[test.step.qemu_boot]
image = "local-installed-runtime-generation-export"
local_image_path = "/tmp/conary-generation-export/installed-runtime-generation.qcow2"
memory_mb = 2048
timeout_seconds = 420
ssh_port = 2246
copy_to_guest = [
    { source = "/tmp/conary-generation-export/installed-runtime-generation.txt", dest = "/tmp/expected-generation" },
]
commands = [
    "EXPECTED=$(cat /tmp/expected-generation); grep -q \"conary.generation=$EXPECTED\" /proc/cmdline",
    "EXPECTED=$(cat /tmp/expected-generation); test -f /conary/generations/$EXPECTED/.conary-artifact.json",
    "EXPECTED=$(cat /tmp/expected-generation); test -f /conary/generations/$EXPECTED/cas-manifest.json",
    "EXPECTED=$(cat /tmp/expected-generation); test -f /conary/generations/$EXPECTED/boot-assets/manifest.json",
    "EXPECTED=$(cat /tmp/expected-generation); TARGET=$(readlink /conary/current); test \"$TARGET\" = \"generations/$EXPECTED\" || test \"$TARGET\" = \"$EXPECTED\" || test \"$(readlink -f /conary/current)\" = \"/conary/generations/$EXPECTED\"",
    "echo installed-runtime-generation-export-booted",
]
expect_output = [
    "installed-runtime-generation-export-booted",
]

[test.step.assert]
exit_code = 0

[[test]]
id = "TGE05"
name = "installed_runtime_generation_export_preserves_file_capability_xattrs"
description = "Export baseline and upgraded installed-runtime generations, then boot both qcow2 artifacts to prove security.capability rollback-equivalent behavior"
timeout = 10800
group = "generation-export"

[[test.step]]
[test.step.qemu_boot]
image = "minimal-boot-v4"
memory_mb = 2048
timeout_seconds = 7200
ssh_port = 2247
stage_conary = true
scratch_disk_mb = 65536
commands = [
    "conary system init",
    "for cmd in sqlite3 cpio dracut depmod systemd-repart qemu-img mkfs.ext4 mkfs.vfat composefs-info; do command -v \"$cmd\" >/dev/null || { echo \"generation-builder-ready QEMU fixture missing $cmd\"; exit 1; }; done",
    "test -d /usr/lib/dracut || { echo 'generation-builder-ready QEMU fixture missing /usr/lib/dracut'; exit 1; }",
    "mkdir -p /etc/ssh/authorized_keys /etc/ssh/sshd_config.d; test -s /root/.ssh/authorized_keys; cp /root/.ssh/authorized_keys /etc/ssh/authorized_keys/root; chmod 0644 /etc/ssh/authorized_keys/root; printf '%s\\n' 'AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys/%u' > /etc/ssh/sshd_config.d/90-conary-test-authorized-keys.conf; sshd_config=/etc/ssh/sshd_config; sshd_config_tmp=/etc/ssh/sshd_config.conary-test; if ! grep -q '/etc/ssh/authorized_keys/%u' \"$sshd_config\"; then { printf '%s\\n' 'AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys/%u'; cat \"$sshd_config\"; } > \"$sshd_config_tmp\"; mv \"$sshd_config_tmp\" \"$sshd_config\"; fi",
    "conary system adopt --system --full",
    "for i in $(seq 1 20); do test -b /dev/disk/by-id/virtio-conary-scratch && exit 0; sleep 1; done; ls -l /dev/disk/by-id /dev/vd*; false",
    "mkfs.ext4 -F /dev/disk/by-id/virtio-conary-scratch",
    "mkdir -p /mnt/conary-scratch",
    "mount -o noatime /dev/disk/by-id/virtio-conary-scratch /mnt/conary-scratch",
    "mkdir -p /mnt/conary-scratch/export",
    "conary system generation build --yes > /var/tmp/generation-capability-seed.log 2>&1; cat /var/tmp/generation-capability-seed.log; SEED_GEN=$(awk '/^Generation [0-9][0-9]* built[.]$/ {print $2}' /var/tmp/generation-capability-seed.log | tail -1); test -n \"$SEED_GEN\"; conary system generation switch \"$SEED_GEN\" --yes; test -L /conary/current",
    "rm -rf /tmp/group-o-cap-base /tmp/group-o-cap-base-output && mkdir -p /tmp/group-o-cap-base/stage/usr/bin /tmp/group-o-cap-base-output && printf '#!/bin/sh\\necho baseline authority\\n' > /tmp/group-o-cap-base/stage/usr/bin/group-o-cap-demo && chmod 0755 /tmp/group-o-cap-base/stage/usr/bin/group-o-cap-demo && conary ccs init /tmp/group-o-cap-base --name group-o-cap-demo --version 1.0.0 && conary ccs build /tmp/group-o-cap-base --output /tmp/group-o-cap-base-output --source /tmp/group-o-cap-base/stage",
    "set -e; BASE_CCS=$(ls /tmp/group-o-cap-base-output/*.ccs | head -1); test -n \"$BASE_CCS\"; conary ccs install --yes \"$BASE_CCS\" --allow-unsigned --sandbox never > /var/tmp/group-o-cap-base-install.log 2>&1; cat /var/tmp/group-o-cap-base-install.log; BASELINE_GEN=$(readlink -f /conary/current | sed 's#.*/##'); test -n \"$BASELINE_GEN\"; printf '%s\\n' \"$BASELINE_GEN\" > /mnt/conary-scratch/export/group-o-cap-baseline-generation.txt; conary system generation info \"$BASELINE_GEN\" > /var/tmp/group-o-cap-baseline-info.txt; cat /var/tmp/group-o-cap-baseline-info.txt; ! grep -q 'Cap xattrs:' /var/tmp/group-o-cap-baseline-info.txt; conary system generation export --path /conary/generations/$BASELINE_GEN --format qcow2 --output /mnt/conary-scratch/export/group-o-cap-baseline-generation.qcow2",
    "rm -rf /tmp/group-o-cap-upgrade /tmp/group-o-cap-upgrade-output && mkdir -p /tmp/group-o-cap-upgrade/stage/usr/bin /tmp/group-o-cap-upgrade-output && printf '#!/bin/sh\\necho capability authority\\n' > /tmp/group-o-cap-upgrade/stage/usr/bin/group-o-cap-demo && chmod 0755 /tmp/group-o-cap-upgrade/stage/usr/bin/group-o-cap-demo && conary ccs init /tmp/group-o-cap-upgrade --name group-o-cap-demo --version 2.0.0 && printf '\\n[[file_capabilities]]\\npath = \"/usr/bin/group-o-cap-demo\"\\ncapabilities = [\"cap_net_bind_service\"]\\npermitted = true\\neffective = true\\ninheritable = false\\n' >> /tmp/group-o-cap-upgrade/ccs.toml && conary ccs build /tmp/group-o-cap-upgrade --output /tmp/group-o-cap-upgrade-output --source /tmp/group-o-cap-upgrade/stage",
    "set -e; CAP_CCS=$(ls /tmp/group-o-cap-upgrade-output/*.ccs | head -1); test -n \"$CAP_CCS\"; conary ccs install --yes \"$CAP_CCS\" --allow-unsigned --sandbox never > /var/tmp/group-o-cap-upgrade-install.log 2>&1; cat /var/tmp/group-o-cap-upgrade-install.log; CAP_GEN=$(readlink -f /conary/current | sed 's#.*/##'); test -n \"$CAP_GEN\"; test \"$CAP_GEN\" != \"$(cat /mnt/conary-scratch/export/group-o-cap-baseline-generation.txt)\"; printf '%s\\n' \"$CAP_GEN\" > /mnt/conary-scratch/export/group-o-cap-enabled-generation.txt; conary system generation info \"$CAP_GEN\" > /var/tmp/group-o-cap-enabled-info.txt; cat /var/tmp/group-o-cap-enabled-info.txt; grep -q 'Cap xattrs: 1' /var/tmp/group-o-cap-enabled-info.txt; composefs-info dump /conary/generations/$CAP_GEN/root.erofs | grep -q '^/usr/bin/group-o-cap-demo .*security.capability='; conary system generation export --path /conary/generations/$CAP_GEN --format qcow2 --output /mnt/conary-scratch/export/group-o-cap-enabled-generation.qcow2",
    "test -s /mnt/conary-scratch/export/group-o-cap-baseline-generation.qcow2",
    "test -s /mnt/conary-scratch/export/group-o-cap-enabled-generation.qcow2",
    "echo installed-runtime-generation-file-capability-export-ok",
]
copy_from_guest = [
    { source = "/mnt/conary-scratch/export/group-o-cap-baseline-generation.qcow2", dest = "/tmp/conary-generation-export/group-o-cap-baseline-generation.qcow2" },
    { source = "/mnt/conary-scratch/export/group-o-cap-baseline-generation.txt", dest = "/tmp/conary-generation-export/group-o-cap-baseline-generation.txt" },
    { source = "/mnt/conary-scratch/export/group-o-cap-enabled-generation.qcow2", dest = "/tmp/conary-generation-export/group-o-cap-enabled-generation.qcow2" },
    { source = "/mnt/conary-scratch/export/group-o-cap-enabled-generation.txt", dest = "/tmp/conary-generation-export/group-o-cap-enabled-generation.txt" },
]
expect_output = [
    "installed-runtime-generation-file-capability-export-ok",
]

[test.step.assert]
exit_code = 0

[[test.step]]
[test.step.qemu_boot]
image = "local-group-o-cap-baseline-generation-export"
local_image_path = "/tmp/conary-generation-export/group-o-cap-baseline-generation.qcow2"
memory_mb = 2048
timeout_seconds = 420
ssh_port = 2248
copy_to_guest = [
    { source = "/tmp/conary-generation-export/group-o-cap-baseline-generation.txt", dest = "/tmp/expected-generation" },
]
commands = [
    "EXPECTED=$(cat /tmp/expected-generation); grep -q \"conary.generation=$EXPECTED\" /proc/cmdline",
    "EXPECTED=$(cat /tmp/expected-generation); TARGET=$(readlink /conary/current); test \"$TARGET\" = \"generations/$EXPECTED\" || test \"$TARGET\" = \"$EXPECTED\" || test \"$(readlink -f /conary/current)\" = \"/conary/generations/$EXPECTED\"",
    "test -x /usr/bin/group-o-cap-demo",
    "if command -v getcap >/dev/null 2>&1; then OUT=$(getcap -n /usr/bin/group-o-cap-demo 2>/dev/null || true); printf '%s\\n' \"$OUT\"; test -z \"$OUT\"; elif command -v getfattr >/dev/null 2>&1; then ! getfattr --only-values -n security.capability /usr/bin/group-o-cap-demo >/tmp/group-o-cap.bin 2>/dev/null; elif command -v attr >/dev/null 2>&1; then ! attr -q -g security.capability /usr/bin/group-o-cap-demo >/tmp/group-o-cap.bin 2>/dev/null; elif command -v python3 >/dev/null 2>&1; then python3 -c 'import os,sys; raise SystemExit(0 if \"security.capability\" not in os.listxattr(sys.argv[1]) else 1)' /usr/bin/group-o-cap-demo; else echo 'missing capability inspection helper' >&2; exit 1; fi",
    "echo installed-runtime-generation-file-capability-baseline-ok",
]
expect_output = [
    "installed-runtime-generation-file-capability-baseline-ok",
]

[test.step.assert]
exit_code = 0

[[test.step]]
[test.step.qemu_boot]
image = "local-group-o-cap-enabled-generation-export"
local_image_path = "/tmp/conary-generation-export/group-o-cap-enabled-generation.qcow2"
memory_mb = 2048
timeout_seconds = 420
ssh_port = 2249
copy_to_guest = [
    { source = "/tmp/conary-generation-export/group-o-cap-enabled-generation.txt", dest = "/tmp/expected-generation" },
]
commands = [
    "EXPECTED=$(cat /tmp/expected-generation); grep -q \"conary.generation=$EXPECTED\" /proc/cmdline",
    "EXPECTED=$(cat /tmp/expected-generation); TARGET=$(readlink /conary/current); test \"$TARGET\" = \"generations/$EXPECTED\" || test \"$TARGET\" = \"$EXPECTED\" || test \"$(readlink -f /conary/current)\" = \"/conary/generations/$EXPECTED\"",
    "test -x /usr/bin/group-o-cap-demo",
    "if command -v getcap >/dev/null 2>&1; then OUT=$(getcap -n /usr/bin/group-o-cap-demo 2>/dev/null || true); printf '%s\\n' \"$OUT\"; printf '%s\\n' \"$OUT\" | grep -Eq 'cap_net_bind_service=ep'; elif command -v python3 >/dev/null 2>&1; then python3 -c 'import os,sys; expected=bytes.fromhex(\"0100000200040000000000000000000000000000\"); actual=os.getxattr(sys.argv[1], \"security.capability\"); raise SystemExit(0 if actual == expected else 1)' /usr/bin/group-o-cap-demo; elif command -v getfattr >/dev/null 2>&1 && command -v od >/dev/null 2>&1; then getfattr --only-values -n security.capability /usr/bin/group-o-cap-demo 2>/dev/null | od -An -tx1 -v | tr -d ' \\n' | grep -qx '0100000200040000000000000000000000000000'; elif command -v attr >/dev/null 2>&1 && command -v od >/dev/null 2>&1; then attr -q -g security.capability /usr/bin/group-o-cap-demo 2>/dev/null | od -An -tx1 -v | tr -d ' \\n' | grep -qx '0100000200040000000000000000000000000000'; else echo 'missing capability inspection helper' >&2; exit 1; fi",
    "echo installed-runtime-generation-file-capability-enabled-ok",
]
expect_output = [
    "installed-runtime-generation-file-capability-enabled-ok",
]

[test.step.assert]
exit_code = 0


[[test]]
id = "TGE02"
name = "bootstrap_run_generation_export_boots"
description = "Export a bootstrap-run generation artifact to qcow2, copy it to the host, then boot it under UEFI"
timeout = 7200
group = "generation-export"

[[test.step]]
[test.step.qemu_boot]
image = "minimal-boot-v4"
memory_mb = 2048
timeout_seconds = 5400
ssh_port = 2242
stage_conary = true
scratch_disk_mb = 65536
copy_to_guest = [
    { source = "apps/conary/tests/fixtures/bootstrap-generation-export", dest = "/var/lib/conary/bootstrap-inputs" },
]
commands = [
    "conary system init",
    "for cmd in sqlite3 cpio dracut depmod systemd-repart qemu-img mkfs.ext4 mkfs.vfat composefs-info; do command -v \"$cmd\" >/dev/null || { echo \"generation-builder-ready QEMU fixture missing $cmd\"; exit 1; }; done",
    "test -d /usr/lib/dracut || { echo 'generation-builder-ready QEMU fixture missing /usr/lib/dracut'; exit 1; }",
    "test -d /var/lib/conary/bootstrap-inputs",
    "test -f /var/lib/conary/bootstrap-inputs/conaryos.toml",
    "test -d /var/lib/conary/bootstrap-inputs/recipes",
    "test -s /root/.ssh/authorized_keys; KEY=$(head -n 1 /root/.ssh/authorized_keys); test -n \"$KEY\"; RECIPE=/var/lib/conary/bootstrap-inputs/recipes/system/generation-fixture-rootfs.toml; grep -q '__CONARY_QEMU_TEST_PUBLIC_KEY__' \"$RECIPE\"; sed -i \"s|__CONARY_QEMU_TEST_PUBLIC_KEY__|$KEY|\" \"$RECIPE\"; ! grep -q '__CONARY_QEMU_TEST_PUBLIC_KEY__' \"$RECIPE\"",
    "for i in $(seq 1 20); do test -b /dev/disk/by-id/virtio-conary-scratch && exit 0; sleep 1; done; ls -l /dev/disk/by-id /dev/vd*; false",
    "mkfs.ext4 -F /dev/disk/by-id/virtio-conary-scratch",
    "mkdir -p /mnt/conary-scratch",
    "mount -o noatime /dev/disk/by-id/virtio-conary-scratch /mnt/conary-scratch",
    "mkdir -p /mnt/conary-scratch/seed /mnt/conary-scratch/bootstrap-run /mnt/conary-scratch/export",
    "conary bootstrap seed --from-adopted --distro conaryos --distro-version qemu-fixture --output /mnt/conary-scratch/seed",
    "test -f /mnt/conary-scratch/seed/seed.erofs",
    "mkdir -p /var/cache/conary/sources /tmp/conary-fixture-source/generation-fixture-rootfs-1.0.0",
    "printf '%s\\n' 'generation export fixture source' > /tmp/conary-fixture-source/generation-fixture-rootfs-1.0.0/README",
    "tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf /var/cache/conary/sources/sha256_d11cfc8fb74688f2141ba2975d17bcd16762f07dbdcb97ac3a572961701addb8 -C /tmp/conary-fixture-source generation-fixture-rootfs-1.0.0",
    "printf '%s  %s\\n' 'd11cfc8fb74688f2141ba2975d17bcd16762f07dbdcb97ac3a572961701addb8' '/var/cache/conary/sources/sha256_d11cfc8fb74688f2141ba2975d17bcd16762f07dbdcb97ac3a572961701addb8' | sha256sum -c -",
    "conary bootstrap run /var/lib/conary/bootstrap-inputs/conaryos.toml --seed /mnt/conary-scratch/seed --recipe-dir /var/lib/conary/bootstrap-inputs/recipes --work-dir /mnt/conary-scratch/bootstrap-run --up-to system",
    "conary system generation export --path /mnt/conary-scratch/bootstrap-run/output/current --format qcow2 --output /mnt/conary-scratch/export/bootstrap-run-generation.qcow2",
    "test -s /mnt/conary-scratch/export/bootstrap-run-generation.qcow2",
    "echo bootstrap-run-generation-export-ok",
]
copy_from_guest = [
    { source = "/mnt/conary-scratch/export/bootstrap-run-generation.qcow2", dest = "/tmp/conary-generation-export/bootstrap-run-generation.qcow2" },
