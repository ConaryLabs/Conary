# tests/integration/remi/manifests/phase4-group-e.toml
#
# Phase 4, Group E: Cross-Distro Compatibility (T256-T277).
#
# Tests that verify Conary works correctly across distro boundaries:
# CCS portability, canonical name mapping, dependency normalization,
# resolver behavior differences, source-affinity diagnostics, and takeover.
#
# Variables: ${REMI_ENDPOINT}, ${DB_PATH}, ${CONARY_BIN}
# Distro overrides: ${distro_repo}, ${native_pkg}, ${canonical_pkg},
#                   ${canonical_native}, ${dep_provides_format},
#                   ${solib_pkg}

[suite]
name = "Phase 4 Group E: Cross-Distro Compatibility"
phase = 4

[distro_overrides.fedora44]
distro_repo = "remi"
# A package whose name differs across distros
native_pkg = "python3"
# Canonical name that maps differently per distro
canonical_pkg = "python"
canonical_native = "python3"
# Dependency format for shared libs
dep_provides_format = "libz.so"
solib_pkg = "zlib"
# Package with distro-specific name
distro_specific_name = "dnf"
local_native_target = "rpm"
local_native_glob = "*.rpm"

[distro_overrides.arch]
distro_repo = "remi"
native_pkg = "python"
canonical_pkg = "python"
canonical_native = "python"
dep_provides_format = "libz.so"
solib_pkg = "zlib"
distro_specific_name = "pacman"
local_native_target = "arch"
local_native_glob = "*.pkg.tar.zst"

[distro_overrides."ubuntu-26.04"]
distro_repo = "remi"
native_pkg = "python3"
canonical_pkg = "python"
canonical_native = "python3"
dep_provides_format = "libz.so"
solib_pkg = "zlib1g"
distro_specific_name = "apt"
local_native_target = "deb"
local_native_glob = "*.deb"

# --------------------------------------------------------------------------
# T256: CCS fixture installs on any distro
# --------------------------------------------------------------------------
# CCS is the universal format -- a package built once should install everywhere.

[[test]]
id = "T256"
name = "ccs_portable_install"
description = "Install a CCS package and verify it works regardless of host distro"
timeout = 60
group = "E"
fatal = true

[[test.step]]
run = "${CONARY_BIN} ccs install --yes /opt/remi-tests/fixtures/conary-test-fixture/v1/output/conary-test-fixture-1.0.0-1.ccs --policy ${FIXTURE_CCS_POLICY} --sandbox always --db-path ${DB_PATH}"

[test.step.assert]
exit_code = 0
stdout_contains = "Successfully installed"

[[test.step]]
conary = "list conary-test-fixture --info"

[test.step.assert]
exit_code = 0
stdout_contains_all = ["conary-test-fixture", "1.0.0"]

[[test.step]]
file_exists = "/usr/share/conary-test/hello.txt"

# --------------------------------------------------------------------------
# T257: CCS upgrade portable across distros
# --------------------------------------------------------------------------

[[test]]
id = "T257"
name = "ccs_portable_upgrade"
description = "Upgrade a CCS package from v1 to v2 on any distro"
timeout = 60
group = "E"
depends_on = ["T256"]

[[test.step]]
run = "${CONARY_BIN} ccs install --yes /opt/remi-tests/fixtures/conary-test-fixture/v2/output/conary-test-fixture-2.0.0-1.ccs --policy ${FIXTURE_CCS_POLICY} --sandbox always --db-path ${DB_PATH}"

[test.step.assert]
exit_code = 0

[[test.step]]
conary = "list conary-test-fixture --info"

[test.step.assert]
exit_code = 0
stdout_contains = "2.0.0"

# --------------------------------------------------------------------------
# T258: CCS remove portable across distros
# --------------------------------------------------------------------------

[[test]]
id = "T258"
name = "ccs_portable_remove"
description = "Remove a CCS package on any distro and verify clean removal"
timeout = 60
group = "E"
depends_on = ["T257"]

[[test.step]]
conary = "remove conary-test-fixture --sandbox always --yes"

[test.step.assert]
exit_code = 0

[[test.step]]
conary = "list"

[test.step.assert]
stdout_not_contains = "conary-test-fixture"

[[test.step]]
file_not_exists = "/usr/share/conary-test/hello.txt"

# --------------------------------------------------------------------------
# T258a: Build a local native fixture in the host distro format
# --------------------------------------------------------------------------

[[test]]
id = "T258a"
name = "native_local_fixture_build"
description = "Build a local native fixture in the current distro format"
timeout = 60
group = "E"

[[test.step]]
run = "rm -rf /tmp/phase4-native-output && CONARY_BIN=${CONARY_BIN} /opt/remi-tests/fixtures/native/build-native-fixtures.sh ${local_native_target} /tmp/phase4-native-output /opt/remi-tests/fixtures/phase4-runtime-fixture"

[test.step.assert]
exit_code = 0

# --------------------------------------------------------------------------
# T258b: Install a local native package file
# --------------------------------------------------------------------------

[[test]]
id = "T258b"
name = "native_local_file_install"
description = "Install a local native package file generated for the current distro format"
timeout = 120
group = "E"
depends_on = ["T258a"]

[[test.step]]
run = "PKG_FILE=$(ls /tmp/phase4-native-output/${local_native_glob} | head -1) && ${CONARY_BIN} install \"$PKG_FILE\" --db-path ${DB_PATH} --no-deps --yes --sandbox always"

[test.step.assert]
exit_code = 0

[[test.step]]
conary = "list phase4-runtime-fixture --info"

[test.step.assert]
exit_code = 0
stdout_contains_all = ["phase4-runtime-fixture", "1.0.0"]

[[test.step]]
file_exists = "/usr/bin/phase4-runtime-fixture"

[[test.step]]
conary = "remove phase4-runtime-fixture --sandbox always --yes"

[test.step.assert]
exit_code = 0

[[test.step]]
file_not_exists = "/usr/bin/phase4-runtime-fixture"

# --------------------------------------------------------------------------
# T259: Canonical name resolves to distro-native package
# --------------------------------------------------------------------------

[[test]]
id = "T259"
name = "canonical_registry_populated"
description = "Sync canonical registry and verify it contains entries"
timeout = 60
group = "E"

# Canonical DB must be populated first
[[test.step]]
conary = "registry update"

[test.step.assert]
exit_code = 0

[[test.step]]
conary = "registry stats"

[test.step.assert]
exit_code = 0

# --------------------------------------------------------------------------
# T260: Canonical search returns results on all distros
# --------------------------------------------------------------------------

[[test]]
id = "T260"
name = "canonical_search_cross_distro"
description = "Canonical search for a common tool returns results regardless of distro"
timeout = 30
group = "E"

[[test.step]]
conary = "canonical search curl"

[test.step.assert]
exit_code = 0
stdout_contains = "curl"

# --------------------------------------------------------------------------
# T261: Distro repo sync works
# --------------------------------------------------------------------------

[[test]]
id = "T261"
name = "distro_repo_sync"
description = "Sync the distro-native repository and verify metadata is fetched"
timeout = 120
group = "E"
fatal = true

[[test.step]]
conary = "repo sync ${distro_repo} --force"

[test.step.assert]
exit_code = 0

[[test.step]]
conary = "repo list"

[test.step.assert]
exit_code = 0
stdout_contains = "${distro_repo}"

# --------------------------------------------------------------------------
# T262: Native package install via distro repo
# --------------------------------------------------------------------------

[[test]]
id = "T262"
name = "native_package_install"
description = "Install a native package from the distro repo -- resolver picks correct format"
timeout = 120
group = "E"
depends_on = ["T261"]

[[test.step]]
conary = "install tree --repo ${distro_repo} --no-deps --yes --sandbox always"

[test.step.assert]
exit_code = 0
stdout_contains = "tree"

[[test.step]]
conary = "list tree --info"

[test.step.assert]
exit_code = 0
stdout_contains = "tree"

# --------------------------------------------------------------------------
# T263: Native package has correct distro metadata
# --------------------------------------------------------------------------

[[test]]
id = "T263"
name = "native_package_metadata"
description = "Installed native package carries correct distro-specific metadata"
timeout = 30
group = "E"
depends_on = ["T262"]

[[test.step]]
conary = "list tree --info"

[test.step.assert]
exit_code = 0
stdout_contains = "tree"

# --------------------------------------------------------------------------
# T264: Dependency query shows normalized deps
# --------------------------------------------------------------------------

[[test]]
id = "T264"
name = "dependency_normalization"
description = "Dependencies from different native formats are normalized to common types"
timeout = 30
group = "E"
depends_on = ["T262"]

[[test.step]]
conary = "query depends tree"

[test.step.assert]
exit_code = 0

# --------------------------------------------------------------------------
# T265: Mixed CCS + native coexistence
# --------------------------------------------------------------------------

[[test]]
id = "T265"
name = "mixed_ccs_native_coexistence"
description = "CCS and native packages coexist in the same database without conflict"
timeout = 60
group = "E"
depends_on = ["T262"]

# Install a CCS package alongside the native one
[[test.step]]
run = "${CONARY_BIN} ccs install --yes /opt/remi-tests/fixtures/conary-test-fixture/v1/output/conary-test-fixture-1.0.0-1.ccs --policy ${FIXTURE_CCS_POLICY} --sandbox always --db-path ${DB_PATH}"

[test.step.assert]
exit_code = 0

# Both should appear in list
[[test.step]]
conary = "list"

[test.step.assert]
exit_code = 0
stdout_contains_all = ["conary-test-fixture", "tree"]

# Remove CCS, native should remain
[[test.step]]
conary = "remove conary-test-fixture --sandbox always --yes"

[test.step.assert]
exit_code = 0

[[test.step]]
conary = "list"

[test.step.assert]
exit_code = 0
stdout_contains = "tree"
stdout_not_contains = "conary-test-fixture"

# --------------------------------------------------------------------------
# T266: Distro-specific package manager detected
# --------------------------------------------------------------------------

[[test]]
id = "T266"
name = "distro_detection"
description = "Conary correctly detects the host distro and reports it"
timeout = 30
group = "E"

[[test.step]]
run = "${CONARY_BIN} distro list"

[test.step.assert]
exit_code = 0

# --------------------------------------------------------------------------
# T267: Generation build works with mixed package sources
# --------------------------------------------------------------------------

[[test]]
id = "T267"
name = "generation_mixed_sources"
description = "Generation build succeeds with both CCS and native packages installed"
timeout = 60
group = "E"
depends_on = ["T262"]
requires = ["composefs_runtime"]

# Reinstall CCS fixture
[[test.step]]
run = "${CONARY_BIN} ccs install --yes /opt/remi-tests/fixtures/conary-test-fixture/v1/output/conary-test-fixture-1.0.0-1.ccs --policy ${FIXTURE_CCS_POLICY} --sandbox always --db-path ${DB_PATH}"

[test.step.assert]
exit_code = 0

# Generation build should handle mixed sources
[[test.step]]
run = "${CONARY_BIN} system generation build --yes 2>&1"

[test.step.assert]
exit_code = 0
stdout_contains = "Generation"

# Clean up
[[test.step]]
run = "${CONARY_BIN} remove conary-test-fixture --sandbox always --yes --db-path ${DB_PATH} 2>/dev/null; ${CONARY_BIN} remove tree --sandbox always --yes --db-path ${DB_PATH} 2>/dev/null; true"

# ==========================================================================
# Source identity and model convergence tests (T268-T273)
# ==========================================================================
# Repository identity owns package selection. Distro commands remain
# read-only diagnostics, while models own package convergence only.

# --------------------------------------------------------------------------
# T268: Source diagnostics are available
# --------------------------------------------------------------------------

[[test]]
id = "T268"
name = "source_affinity_diagnostics"
description = "List named feed presets and report installed source affinity without mutating policy"
timeout = 30
group = "E"

[[test.step]]
conary = "distro list"

[test.step.assert]
exit_code = 0
stdout_contains = "Available source feeds"

[[test.step]]
conary = "distro info"

[test.step.assert]
exit_code = 0
stdout_contains = "diagnostic only"

# --------------------------------------------------------------------------
# T269: Install package from one exact repository
# --------------------------------------------------------------------------

[[test]]
id = "T269"
name = "exact_repository_install"
description = "Install a native package from one explicitly selected repository"
timeout = 180
group = "E"
depends_on = ["T268"]

# Sync the selected repository
[[test.step]]
conary = "repo sync ${distro_repo} --force"

[test.step.assert]
exit_code = 0

# Install a package from the exact repository
[[test.step]]
conary = "install tree --repo ${distro_repo} --no-deps --yes --sandbox always"

[test.step.assert]
exit_code = 0

[[test.step]]
conary = "list tree --info"

[test.step.assert]
exit_code = 0
stdout_contains = "tree"

# --------------------------------------------------------------------------
# T270: Model diff owns package convergence only
# --------------------------------------------------------------------------

[[test]]
id = "T270"
name = "package_convergence_model_diff"
description = "Model diff accepts package ownership intent without global source policy"
timeout = 60
group = "E"
depends_on = ["T269"]

# Write a minimal system model
[[test.step]]
run = "mkdir -p /etc/conary && cat > /tmp/source-model.toml << 'TOML'\n[model]\ninstall = [\"tree\"]\nTOML"

[test.step.assert]
exit_code = 0

[[test.step]]
run = "${CONARY_BIN} model diff -m /tmp/source-model.toml --db-path ${DB_PATH} 2>&1; true"

[test.step.assert]
exit_code = 0

# --------------------------------------------------------------------------
# T271: Model apply preserves the package intent
# --------------------------------------------------------------------------

[[test]]
id = "T271"
name = "package_convergence_model_apply"
description = "Model apply preserves an already satisfied package intent"
timeout = 300
group = "E"
depends_on = ["T270"]

[[test.step]]
run = "${CONARY_BIN} model apply -m /tmp/source-model.toml --db-path ${DB_PATH} --yes --sandbox always 2>&1; echo EXIT:$?"

[test.step.assert]
exit_code = 0

# tree remains installed from the explicitly selected repository
[[test.step]]
conary = "list tree --info"

[test.step.assert]
exit_code = 0
stdout_contains = "tree"

# --------------------------------------------------------------------------
# T272: Source affinity remains diagnostic
# --------------------------------------------------------------------------

[[test]]
id = "T272"
name = "source_affinity_after_model_apply"
description = "Model apply leaves source affinity as measured diagnostic output"
timeout = 30
group = "E"
depends_on = ["T271"]

[[test.step]]
conary = "distro info"

[test.step.assert]
exit_code = 0
stdout_contains = "diagnostic only"

# --------------------------------------------------------------------------
# T273: Model check after convergence
# --------------------------------------------------------------------------

[[test]]
id = "T273"
name = "package_convergence_model_check"
description = "Model check confirms the package ownership model"
timeout = 30
group = "E"
depends_on = ["T271"]

[[test.step]]
run = "${CONARY_BIN} model check -m /tmp/source-model.toml --db-path ${DB_PATH} --verbose 2>&1; true"

[test.step.assert]
exit_code = 0

# --------------------------------------------------------------------------
# T276: Takeover dry-run records a resumable plan on every supported PM
# --------------------------------------------------------------------------

[[test]]
id = "T276"
name = "takeover_dry_run_cross_distro"
description = "Takeover dry-run writes a planning record and reports the ready-to-activate generation contract"
timeout = 180
group = "E"
depends_on = ["T273"]

[[test.step]]
conary = "system takeover --dry-run"

[test.step.assert]
exit_code = 0
stdout_contains_all = ["[DRY RUN] System Takeover Plan", "Stop ready to activate          : yes"]

[[test.step]]
run = "OP_FILE=$(find \"$(dirname \"${DB_PATH}\")/takeover/operations\" -name '*.json' | sort | tail -1); test -n \"$OP_FILE\" && grep -q '\"status\": \"Planning\"' \"$OP_FILE\" && grep -q '\"requested_level\": \"generation\"' \"$OP_FILE\" && echo takeover-dry-run-record"

[test.step.assert]
exit_code = 0
stdout_contains = "takeover-dry-run-record"

# --------------------------------------------------------------------------
# T277: Takeover owned path works across RPM, dpkg, and pacman
# --------------------------------------------------------------------------

[[test]]
id = "T277"
name = "takeover_owned_cross_distro"
description = "Takeover ownership path completes across supported package managers without requiring activation"
timeout = 300
group = "E"
depends_on = ["T276"]
fatal = true

[[test.step]]
conary = "system takeover --up-to owned --yes"

[test.step.assert]
exit_code = 0
stdout_contains_all = ["Finished Phase 2 (Owned).", "Conary now owns all adopted packages."]

[[test.step]]
run = "OP_FILE=$(find \"$(dirname \"${DB_PATH}\")/takeover/operations\" -name '*.json' | sort | tail -1); grep -q '\"requested_level\": \"owned\"' \"$OP_FILE\" && grep -q '\"status\": \"Incomplete\"' \"$OP_FILE\" && grep -q '\"completed_phases\": \\[' \"$OP_FILE\" && grep -q '\"Cas\"' \"$OP_FILE\" && grep -q '\"Owned\"' \"$OP_FILE\" && echo takeover-owned-record"

[test.step.assert]
exit_code = 0
stdout_contains = "takeover-owned-record"
