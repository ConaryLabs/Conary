[package]
name = "phase4-runtime-fixture"
version = "1.0.0"
version_scheme = "conary"
release = "1"
kind = "package"
description = "Phase 4 runtime fixture for config, label, trigger, and shell coverage"
license = "MIT"
homepage = "https://conary.io/fixtures/phase4-runtime-fixture"

[package.platform]
os = "linux"
arch = "x86_64"
libc = "gnu"

[package.authors]
maintainers = ["Conary Fixture Maintainers <fixtures@conary.io>"]

[provides]
capabilities = ["phase4-runtime-fixture"]
binaries = ["/usr/bin/phase4-runtime-fixture"]

[components]
default = ["runtime", "config"]

[[config.files]]
source = "ccs"
path = "/etc/phase4-runtime-fixture/app.conf"
noreplace = true
payload = "matched"

[hooks]
