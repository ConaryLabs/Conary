# The generation owns /usr and /etc only. /var is carrier state: empty on the
# writable-disk carrier and a fresh tmpfs on the read-only ISO carrier, so
# openssh-server's packaged privilege-separation directory is not present at
# boot and sshd would exit with "Missing privilege separation directory".
# systemd-tmpfiles-setup.service is statically enabled by the systemd package,
# so recreating the directory here needs no scriptlet and no preset.
d /var/empty 0755 root root -
d /var/empty/sshd 0711 root root -
