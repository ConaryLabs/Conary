# Harness SSH access for the supported-host generation export fixture.
#
# Fedora 44's /etc/ssh/sshd_config includes sshd_config.d/*.conf from its first
# line and OpenSSH keeps the first value it obtains for a keyword, so a 00-
# prefixed drop-in wins over the stock defaults. The boot proof exercises that
# Include dependency directly: the exported root carries no /root/.ssh, so
# harness SSH auth succeeds only if sshd read this drop-in. If Fedora ever
# drops the Include line, the failure mode is an SSH timeout in the boot step,
# and this fixture must inject the main config instead.
#
# /root is outside the immutable generation contract, so the authorized key
# lives in generation-owned /etc rather than /root/.ssh.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthorizedKeysFile /etc/ssh/authorized_keys/%u .ssh/authorized_keys
