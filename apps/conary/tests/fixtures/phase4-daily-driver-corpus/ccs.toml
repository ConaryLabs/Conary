requirements = [
    { kind = "Depends", behavior = "Hard", expression = { operator = "atom", operands = { name = "phase4-repository-fixture", capability_kind = "PackageName", version_constraint = "=1.0.0", native_text = "phase4-repository-fixture =1.0.0" } }, alternatives = [{ name = "phase4-repository-fixture", capability_kind = "PackageName", version_constraint = "=1.0.0", native_text = "phase4-repository-fixture =1.0.0" }], native_text = "phase4-repository-fixture =1.0.0" },
]

[package]
name = "phase4-daily-driver-corpus"
version = "1.0.0"
version_scheme = "conary"
release = "1"
kind = "package"
description = "Phase 4 daily-driver corpus fixture for native package-manager parity"
license = "MIT"
homepage = "https://conary.io/fixtures/phase4-daily-driver-corpus"

[package.platform]
os = "linux"
arch = "x86_64"
libc = "gnu"

[package.authors]
maintainers = ["Conary Fixture Maintainers <fixtures@conary.io>"]

[native_export.rpm]
requires = [{ name = "phase4-repository-fixture", relation = "equal", version = "1.0.0" }]
provides = [
    { name = "phase4-corpus-tool", relation = "any" },
    { name = "phase4-daily-driver-corpus", relation = "equal", version = "1.0" },
]

[native_export.deb]
depends = ["phase4-repository-fixture (= 1.0.0)"]
provides = ["phase4-corpus-tool", "phase4-daily-driver-corpus (= 1.0)"]

[native_export.arch]
depends = ["phase4-repository-fixture=1.0.0"]
provides = ["phase4-corpus-tool", "phase4-daily-driver-corpus=1.0"]

[provides]
capabilities = ["phase4-daily-driver-corpus", "phase4-corpus-tool"]
binaries = ["/usr/bin/phase4-corpus", "/usr/bin/phase4-corpus-alt"]

[components]
default = ["runtime", "config"]

[[config.files]]
source = "ccs"
path = "/etc/phase4-corpus/app.conf"
noreplace = true
payload = "matched"

[[config.files]]
source = "ccs"
path = "/etc/phase4-corpus/app-local.conf"
noreplace = true
payload = "matched"

[[config.files]]
source = "ccs"
path = "/etc/phase4-corpus/app-deleted.conf"
noreplace = true
payload = "matched"

[hooks]

[[hooks.groups]]
name = "phase4-corpus-group"
system = true

[[hooks.users]]
name = "phase4-corpus-user"
system = true
home = "/var/lib/phase4-corpus"
shell = "/bin/false"
group = "phase4-corpus-group"

[[hooks.directories]]
path = "/var/lib/phase4-corpus"
mode = "0750"
owner = "phase4-corpus-user"
group = "phase4-corpus-group"

[[hooks.systemd]]
unit = "phase4-corpus.service"
enable = false

[[hooks.alternatives]]
link = "/usr/bin/phase4-corpus-tool"
name = "phase4-corpus-tool"
path = "/usr/bin/phase4-corpus-alt"
priority = 40

[hooks.post_install]
script = "mkdir -p /var/lib/phase4-corpus; printf installed > /var/lib/phase4-corpus/scriptlet.marker; systemctl start phase4-corpus.service; /usr/sbin/depmod -a"

[hooks.pre_remove]
script = "mkdir -p /var/lib/phase4-corpus; printf removed > /var/lib/phase4-corpus/remove.marker"
