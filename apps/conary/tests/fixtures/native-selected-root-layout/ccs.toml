[package]
name = "native-matrix-root-layout"
version = "1.0.0"
version_scheme = "conary"
release = "1"
kind = "package"
description = "Minimal selected-root layout authority for native lifecycle matrix tests"
license = "MIT"

[package.platform]
os = "linux"
arch = "x86_64"
libc = "gnu"

[provides]
capabilities = ["native-matrix-root-layout"]
binaries = []

[components]
default = ["runtime"]

[[config.files]]
source = "ccs"
path = "/etc/passwd"
noreplace = true
payload = "matched"

[[config.files]]
source = "ccs"
path = "/etc/group"
noreplace = true
payload = "matched"

[hooks]
