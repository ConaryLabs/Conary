[package]
name = "expired-signature"
version = "1.0.0"
version_scheme = "conary"
release = "1"
kind = "package"
description = "Fixture signed with an intentionally stale timestamp"
license = "MIT"

[package.platform]
os = "linux"
arch = "x86_64"
libc = "gnu"

[provides]
capabilities = ["expired-signature"]
binaries = ["/usr/bin/expired-signature"]

[components]
default = ["runtime"]

[hooks]
