[package]
name = "cap-net-raw"
version = "1.0.0"
version_scheme = "conary"
release = "1"
kind = "package"
description = "Fixture that declares raw network capability requirements"
license = "MIT"

[package.platform]
os = "linux"
arch = "x86_64"
libc = "gnu"

[provides]
capabilities = ["cap-net-raw"]
binaries = ["/usr/bin/cap-net-raw"]

[components]
default = ["runtime"]

[hooks]

[capabilities]
version = 1
rationale = "Needs raw packet access"

[capabilities.network]
connect_tcp = [443]
bind_tcp = [80]

[capabilities.linux]
required = ["cap-net-raw"]
