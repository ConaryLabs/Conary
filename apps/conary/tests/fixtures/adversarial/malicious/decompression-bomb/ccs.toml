[package]
name = "decompression-bomb"
version = "1.0.0"
version_scheme = "conary"
release = "1"
kind = "package"
description = "Fixture that expands into an oversized archive entry"
license = "MIT"

[package.platform]
os = "linux"
arch = "x86_64"
libc = "gnu"

[provides]
capabilities = ["decompression-bomb"]
binaries = ["/usr/bin/decompression-bomb"]

[components]
default = ["runtime"]

[hooks]
