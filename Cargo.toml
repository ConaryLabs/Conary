[workspace]
members = [
    "apps/conary",
    "apps/remi",
    "apps/conaryd",
    "apps/conary-test",
    "crates/conary-bootstrap",
    "crates/conary-agent-contract",
    "crates/conary-mcp",
    "crates/conary-core",
]
exclude = ["third_party/resolvo-0.12.0-patched"]
resolver = "3"

[workspace.package]
version = "0.16.1"
edition = "2024"
rust-version = "1.98.0"
authors = ["Conary Contributors"]
license = "MIT"
publish = false

[patch.crates-io]
aws-creds = { path = "third_party/aws-creds-0.39.1-patched" }
rust-s3 = { path = "third_party/rust-s3-0.37.2-patched" }
# See third_party/resolvo-0.12.0-patched/CONARY_PATCH.md.
resolvo = { path = "third_party/resolvo-0.12.0-patched" }

[workspace.dependencies]
# OpenPGP verification (RustCrypto backend)
sequoia-openpgp = { version = "2", default-features = false, features = ["crypto-rust", "allow-experimental-crypto", "allow-variable-time-crypto"] }

# Database
rusqlite = { version = "0.40", features = ["backup", "bundled", "functions", "limits", "session"] }
liblzma = "0.4"
zip = { version = "8.4.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Hashing
sha1 = "0.10.6"
sha2 = "0.11.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "1.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Parallel processing
rayon = "1.8"

# Progress
indicatif = "0.18"

# Temp files
tempfile = "3.10"
criterion = "0.7"
petgraph = "0.8"

# IDs
uuid = { version = "1.0", features = ["v4"] }

# Encoding
base64 = "0.22"
hex = "0.4"
pem = "3.0"

# HTTP
reqwest = { version = "0.13.3", features = ["rustls", "json"] }
url = "2.5"

# File system
walkdir = "2.5"
glob = "0.3.3"
libc = "0.2"
libseccomp = "0.4"
caps = "0.5.6"
inotify = "0.11"
nix = { version = "0.31", features = ["user", "mount", "sched", "process", "signal", "resource", "fs"] }

# Sigstore
sigstore = { version = "0.14", default-features = false, features = ["bundle", "rekor", "rustls-tls"] }
const-oid = { version = "0.10", features = ["db"] }
rustls-pki-types = "1.0"
webpki = { package = "rustls-webpki", version = "0.103", features = ["std"], default-features = false }
x509-cert = { version = "0.2", features = ["pem", "std"] }

# Archives
ar = "0.9"
tar = "0.4"
flate2 = "1.0"
# Pin the upstream Sequoia signature backend until it reaches a crates.io release.
rpm = { git = "https://github.com/ConaryLabs/rpm-rs", rev = "1d34711495afe021993707ad64fb60fa8dc34881", version = "0.27.1", default-features = false, features = ["payload"] }
rpm-version = "0.5.0"
debversion = "0.5.4"
alpm-types = "0.11.2"
alpm = { version = "=5.0.2", default-features = false, features = ["checkver", "pkg-config"] }
semver = "1.0.28"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3"

# Crypto
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.10.1"

# Web framework
axum = "0.8"
tower = "0.5"
tower-http = "0.6"
tokio-stream = "0.1"
mdns-sd = "0.20.0"
dashmap = "6.0"

# MCP
rmcp = "3.1.2"
schemars = "1.0"

# Other shared
fs2 = "0.4"
log = "0.4"
regex = "1.10"
target-lexicon = "0.13.5"
tree-sitter = "0.26.11"
tree-sitter-bash = "0.25.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Fast release profile - optimized but sccache-friendly (no LTO)
# Use: cargo build --profile fast-release
[profile.fast-release]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[profile.dev]
# Faster builds in development
incremental = true

# Multi-gigabyte streaming parser regressions exercise the real SHA-256
# integrity path. Optimize that dependency in tests so bounded-memory proofs do
# not turn debug hashing into a CI-duration bottleneck.
[profile.test.package.sha2]
opt-level = 3
