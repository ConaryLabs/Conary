# Hetzner installimage configuration for the Remi origin.
#
# This file is intentionally host-specific. Running installimage with it erases
# both listed NVMe devices. The remaining space is left unpartitioned for the
# separately verified RAID0/LVM VDO/XFS data-tier procedure.

DRIVE1 /dev/nvme0n1
DRIVE2 /dev/nvme1n1

SWRAID 1
SWRAIDLEVEL 1

BOOTLOADER grub
HOSTNAME remi

PART /boot ext4 1024M
PART /     ext4 160G

IMAGE /root/.oldroot/nfs/images/Ubuntu-2604-resolute-amd64-base.tar.zst
SSHKEYS_URL /root/.ssh/authorized_keys
