# deploy/remi-repositories.toml
# Public package-source authority for the hosted Remi service.

schema_version = 3

[[repositories]]
name = "fedora-44"
url = "https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Everything/x86_64/os"
profile = "fedora-44"
source_identity = "fedora-project"
repository_identity = "fedora-44-everything-x86_64"
stream_kind = "release"
stream_identity = "44"
update_mode = "follow"
enabled = true
priority = 100
metadata_expire_seconds = 21600

[repositories.parser]
package_format = "rpm"
architecture = "x86_64"

[repositories.trust]
ecosystem = "rpm"

[repositories.trust.metadata]
kind = "metalink"
url = "https://mirrors.fedoraproject.org/metalink?repo=fedora-44&arch=x86_64"

[[repositories.trust.package_keys]]
url = "https://fedoraproject.org/fedora.gpg"
fingerprint = "36F612DCF27F7D1A48A835E4DBFCF71C6D9F90A6"

[[repositories]]
name = "ubuntu-26.04"
url = "https://archive.ubuntu.com/ubuntu"
profile = "ubuntu-26.04"
source_identity = "ubuntu-archive"
repository_identity = "ubuntu-resolute-main-amd64"
stream_kind = "release"
stream_identity = "resolute"
update_mode = "follow"
enabled = true
priority = 90
metadata_expire_seconds = 21600

[repositories.parser]
package_format = "deb"
distribution = "resolute"
component = "main"
architecture = "amd64"

[repositories.trust]
ecosystem = "debian"

[[repositories.trust.release_keys]]
url = "https://archive.ubuntu.com/ubuntu/project/ubuntu-archive-keyring.gpg"
fingerprint = "F6ECB3762474EDA9D21B7022871920D1991BC93C"

[[repositories]]
name = "arch-core"
url = "https://geo.mirror.pkgbuild.com/core/os/x86_64"
profile = "arch"
source_identity = "archlinux"
repository_identity = "arch-core-x86_64"
stream_kind = "rolling"
stream_identity = "archlinux"
policy_group = "official-x86_64"
update_mode = "follow"
enabled = true
priority = 80
metadata_expire_seconds = 21600

[repositories.parser]
package_format = "arch"
database = "core"

[repositories.trust]
ecosystem = "arch"

[repositories.trust.keyring]
url = "https://archlinux.org/packages/core/any/archlinux-keyring/download/"
