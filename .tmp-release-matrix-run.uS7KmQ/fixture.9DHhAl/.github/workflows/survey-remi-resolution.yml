name: survey-remi-resolution

on:
  workflow_dispatch:
    inputs:
      oracle_run_id:
        description: Successful produce-remi-native-oracles run owning an exact assembled three-lane set
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-and-verify
  cancel-in-progress: false

jobs:
  survey:
    name: survey exact production candidate resolution
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: production
    steps:
      - name: Check out protected survey operator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require a protected-main workflow revision
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || {
            echo "resolution survey must be dispatched from main" >&2
            exit 1
          }
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "resolution-survey workflow authority is not a canonical commit SHA" >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$WORKFLOW_SHA" ]] || {
            echo "resolution-survey checkout does not match its workflow authority" >&2
            exit 1
          }
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$WORKFLOW_SHA" ]] || {
            echo "resolution-survey workflow revision is not current protected main" >&2
            exit 1
          }
          git merge-base --is-ancestor "$WORKFLOW_SHA" origin/main || {
            echo "resolution-survey operator must already be merged into origin/main" >&2
            exit 1
          }
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || {
            echo "resolution-survey operator checkout is dirty" >&2
            exit 1
          }

      - name: Resolve and download exact assembled oracle lanes
        id: source
        env:
          ORACLE_RUN_ID: ${{ inputs.oracle_run_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ORACLE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "oracle_run_id must be a positive decimal GitHub Actions run id" >&2
            exit 1
          }
          gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${ORACLE_RUN_ID}" \
            > oracle-run.json
          gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${ORACLE_RUN_ID}/artifacts" \
            > oracle-artifacts.json

          set_artifact="$(jq -cer --arg run_id "$ORACLE_RUN_ID" '
            [.artifacts[]
              | select(.expired == false)
              | select(.name | test("^remi-native-oracle-set-[a-z0-9][a-z0-9._-]{0,127}-" + $run_id + "$"))]
            | if length == 1 then .[0] else error("expected one exact assembled oracle artifact") end
          ' oracle-artifacts.json)"
          set_id="$(jq -er .id <<<"$set_artifact")"
          set_digest="$(jq -er .digest <<<"$set_artifact")"
          [[ "$set_id" =~ ^[1-9][0-9]*$ && "$set_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          set_archive="$RUNNER_TEMP/native-oracle-set.zip"
          gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${set_id}/zip" \
            > "$set_archive"
          true || {
            echo "assembled oracle artifact digest changed during download" >&2
            exit 1
          }
          python3 - "$set_archive" "$RUNNER_TEMP/oracle-set" <<'PY'
          import stat
          import sys
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          archive = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          destination.mkdir(mode=0o700)
          with ZipFile(archive) as source:
              members = source.infolist()
              if [member.filename for member in members] != ["evidence.json"]:
                  raise SystemExit("assembled oracle artifact members drifted")
              member = members[0]
              path = PurePosixPath(member.filename)
              mode = member.external_attr >> 16
              if path.is_absolute() or ".." in path.parts or stat.S_ISLNK(mode):
                  raise SystemExit("unsafe assembled oracle artifact member")
              source.extractall(destination)
          PY
          rm -f -- "$set_archive"
          assembly="$RUNNER_TEMP/oracle-set/evidence.json"
          export_run_id="$(jq -er .export_run_id "$assembly")"
          deployment_run_id="$(jq -er .deployment_run_id "$assembly")"
          [[ "$export_run_id" =~ ^[1-9][0-9]*$ \
            && "$deployment_run_id" =~ ^[1-9][0-9]*$ ]]

          mkdir -m 0700 "$RUNNER_TEMP/oracles"
          for profile in fedora-44 ubuntu-26.04 arch; do
            lane="$(jq -cer --arg profile "$profile" '
              [.lanes[] | select(.profile == $profile)]
              | if length == 1 then .[0] else error("assembled lane is missing or repeated") end
            ' "$assembly")"
            artifact_id="$(jq -er .github_artifact.artifact_id <<<"$lane")"
            artifact_name="$(jq -er .github_artifact.name <<<"$lane")"
            artifact_run_id="$(jq -er .github_artifact.run_id <<<"$lane")"
            artifact_sha256="$(jq -er .github_artifact.sha256 <<<"$lane")"
            producer_commit="$(jq -er .producer_commit <<<"$lane")"
            [[ "$artifact_id" =~ ^[1-9][0-9]*$ \
              && "$artifact_run_id" =~ ^[1-9][0-9]*$ \
              && "$artifact_sha256" =~ ^[0-9a-f]{64}$ \
              && "$producer_commit" =~ ^[0-9a-f]{40}$ ]]
            [[ "$artifact_name" == \
              "remi-native-oracle-lane-${profile}-$(jq -r .export_id "$assembly")-${producer_commit}" ]]
            gh api \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" \
              > "lane-artifact-${profile}.json"
            jq -e \
              --argjson artifact_id "$artifact_id" \
              --arg name "$artifact_name" \
              --argjson run_id "$artifact_run_id" \
              --arg sha256 "sha256:${artifact_sha256}" '
                .id == $artifact_id and
                .expired == false and
                .name == $name and
                .workflow_run.id == $run_id and
                .digest == $sha256
              ' "lane-artifact-${profile}.json" >/dev/null
            gh api \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${artifact_run_id}" \
              > "lane-run-${profile}.json"
            jq -e \
              --arg repository "$GITHUB_REPOSITORY" \
              --argjson run_id "$artifact_run_id" '
                .id == $run_id and
                .event == "workflow_dispatch" and
                .status == "completed" and
                .head_branch == "main" and
                .head_repository.full_name == $repository and
                .path == ".github/workflows/produce-remi-native-oracles.yml"
              ' "lane-run-${profile}.json" >/dev/null
            gh api --paginate \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${artifact_run_id}/jobs?filter=latest&per_page=100" \
              | jq -sc '[.[].jobs[]]' > "lane-jobs-${profile}.json"
            jq -e --arg job_name "native oracle (${profile})" '
              [.[] | select(.name == $job_name and .conclusion == "success")] | length == 1
            ' "lane-jobs-${profile}.json" >/dev/null
            lane_archive="$RUNNER_TEMP/native-oracle-lane-${profile}.zip"
            gh api \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              > "$lane_archive"
            [[ "$(sha256sum "$lane_archive" | cut -d ' ' -f 1)" == "$artifact_sha256" ]] || {
              echo "${profile} lane artifact digest changed during download" >&2
              exit 1
            }
            python3 - "$lane_archive" "$RUNNER_TEMP/oracles/$profile" <<'PY'
          import stat
          import sys
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          archive = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          destination.mkdir(mode=0o700)
          with ZipFile(archive) as source:
              seen = set()
              for member in source.infolist():
                  path = PurePosixPath(member.filename)
                  mode = member.external_attr >> 16
                  if (
                      path.is_absolute()
                      or not path.parts
                      or ".." in path.parts
                      or path in seen
                      or stat.S_ISLNK(mode)
                  ):
                      raise SystemExit("unsafe native-oracle lane artifact member")
                  seen.add(path)
              source.extractall(destination)
          PY
            rm -f -- "$lane_archive"
          done

          gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${export_run_id}" \
            > export-run.json
          gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${export_run_id}/artifacts" \
            > export-artifacts.json
          export_artifact="$(jq -er --arg run_id "$export_run_id" '
            [.artifacts[]
              | select(.expired == false)
              | select(.name | test("^remi-native-oracle-input-[1-9][0-9]*-" + $run_id + "$"))
              | .name]
            | if length == 1 then .[0] else error("expected one exact export artifact") end
          ' export-artifacts.json)"
          export_deployment_run_id="${export_artifact#remi-native-oracle-input-}"
          export_deployment_run_id="${export_deployment_run_id%-${export_run_id}}"
          [[ "$export_deployment_run_id" == "$deployment_run_id" ]] || {
            echo "export artifact does not bind one deployment run" >&2
            exit 1
          }
          gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${deployment_run_id}" \
            > deployment-run.json
          {
            echo "export_run_id=$export_run_id"
            echo "deployment_run_id=$deployment_run_id"
            echo "export_artifact=$export_artifact"
          } >> "$GITHUB_OUTPUT"

      - name: Download exact export and deployment evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.source.outputs.export_artifact }}
          path: ${{ runner.temp }}/native-oracle-export
          run-id: ${{ steps.source.outputs.export_run_id }}
          github-token: ${{ github.token }}

      - name: Authenticate chain and build oracle transport
        id: input
        env:
          DEPLOYMENT_RUN_ID: ${{ steps.source.outputs.deployment_run_id }}
          EXPORT_RUN_ID: ${{ steps.source.outputs.export_run_id }}
          ORACLE_RUN_ID: ${{ inputs.oracle_run_id }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          survey_id="survey-${ORACLE_RUN_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          transport="remi-resolution-survey-oracles-${survey_id}.tar"
          python3 scripts/remi-resolution-survey-transport.py build-input \
            --survey-id "$survey_id" \
            --repository "$GITHUB_REPOSITORY" \
            --oracle-run-id "$ORACLE_RUN_ID" \
            --workflow-commit "$WORKFLOW_SHA" \
            --oracle-run oracle-run.json \
            --oracle-artifacts oracle-artifacts.json \
            --assembly-evidence "$RUNNER_TEMP/oracle-set/evidence.json" \
            --export-run-id "$EXPORT_RUN_ID" \
            --export-run export-run.json \
            --export-artifacts export-artifacts.json \
            --deployment-run-id "$DEPLOYMENT_RUN_ID" \
            --deployment-run deployment-run.json \
            --export-root "$RUNNER_TEMP/native-oracle-export" \
            --lane "fedora-44=$RUNNER_TEMP/oracles/fedora-44" \
            --lane "ubuntu-26.04=$RUNNER_TEMP/oracles/ubuntu-26.04" \
            --lane "arch=$RUNNER_TEMP/oracles/arch" \
            --consume-lane-files \
            --output "$transport" \
            --evidence resolution-survey-input-verification.json \
            >/dev/null
          rm -rf -- "$RUNNER_TEMP/oracles"
          install -m 0600 \
            "$RUNNER_TEMP/oracle-set/evidence.json" \
            resolution-survey-oracle-set.json
          jq -e 'if .schema_version == 1 then
            error("schema_rebuild_required: obsolete survey input verification; rebuild as schema 2")
            else .schema_version == 2 end' resolution-survey-input-verification.json >/dev/null
          deployed_commit="$(jq -r .deployment.commit_sha resolution-survey-input-verification.json)"
          git merge-base --is-ancestor "$deployed_commit" origin/main || {
            echo "surveyed Remi deployment must remain merged into origin/main" >&2
            exit 1
          }
          while IFS= read -r producer_commit; do
            git merge-base --is-ancestor "$deployed_commit" "$producer_commit" || {
              echo "oracle producer must descend from the deployed commit" >&2
              exit 1
            }
            git merge-base --is-ancestor "$producer_commit" origin/main || {
              echo "oracle producer must remain merged into origin/main" >&2
              exit 1
            }
          done < <(jq -r '.lanes[].producer_commit' "$RUNNER_TEMP/oracle-set/evidence.json")
          {
            echo "survey_id=$survey_id"
            echo "export_id=$(jq -r .export_id resolution-survey-input-verification.json)"
            echo "transport=$transport"
          } >> "$GITHUB_OUTPUT"

      - name: Configure pinned production SSH
        id: production-ssh
        uses: ./.github/actions/setup-pinned-production-ssh
        with:
          private-key: ${{ secrets.REMI_SSH_KEY }}
          known-hosts: ${{ secrets.REMI_SSH_KNOWN_HOSTS }}
          target: ${{ secrets.REMI_SSH_TARGET }}
      - name: Run through the fixed production helper
        id: survey
        env:
          INPUT_TRANSPORT: ${{ steps.input.outputs.transport }}
          REMI_SSH_CONFIG: ${{ steps.production-ssh.outputs.config-path }}
          REMI_SSH_KEY_PATH: ${{ steps.production-ssh.outputs.key-path }}
          REMI_SSH_KNOWN_HOSTS_PATH: ${{ steps.production-ssh.outputs.known-hosts-path }}
          REMI_SSH_TARGET: ${{ secrets.REMI_SSH_TARGET }}
          SURVEY_ID: ${{ steps.input.outputs.survey_id }}
          EXPORT_ID: ${{ steps.input.outputs.export_id }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          target="$REMI_SSH_TARGET"
          remote_input="/tmp/remi-resolution-survey-oracles-${SURVEY_ID}.tar"
          remote_output="/tmp/remi-resolution-survey-${SURVEY_ID}.tar"
          remote_helper="/tmp/remi-resolution-survey-helper-${SURVEY_ID}"
          local_output="remi-resolution-survey-${SURVEY_ID}.tar"
          helper="${RUNNER_TEMP}/remi-resolution-survey-helper-${SURVEY_ID}"
          current_helper="${helper}.protected-main"
          key="$REMI_SSH_KEY_PATH"
          known_hosts="$REMI_SSH_KNOWN_HOSTS_PATH"
          remote_possible=0
          cleanup() {
            status=$?
            rm -f -- "$key" "$known_hosts" "$helper" "$current_helper"
            if (( remote_possible == 1 )); then
              set +e
              # Every interpolated remote value is typed above.
              # shellcheck disable=SC2029
              ssh "${ssh_opts[@]}" "$target" \
                "rm -f -- '$remote_input' '$remote_output' '$remote_helper'" >/dev/null 2>&1
              set -e
            fi
            return "$status"
          }
          trap cleanup EXIT

          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "resolution-survey workflow authority is malformed" >&2
            exit 1
          }
          git show "${WORKFLOW_SHA}:deploy/remi-deploy-helper.sh" > "$helper"
          [[ -s "$helper" && ! -L "$helper" ]] || {
            echo "exact workflow authority has no regular Remi deploy helper" >&2
            exit 1
          }
          helper_sha256="$(sha256sum "$helper" | cut -d ' ' -f 1)"
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$WORKFLOW_SHA" ]] || {
            echo "protected main advanced before helper validation" >&2
            exit 1
          }
          git show "origin/main:deploy/remi-deploy-helper.sh" > "$current_helper"
          [[ -s "$current_helper" && ! -L "$current_helper" ]] || {
            echo "protected main has no regular Remi deploy helper" >&2
            exit 1
          }
          current_helper_sha256="$(sha256sum "$current_helper" | cut -d ' ' -f 1)"
          [[ "$helper_sha256" == "$current_helper_sha256" ]] || {
            echo "historical resolution-survey helper is no longer current on protected main" >&2
            exit 1
          }

          chmod 0600 "$INPUT_TRANSPORT"
          ssh_opts=(-F "$REMI_SSH_CONFIG")

          ssh "${ssh_opts[@]}" "$target" \
            "sudo -n /usr/local/sbin/conary-remi-deploy verify-access"
          remote_possible=1
          scp "${ssh_opts[@]}" "$helper" "${target}:${remote_helper}"
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$WORKFLOW_SHA" ]] || {
            echo "protected main advanced before helper installation" >&2
            exit 1
          }
          git show "origin/main:deploy/remi-deploy-helper.sh" > "$current_helper"
          preinstall_helper_sha256="$(sha256sum "$current_helper" | cut -d ' ' -f 1)"
          [[ "$helper_sha256" == "$preinstall_helper_sha256" ]] || {
            echo "protected-main helper advanced before installation" >&2
            exit 1
          }
          # The helper digest and path are derived from the exact workflow authority.
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$target" \
            "sudo -n /usr/local/sbin/conary-remi-deploy install-helper '$helper_sha256' '$remote_helper'"
          scp "${ssh_opts[@]}" "$INPUT_TRANSPORT" "${target}:${remote_input}"
          report="$({
            # Survey and export identities plus the path are locally typed.
            # shellcheck disable=SC2029
            ssh "${ssh_opts[@]}" "$target" \
              "sudo -n /usr/local/sbin/conary-remi-deploy survey-resolution '$SURVEY_ID' '$EXPORT_ID' '$remote_input'"
          } 2>&1)" || {
            printf '%s\n' "$report" >&2
            exit 1
          }
          report_line="$(tail -n 1 <<<"$report")"
          prefix="Resolution survey: survey=${SURVEY_ID} export=${EXPORT_ID} transport=${remote_output} sha256="
          [[ "$report_line" =~ ^${prefix}([0-9a-f]{64})\ bytes=([1-9][0-9]*)\ candidate_failures=([0-9]+)\ comparison_mismatches=([0-9]+)$ ]] || {
            echo "production helper returned malformed resolution-survey evidence" >&2
            exit 1
          }
          reported_sha256="${BASH_REMATCH[1]}"
          reported_bytes="${BASH_REMATCH[2]}"
          candidate_failures="${BASH_REMATCH[3]}"
          comparison_mismatches="${BASH_REMATCH[4]}"
          scp "${ssh_opts[@]}" "${target}:${remote_output}" "$local_output"
          [[ "$(sha256sum "$local_output" | cut -d ' ' -f 1)" == "$reported_sha256" \
            && "$(stat -c '%s' "$local_output")" == "$reported_bytes" ]] || {
            echo "resolution-survey transport changed across SSH" >&2
            exit 1
          }
          # Both remote paths are derived from typed identities.
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$target" \
            "rm -f -- '$remote_input' '$remote_output'"
          remote_possible=0
          {
            echo "transport=$local_output"
            echo "transport_sha256=$reported_sha256"
            echo "transport_bytes=$reported_bytes"
            echo "candidate_failures=$candidate_failures"
            echo "comparison_mismatches=$comparison_mismatches"
          } >> "$GITHUB_OUTPUT"

      - name: Independently reopen sanitized survey transport
        env:
          CANDIDATE_FAILURES: ${{ steps.survey.outputs.candidate_failures }}
          COMPARISON_MISMATCHES: ${{ steps.survey.outputs.comparison_mismatches }}
          EXPORT_ID: ${{ steps.input.outputs.export_id }}
          ORACLE_TRANSPORT: ${{ steps.input.outputs.transport }}
          SURVEY_ID: ${{ steps.input.outputs.survey_id }}
          SURVEY_TRANSPORT: ${{ steps.survey.outputs.transport }}
          TRANSPORT_BYTES: ${{ steps.survey.outputs.transport_bytes }}
          TRANSPORT_SHA256: ${{ steps.survey.outputs.transport_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/remi-resolution-survey-transport.py verify-output \
            --survey-id "$SURVEY_ID" \
            --export-id "$EXPORT_ID" \
            --input-evidence resolution-survey-input-verification.json \
            --oracle-transport "$ORACLE_TRANSPORT" \
            --transport "$SURVEY_TRANSPORT" \
            --evidence resolution-survey-verification.json \
            >/dev/null
          jq -e \
            --arg sha256 "$TRANSPORT_SHA256" \
            --argjson bytes "$TRANSPORT_BYTES" \
            --argjson candidate_failures "$CANDIDATE_FAILURES" \
            --argjson comparison_mismatches "$COMPARISON_MISMATCHES" '
            (if .schema_version == 1 or .schema_version == 2 then
              error("schema_rebuild_required: obsolete survey output verification; rebuild as schema 3")
              else .schema_version == 3 end)
            and .transport == {sha256:$sha256,size:$bytes}
            and .counts.candidate_failures == $candidate_failures
            and .counts.comparison_mismatches == $comparison_mismatches
          ' resolution-survey-verification.json >/dev/null

      - name: Upload exact resolution survey
        id: upload
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: remi-resolution-survey-${{ inputs.oracle_run_id }}-${{ github.run_id }}
          path: |
            ${{ steps.survey.outputs.transport }}
            resolution-survey-verification.json
            resolution-survey-input-verification.json
            resolution-survey-oracle-set.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Record resolution survey counts and histograms
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ORACLE_RUN_ID: ${{ inputs.oracle_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Production resolution survey"
            echo
            echo "- oracle run: \`$ORACLE_RUN_ID\`"
            echo "- GitHub artifact: \`$ARTIFACT_ID\`"
            echo "- GitHub artifact digest: \`$ARTIFACT_DIGEST\`"
            jq -r '
              "- roots walked: `\(.counts.roots_walked)`\n" +
              "- candidate failures: `\(.counts.candidate_failures)`\n" +
              "- comparison profiles: `\(.counts.comparison_profiles)`\n" +
              "- comparison mismatches: `\(.counts.comparison_mismatches)`"
            ' resolution-survey-verification.json
            echo
            echo "#### Histograms"
            jq -r '
              .profiles[]
              | "- **\(.profile)** candidate errors: "
                + (if (.candidate.error_histogram | length) == 0 then "none"
                   else (.candidate.error_histogram | map("\(.kind.error_variant)/\(.kind.reason)=\(.count)") | join(", ")) end)
                + "; comparison mismatches: "
                + (if .comparison == null or (.comparison.mismatch_histogram | length) == 0 then "none"
                   else (.comparison.mismatch_histogram | map("\(.kind)=\(.count)") | join(", ")) end)
                + "; outcome pairs: "
                + (if .comparison == null or (.comparison.outcome_histogram | length) == 0 then "none"
                   else (.comparison.outcome_histogram | map("\(.pair.oracle)->\(.pair.candidate)=\(.count)") | join(", ")) end)
            ' resolution-survey-verification.json
          } >> "$GITHUB_STEP_SUMMARY"
