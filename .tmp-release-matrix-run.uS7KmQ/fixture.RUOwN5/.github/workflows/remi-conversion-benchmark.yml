name: remi-conversion-benchmark

on:
  workflow_dispatch:
    inputs:
      deployment_run_id:
        description: Successful private-candidate deployment run owning the benchmark authority.
        required: true
        type: string
      profile:
        description: Exact public source profile to benchmark.
        required: true
        type: choice
        options:
          - fedora-44
          - ubuntu-26.04
          - arch
      profile_revision_sha256:
        description: Exact registered profile revision to hold constant across benchmark runs.
        required: true
        type: string
      package_key_sha256:
        description: Exact immutable-catalog package-key SHA-256.
        required: true
        type: string
      source_url:
        description: Credential-free HTTPS URL for the exact native source artifact.
        required: true
        type: string
      source_sha256:
        description: Exact lowercase SHA-256 of the native source artifact.
        required: true
        type: string
      source_size_bytes:
        description: Exact native source artifact size in bytes.
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-and-verify
  cancel-in-progress: false

jobs:
  benchmark:
    name: benchmark exact production conversion
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    steps:
      - name: Check out exact protected benchmark operator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require a protected-main workflow revision
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || {
            echo "conversion benchmark must be dispatched from main" >&2
            exit 1
          }
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "workflow authority is not a canonical commit SHA" >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$WORKFLOW_SHA" ]] || {
            echo "checkout does not match the executing workflow revision" >&2
            exit 1
          }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$WORKFLOW_SHA" origin/main || {
            echo "benchmark operator must already be merged into origin/main" >&2
            exit 1
          }

      - name: Bind successful exact private-candidate deployment
        id: deployment
        env:
          DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOYMENT_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "deployment_run_id must be a decimal GitHub Actions run id" >&2
            exit 1
          }
          source_run="$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${DEPLOYMENT_RUN_ID}")"
          jq -e \
            --argjson run_id "$DEPLOYMENT_RUN_ID" \
            --arg repository "$GITHUB_REPOSITORY" '
              .id == $run_id
              and .event == "workflow_dispatch"
              and .status == "completed"
              and .conclusion == "success"
              and .head_branch == "main"
              and .head_repository.full_name == $repository
              and (.head_sha | test("^[0-9a-f]{40}$"))
              and (.path | startswith(".github/workflows/deploy-remi-candidate.yml"))
            ' <<<"$source_run" >/dev/null || {
              echo "source run is not an exact successful protected-main Remi deployment" >&2
              exit 1
            }
          echo "head_sha=$(jq -r '.head_sha' <<<"$source_run")" >> "$GITHUB_OUTPUT"

      - name: Download exact sanitized deployment evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: remi-deployment-inspection-${{ inputs.deployment_run_id }}
          path: ${{ runner.temp }}/deployment-inspection
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.deployment_run_id }}

      - name: Reopen exact deployment and candidate identities
        id: authority
        env:
          DEPLOYED_COMMIT_SHA: ${{ steps.deployment.outputs.head_sha }}
          INSPECTION_DIR: ${{ runner.temp }}/deployment-inspection
          PROFILE: ${{ inputs.profile }}
          REQUESTED_REVISION: ${{ inputs.profile_revision_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          inspection="$INSPECTION_DIR/remi-deployment-inspection.json"
          manifest="$INSPECTION_DIR/remi-candidate-manifest.json"
          for evidence in "$inspection" "$manifest"; do
            [[ -f "$evidence" && ! -L "$evidence" ]] || {
              echo "deployment artifact is missing required regular evidence" >&2
              exit 1
            }
          done
          case "$PROFILE" in
            fedora-44|ubuntu-26.04|arch) ;;
            *)
              echo "unsupported benchmark profile" >&2
              exit 1
              ;;
          esac
          [[ "$REQUESTED_REVISION" =~ ^[0-9a-f]{64}$ ]] || {
            echo "profile_revision_sha256 must be an exact lowercase SHA-256" >&2
            exit 1
          }

          jq -e \
            --arg commit "$DEPLOYED_COMMIT_SHA" \
            --arg profile "$PROFILE" '
              . as $inspection
              | .deployment_evidence_schema_version == 3
              and .inspection_available == true
              and .deployment.commit_sha == $commit
              and (.deployment.binary_sha256 | test("^[0-9a-f]{64}$"))
              and .deployment.completion_mode == "private-candidates"
              and .deployment.outcome == "complete"
              and .deployment.failure_phase == null
              and (.deployment.transition_completed_at | type == "number")
              and (.deployment.repository_refreshes | type == "array")
              and (.deployment.repository_refreshes | length) >= 1
              and .deployment.repository_refreshes[0].scope == {kind: "all"}
              and (.candidates | map(.profile))
                == ["fedora-44", "ubuntu-26.04", "arch"]
              and all(.candidates[];
                (.profile_revision_sha256 | test("^[0-9a-f]{64}$"))
                and (.run_id | type == "string")
                and (.packages | type == "number")
                and .packages > 0
                and (.configured_sources | type == "number")
                and .configured_sources > 0
                and .latest_refresh.run_id == .run_id
                and .latest_refresh.state == "candidate"
                and (.latest_refresh.started_at | type == "number")
                and (.latest_refresh.finished_at | type == "number")
                and (.latest_refresh.finished_at
                  > $inspection.deployment.transition_completed_at)
                and (. as $candidate
                  | any($inspection.deployment.repository_refreshes[];
                      (.successful_profiles | index($candidate.profile)) != null
                      and $candidate.latest_refresh.started_at >= .started_at
                      and $candidate.latest_refresh.finished_at <= .finished_at)))
              and any(.candidates[]; .profile == $profile)
            ' "$inspection" >/dev/null || {
              echo "deployment evidence does not prove the selected exact private candidate" >&2
              exit 1
            }

          binary_sha256="$(jq -er '.deployment.binary_sha256' "$inspection")"
          jq -e \
            --arg commit "$DEPLOYED_COMMIT_SHA" \
            --arg binary_sha256 "$binary_sha256" '
              .schema_version == 2
              and .source.commit_sha == $commit
              and .source.clean == true
              and .build.package == "remi"
              and (.build.version | type == "string" and length > 0)
              and .build.profile == "release"
              and .build.command == "cargo build -p remi --release --locked"
              and .build.conary_git_commit == $commit
              and .build.conary_git_dirty == "false"
              and .artifact.binary_sha256 == $binary_sha256
              and (.artifact.binary_bytes | type == "number")
              and .artifact.binary_bytes > 0
            ' "$manifest" >/dev/null || {
              echo "candidate manifest does not bind the clean exact deployed binary" >&2
              exit 1
            }

          cp -- "$inspection" remi-deployment-inspection.json
          cp -- "$manifest" remi-candidate-manifest.json
          {
            echo "revision=$REQUESTED_REVISION"
            echo "binary_sha256=$binary_sha256"
            echo "version=$(jq -er '.build.version' "$manifest")"
          } >> "$GITHUB_OUTPUT"

      - name: Acquire and authenticate exact source bytes
        env:
          DEPLOYED_COMMIT_SHA: ${{ steps.deployment.outputs.head_sha }}
          DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
          PACKAGE_KEY_SHA256: ${{ inputs.package_key_sha256 }}
          PROFILE: ${{ inputs.profile }}
          REVISION: ${{ steps.authority.outputs.revision }}
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
          SOURCE_SIZE_BYTES: ${{ inputs.source_size_bytes }}
          SOURCE_URL: ${{ inputs.source_url }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PACKAGE_KEY_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "package_key_sha256 must be an exact lowercase SHA-256" >&2
            exit 1
          }
          [[ "$SOURCE_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "source_sha256 must be an exact lowercase SHA-256" >&2
            exit 1
          }
          [[ "$SOURCE_SIZE_BYTES" =~ ^[1-9][0-9]{0,9}$ ]] || {
            echo "source_size_bytes must be a positive decimal byte count" >&2
            exit 1
          }
          source_size=$((10#$SOURCE_SIZE_BYTES))
          (( source_size <= 8 * 1024 * 1024 * 1024 )) || {
            echo "source_size_bytes exceeds the 8 GiB production staging limit" >&2
            exit 1
          }
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          value = os.environ["SOURCE_URL"]
          parsed = urlsplit(value)
          valid = (
              1 <= len(value) <= 4096
              and all(ord(character) >= 0x20 for character in value)
              and parsed.scheme == "https"
              and parsed.hostname is not None
              and parsed.username is None
              and parsed.password is None
              and not parsed.query
              and not parsed.fragment
          )
          if not valid:
              raise SystemExit("source_url must be one credential-free HTTPS URL without query or fragment")
          PY

          source_path="${RUNNER_TEMP}/remi-conversion-source.native"
          curl_error="${RUNNER_TEMP}/remi-conversion-source-curl.stderr"
          rm -f -- "$source_path" "$curl_error"
          if ! curl \
            --proto '=https' \
            --proto-redir '=https' \
            --location \
            --fail \
            --silent \
            --connect-timeout 30 \
            --max-time 3600 \
            --max-filesize "$source_size" \
            --output "$source_path" \
            "$SOURCE_URL" 2>"$curl_error"; then
            rm -f -- "$source_path" "$curl_error"
            echo "exact source artifact download failed" >&2
            exit 1
          fi
          rm -f -- "$curl_error"
          [[ -f "$source_path" && ! -L "$source_path" ]] || {
            echo "downloaded source artifact is not a regular file" >&2
            exit 1
          }
          observed_size="$(stat -c %s -- "$source_path")"
          observed_sha256="$(sha256sum "$source_path" | cut -d ' ' -f 1)"
          [[ "$observed_size" == "$SOURCE_SIZE_BYTES" ]] || {
            echo "downloaded source artifact size differs from the exact input" >&2
            exit 1
          }
          [[ "$observed_sha256" == "$SOURCE_SHA256" ]] || {
            echo "downloaded source artifact digest differs from the exact input" >&2
            exit 1
          }
          chmod 0600 "$source_path"

          jq -n \
            --argjson deployment_run_id "$DEPLOYMENT_RUN_ID" \
            --arg deployed_commit_sha "$DEPLOYED_COMMIT_SHA" \
            --arg profile "$PROFILE" \
            --arg revision "$REVISION" \
            --arg package_key_sha256 "$PACKAGE_KEY_SHA256" \
            --arg source_sha256 "$SOURCE_SHA256" \
            --argjson source_size_bytes "$SOURCE_SIZE_BYTES" '
              {
                schema_version: 1,
                deployment_run_id: $deployment_run_id,
                deployed_commit_sha: $deployed_commit_sha,
                profile: $profile,
                profile_revision_sha256: $revision,
                package_key_sha256: $package_key_sha256,
                source_artifact: {
                  acquisition: "credential_free_https",
                  sha256: $source_sha256,
                  size_bytes: $source_size_bytes
                }
              }
            ' > remi-conversion-source-verification-v1.json

      - name: Configure pinned production SSH
        id: production-ssh
        uses: ./.github/actions/setup-pinned-production-ssh
        with:
          private-key: ${{ secrets.REMI_SSH_KEY }}
          known-hosts: ${{ secrets.REMI_SSH_KNOWN_HOSTS }}
          target: ${{ secrets.REMI_SSH_TARGET }}
      - name: Run through the fixed production helper
        id: benchmark
        env:
          BINARY_SHA256: ${{ steps.authority.outputs.binary_sha256 }}
          DEPLOYED_COMMIT_SHA: ${{ steps.deployment.outputs.head_sha }}
          DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
          PACKAGE_KEY_SHA256: ${{ inputs.package_key_sha256 }}
          PROFILE: ${{ inputs.profile }}
          REMI_SSH_CONFIG: ${{ steps.production-ssh.outputs.config-path }}
          REMI_SSH_KEY_PATH: ${{ steps.production-ssh.outputs.key-path }}
          REMI_SSH_KNOWN_HOSTS_PATH: ${{ steps.production-ssh.outputs.known-hosts-path }}
          REMI_SSH_TARGET: ${{ secrets.REMI_SSH_TARGET }}
          REMI_VERSION: ${{ steps.authority.outputs.version }}
          REVISION: ${{ steps.authority.outputs.revision }}
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
          SOURCE_SIZE_BYTES: ${{ inputs.source_size_bytes }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          target="$REMI_SSH_TARGET"
          for digest in "$BINARY_SHA256" "$REVISION" "$PACKAGE_KEY_SHA256" "$SOURCE_SHA256"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || {
              echo "benchmark authority contains a malformed SHA-256" >&2
              exit 1
            }
          done
          [[ "$DEPLOYMENT_RUN_ID" =~ ^[1-9][0-9]*$ \
            && "$WORKFLOW_RUN_ID" =~ ^[1-9][0-9]*$ \
            && "$WORKFLOW_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ \
            && "$REMI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
              echo "benchmark run identity is malformed" >&2
              exit 1
          }

          benchmark_id="${DEPLOYMENT_RUN_ID}-${WORKFLOW_RUN_ID}-${WORKFLOW_RUN_ATTEMPT}"
          remote_source="/tmp/remi-conversion-source-${benchmark_id}.native"
          remote_transport="/tmp/remi-conversion-benchmark-${benchmark_id}.json"
          remote_helper="/tmp/remi-deploy-helper-${benchmark_id}"
          local_source="${RUNNER_TEMP}/remi-conversion-source.native"
          local_transport="${RUNNER_TEMP}/remi-conversion-benchmark-${benchmark_id}.json"
          helper="${RUNNER_TEMP}/remi-deploy-helper-${benchmark_id}"
          key="$REMI_SSH_KEY_PATH"
          known_hosts="$REMI_SSH_KNOWN_HOSTS_PATH"
          helper_stdout="${RUNNER_TEMP}/remi-conversion-benchmark-helper.stdout"
          helper_stderr="${RUNNER_TEMP}/remi-conversion-benchmark-helper.stderr"
          failure_record="remi-conversion-benchmark-failure-v1.json"
          failure_record_next="${failure_record}.next"
          remote_cleanup_possible=0
          cleanup() {
            status=$?
            set +e
            if (( remote_cleanup_possible == 1 )); then
              # Every interpolated remote path is derived from decimal run ids.
              # shellcheck disable=SC2029
              ssh "${ssh_opts[@]}" "$target" \
                "rm -f -- '$remote_source' '$remote_transport' '$remote_helper'" \
                >/dev/null 2>&1
            fi
            rm -f -- \
              "$key" \
              "$known_hosts" \
              "$helper" \
              "$helper_stdout" \
              "$helper_stderr" \
              "$failure_record_next" \
              "$local_source"
            set -e
            return "$status"
          }
          trap cleanup EXIT
          rm -f -- "$failure_record" "$failure_record_next"

          [[ -f "$local_source" && ! -L "$local_source" ]] || {
            echo "authenticated runner source artifact disappeared" >&2
            exit 1
          }
          [[ "$(stat -c %s -- "$local_source")" == "$SOURCE_SIZE_BYTES" \
            && "$(sha256sum "$local_source" | cut -d ' ' -f 1)" == "$SOURCE_SHA256" ]] || {
              echo "authenticated runner source artifact changed before staging" >&2
              exit 1
          }

          git show "${WORKFLOW_SHA}:deploy/remi-deploy-helper.sh" > "$helper"
          [[ -s "$helper" && ! -L "$helper" ]] || {
            echo "exact workflow authority has no regular Remi deploy helper" >&2
            exit 1
          }
          helper_sha256="$(sha256sum "$helper" | cut -d ' ' -f 1)"

          ssh_opts=(-F "$REMI_SSH_CONFIG")

          ssh "${ssh_opts[@]}" "$target" \
            "sudo -n /usr/local/sbin/conary-remi-deploy verify-access"
          remote_cleanup_possible=1
          scp "${ssh_opts[@]}" "$helper" "${target}:${remote_helper}"
          # Every interpolated remote value is typed above.
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$target" \
            "sudo -n /usr/local/sbin/conary-remi-deploy install-helper '$helper_sha256' '$remote_helper'"
          scp "${ssh_opts[@]}" "$local_source" "${target}:${remote_source}"

          # Every interpolated helper argument is typed above.
          rm -f -- "$helper_stdout" "$helper_stderr"
          set +e
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$target" \
            "sudo -n /usr/local/sbin/conary-remi-deploy benchmark-remi-conversion '$benchmark_id' '$BINARY_SHA256' '$PROFILE' '$REVISION' '$PACKAGE_KEY_SHA256' '$SOURCE_SHA256' '$SOURCE_SIZE_BYTES'" \
            >"$helper_stdout" 2>"$helper_stderr"
          helper_status=$?
          set -e
          [[ -f "$helper_stdout" && ! -L "$helper_stdout" \
            && -f "$helper_stderr" && ! -L "$helper_stderr" ]] || {
              rm -f -- "$helper_stdout" "$helper_stderr"
              echo "production helper did not return isolated regular output" >&2
              exit 1
          }
          rm -f -- "$helper_stderr"
          [[ ! -e "$helper_stderr" ]] || {
            echo "private production helper diagnostics were not removed" >&2
            exit 1
          }

          stdout_shape_valid=false
          helper_record=""
          if stdout_bytes="$(stat -c %s -- "$helper_stdout")" \
            && [[ "$stdout_bytes" =~ ^[1-9][0-9]{0,3}$ ]] \
            && (( stdout_bytes <= 4096 )) \
            && [[ "$(wc -l < "$helper_stdout")" == "1" ]] \
            && grep -aEx '[ -~]+' "$helper_stdout" >/dev/null; then
              IFS= read -r helper_record < "$helper_stdout"
              if (( ${#helper_record} + 1 == stdout_bytes )); then
                stdout_shape_valid=true
              fi
          fi

          success_record_valid=false
          reported_sha256=""
          reported_bytes=""
          if (( helper_status == 0 )) && [[ "$stdout_shape_valid" == "true" ]]; then
            label=""
            operation=""
            run_field=""
            transport_field=""
            sha_field=""
            bytes_field=""
            extra=""
            read -r label operation run_field transport_field sha_field bytes_field extra \
              <<<"$helper_record"
            if [[ "$label" == "Conversion" \
              && "$operation" == "benchmark:" \
              && "$run_field" == "run=${benchmark_id}" \
              && "$transport_field" == "transport=${remote_transport}" \
              && "$sha_field" =~ ^sha256=[0-9a-f]{64}$ \
              && "$bytes_field" =~ ^bytes=[1-9][0-9]{0,7}$ \
              && -z "$extra" ]]; then
                reported_sha256="${sha_field#sha256=}"
                reported_bytes="${bytes_field#bytes=}"
                expected_success_record="Conversion benchmark: run=${benchmark_id} transport=${remote_transport} sha256=${reported_sha256} bytes=${reported_bytes}"
                if [[ "$helper_record" == "$expected_success_record" ]] \
                  && (( 10#$reported_bytes <= 16 * 1024 * 1024 )); then
                    success_record_valid=true
                fi
            fi
          fi

          helper_envelope_valid=false
          failure_stage="helper-envelope-invalid"
          helper_status_json=null
          service_outcome=""
          envelope_prefix='Conversion benchmark failure: '
          if (( helper_status >= 1 && helper_status <= 254 )) \
            && [[ "$stdout_shape_valid" == "true" \
              && "$helper_record" == "$envelope_prefix"* ]]; then
              envelope_json="${helper_record:${#envelope_prefix}}"
              if canonical_envelope="$(jq -cer \
                --argjson observed_status "$helper_status" '
                  def early_stage:
                    . == "request-validation"
                    or . == "runtime-authority"
                    or . == "systemctl-authority"
                    or . == "account-identity"
                    or . == "binary-config-authority"
                    or . == "live-root-authority"
                    or . == "work-root-type"
                    or . == "work-root-owner"
                    or . == "work-root-mode"
                    or . == "work-root-resolution"
                    or . == "work-root-separation"
                    or . == "work-root-filesystem"
                    or . == "work-root-device"
                    or . == "benchmark-root-authority"
                    or . == "input-target-authority"
                    or . == "source-authentication"
                    or . == "binary-authentication"
                    or . == "private-config-copy"
                    or . == "private-source-copy"
                    or . == "service-active";
                  def stopped_stage:
                    . == "service-stop"
                    or . == "benchmark-command"
                    or . == "raw-report-validation"
                    or . == "public-sidecar-validation"
                    or . == "service-restore";
                  def allowed_stage:
                    early_stage
                    or stopped_stage
                    or . == "transport-publication"
                    or . == "internal";
                  def allowed_outcome:
                    . == "not-stopped"
                    or . == "restored"
                    or . == "restore-failed";
                  def stage_outcome($outcome):
                    if early_stage then $outcome == "not-stopped"
                    elif stopped_stage then
                      $outcome == "restored" or $outcome == "restore-failed"
                    elif . == "transport-publication" then $outcome == "restored"
                    elif . == "internal" then ($outcome | allowed_outcome)
                    else false
                    end;
                  if type == "object"
                    and (keys | sort)
                      == ["schema_version", "service_outcome", "stage", "status"]
                    and .schema_version == 1
                    and (.stage | type == "string" and allowed_stage)
                    and (.status | type == "number"
                      and floor == . and . >= 1 and . <= 254)
                    and .status == $observed_status
                    and (.service_outcome | type == "string" and allowed_outcome)
                    and (.stage as $stage | .service_outcome as $outcome
                      | $stage | stage_outcome($outcome))
                  then {
                    schema_version: .schema_version,
                    stage: .stage,
                    status: .status,
                    service_outcome: .service_outcome
                  }
                  else error("invalid conversion benchmark helper failure envelope")
                  end
                ' <<<"$envelope_json" 2>/dev/null)" \
                && [[ "$canonical_envelope" == "$envelope_json" ]]; then
                  helper_envelope_valid=true
                  failure_stage="$(jq -er '.stage' <<<"$canonical_envelope")"
                  helper_status_json="$helper_status"
                  service_outcome="$(jq -er '.service_outcome' <<<"$canonical_envelope")"
              fi
          fi

          rm -f -- "$helper_stdout"
          [[ ! -e "$helper_stdout" ]] || {
            echo "production helper output was not removed after validation" >&2
            exit 1
          }

          if (( helper_status != 0 )) || [[ "$success_record_valid" != "true" ]]; then
            jq -cne \
              --arg benchmark_id "$benchmark_id" \
              --arg binary_sha256 "$BINARY_SHA256" \
              --arg binary_version "$REMI_VERSION" \
              --arg deployed_commit_sha "$DEPLOYED_COMMIT_SHA" \
              --argjson deployment_run_id "$DEPLOYMENT_RUN_ID" \
              --arg failure_stage "$failure_stage" \
              --argjson helper_envelope_valid "$helper_envelope_valid" \
              --arg helper_sha256 "$helper_sha256" \
              --argjson helper_status "$helper_status_json" \
              --argjson ssh_status "$helper_status" \
              --arg package_key_sha256 "$PACKAGE_KEY_SHA256" \
              --arg profile "$PROFILE" \
              --arg revision "$REVISION" \
              --arg service_outcome "$service_outcome" \
              --arg source_sha256 "$SOURCE_SHA256" \
              --argjson source_size_bytes "$SOURCE_SIZE_BYTES" \
              --arg workflow_commit_sha "$WORKFLOW_SHA" \
              --argjson workflow_run_attempt "$WORKFLOW_RUN_ATTEMPT" \
              --argjson workflow_run_id "$WORKFLOW_RUN_ID" '
                {
                  schema_version: 1,
                  evidence_class: "conversion-benchmark-failure",
                  benchmark_id: $benchmark_id,
                  deployment: {
                    run_id: $deployment_run_id,
                    commit_sha: $deployed_commit_sha,
                    binary_sha256: $binary_sha256,
                    binary_version: $binary_version
                  },
                  workflow: {
                    commit_sha: $workflow_commit_sha,
                    helper_sha256: $helper_sha256,
                    run_id: $workflow_run_id,
                    run_attempt: $workflow_run_attempt
                  },
                  request: {
                    profile: $profile,
                    profile_revision_sha256: $revision,
                    package_key_sha256: $package_key_sha256,
                    source_artifact_sha256: $source_sha256,
                    source_size_bytes: $source_size_bytes
                  },
                  failure: {
                    stage: $failure_stage,
                    ssh_status: $ssh_status,
                    helper_status: $helper_status,
                    service_outcome:
                      (if $helper_envelope_valid then $service_outcome else null end),
                    helper_envelope_valid: $helper_envelope_valid
                  }
                }
              ' > "$failure_record_next"
            chmod 0600 "$failure_record_next"
            jq -e '
              def sha256: type == "string" and test("^[0-9a-f]{64}$");
              def commit: type == "string" and test("^[0-9a-f]{40}$");
              def early_stage:
                . == "request-validation"
                or . == "runtime-authority"
                or . == "systemctl-authority"
                or . == "account-identity"
                or . == "binary-config-authority"
                or . == "live-root-authority"
                or . == "work-root-type"
                or . == "work-root-owner"
                or . == "work-root-mode"
                or . == "work-root-resolution"
                or . == "work-root-separation"
                or . == "work-root-filesystem"
                or . == "work-root-device"
                or . == "benchmark-root-authority"
                or . == "input-target-authority"
                or . == "source-authentication"
                or . == "binary-authentication"
                or . == "private-config-copy"
                or . == "private-source-copy"
                or . == "service-active";
              def stopped_stage:
                . == "service-stop"
                or . == "benchmark-command"
                or . == "raw-report-validation"
                or . == "public-sidecar-validation"
                or . == "service-restore";
              def helper_stage:
                early_stage
                or stopped_stage
                or . == "transport-publication"
                or . == "internal";
              def allowed_outcome:
                . == "not-stopped"
                or . == "restored"
                or . == "restore-failed";
              def stage_outcome($outcome):
                if early_stage then $outcome == "not-stopped"
                elif stopped_stage then
                  $outcome == "restored" or $outcome == "restore-failed"
                elif . == "transport-publication" then $outcome == "restored"
                elif . == "internal" then ($outcome | allowed_outcome)
                else false
                end;
              (keys | sort)
                == ["benchmark_id", "deployment", "evidence_class", "failure", "request", "schema_version", "workflow"]
              and .schema_version == 1
              and .evidence_class == "conversion-benchmark-failure"
              and (.benchmark_id | type == "string"
                and test("^[1-9][0-9]*-[1-9][0-9]*-[1-9][0-9]*$"))
              and (.deployment | keys | sort)
                == ["binary_sha256", "binary_version", "commit_sha", "run_id"]
              and (.deployment.run_id | type == "number" and floor == . and . > 0)
              and (.deployment.commit_sha | commit)
              and (.deployment.binary_sha256 | sha256)
              and (.deployment.binary_version | type == "string"
                and test("^[0-9]+\\.[0-9]+\\.[0-9]+([+-][0-9A-Za-z.-]+)?$"))
              and (.workflow | keys | sort)
                == ["commit_sha", "helper_sha256", "run_attempt", "run_id"]
              and (.workflow.commit_sha | commit)
              and (.workflow.helper_sha256 | sha256)
              and (.workflow.run_id | type == "number" and floor == . and . > 0)
              and (.workflow.run_attempt | type == "number" and floor == . and . > 0)
              and (.request | keys | sort)
                == ["package_key_sha256", "profile", "profile_revision_sha256", "source_artifact_sha256", "source_size_bytes"]
              and (.request.profile == "fedora-44"
                or .request.profile == "ubuntu-26.04"
                or .request.profile == "arch")
              and (.request.profile_revision_sha256 | sha256)
              and (.request.package_key_sha256 | sha256)
              and (.request.source_artifact_sha256 | sha256)
              and (.request.source_size_bytes | type == "number"
                and floor == . and . > 0 and . <= 8589934592)
              and (.failure | keys | sort)
                == ["helper_envelope_valid", "helper_status", "service_outcome", "ssh_status", "stage"]
              and ((.failure.helper_envelope_valid | type) == "boolean")
              and (.failure.ssh_status | type == "number"
                and floor == . and . >= 0 and . <= 255)
              and (if .failure.helper_envelope_valid
                then (.failure.helper_status | type == "number"
                    and floor == . and . >= 1 and . <= 254)
                  and .failure.helper_status == .failure.ssh_status
                  and (.failure.stage | type == "string" and helper_stage)
                  and (.failure.service_outcome | type == "string" and allowed_outcome)
                  and (.failure.stage as $stage
                    | .failure.service_outcome as $outcome
