              exit 1
          }

          cp -- "$local_transport" remi-conversion-benchmark-public-v6.json
          {
            echo "result=success"
            echo "benchmark_id=$benchmark_id"
            echo "public_sha256=$reported_sha256"
            echo "public_bytes=$reported_bytes"
            echo "raw_sha256=$(jq -er '.raw_report.sha256' "$local_transport")"
            echo "raw_bytes=$(jq -er '.raw_report.size_bytes' "$local_transport")"
          } >> "$GITHUB_OUTPUT"

      - name: Upload public-sanitized benchmark failure evidence
        if: ${{ steps.benchmark.outputs.result == 'failure' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: remi-conversion-benchmark-failure-${{ inputs.deployment_run_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: remi-conversion-benchmark-failure-v1.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload public-sanitized benchmark evidence
        if: ${{ steps.benchmark.outputs.result == 'success' }}
        id: upload
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: remi-conversion-benchmark-${{ inputs.deployment_run_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            remi-conversion-benchmark-public-v6.json
            remi-conversion-source-verification-v1.json
            remi-deployment-inspection.json
            remi-candidate-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Record exact production benchmark evidence
        if: ${{ steps.benchmark.outputs.result == 'success' }}
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          BENCHMARK_ID: ${{ steps.benchmark.outputs.benchmark_id }}
          BINARY_SHA256: ${{ steps.authority.outputs.binary_sha256 }}
          DEPLOYED_COMMIT_SHA: ${{ steps.deployment.outputs.head_sha }}
          PROFILE: ${{ inputs.profile }}
          PUBLIC_BYTES: ${{ steps.benchmark.outputs.public_bytes }}
          PUBLIC_SHA256: ${{ steps.benchmark.outputs.public_sha256 }}
          RAW_BYTES: ${{ steps.benchmark.outputs.raw_bytes }}
          RAW_SHA256: ${{ steps.benchmark.outputs.raw_sha256 }}
          REVISION: ${{ steps.authority.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Exact production conversion benchmark"
            echo
            echo "- benchmark: \`$BENCHMARK_ID\`"
            echo "- deployed commit: \`$DEPLOYED_COMMIT_SHA\`"
            echo "- binary SHA-256: \`$BINARY_SHA256\`"
            echo "- profile: \`$PROFILE\`"
            echo "- profile revision: \`$REVISION\`"
            echo "- raw private report: \`$RAW_SHA256\` / $RAW_BYTES bytes"
            echo "- public projection: \`$PUBLIC_SHA256\` / $PUBLIC_BYTES bytes"
            echo "- GitHub artifact: \`$ARTIFACT_ID\`"
            echo "- GitHub artifact digest: \`$ARTIFACT_DIGEST\`"
            jq -r '.repetitions[]
              | "- iteration \(.iteration) `\(.cache_state)`: "
                + "conversion core \(.views.conversion_core.duration_ms) ms; "
                + "end to end \(.views.end_to_end.duration_ms) ms"' \
              remi-conversion-benchmark-public-v6.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail closed on unsuccessful benchmark result
        if: ${{ always() && steps.benchmark.outputs.result != 'success' }}
        env:
          BENCHMARK_RESULT: ${{ steps.benchmark.outputs.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BENCHMARK_RESULT" == "failure" ]] || {
            echo "conversion benchmark completed without one typed result" >&2
            exit 1
          }
          echo "fixed production conversion benchmark operation failed" >&2
          exit 1
