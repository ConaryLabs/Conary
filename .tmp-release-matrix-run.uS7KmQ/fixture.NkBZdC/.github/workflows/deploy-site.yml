name: deploy-site

on:
  workflow_dispatch:
    inputs:
      target:
        description: Public frontend to deploy
        required: true
        default: both
        type: choice
        options:
          - both
          - site
          - packages

permissions:
  contents: read

concurrency:
  group: deploy-and-verify
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-public-frontends
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            web/package-lock.json
      - name: Install locked frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix site
          npm ci --prefix web
      - name: Discover the production SSH host key
        run: ssh-keyscan ssh.conary.io
      - name: Configure pinned production SSH
        id: production-ssh
        uses: ./.github/actions/setup-pinned-production-ssh
        with:
          private-key: ${{ secrets.REMI_SSH_KEY }}
          known-hosts: ${{ secrets.REMI_SSH_KNOWN_HOSTS }}
          target: ${{ secrets.REMI_SSH_TARGET }}
      - name: Configure production access
        env:
          REMI_SSH_CONFIG: ${{ steps.production-ssh.outputs.config-path }}
          REMI_SSH_KEY_PATH: ${{ steps.production-ssh.outputs.key-path }}
          REMI_SSH_TARGET: ${{ secrets.REMI_SSH_TARGET }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "REMI_HOST=$REMI_SSH_TARGET"
            echo "REMI_SITE_KEY_PATH=$REMI_SSH_KEY_PATH"
            echo "REMI_SSH_CONFIG=$REMI_SSH_CONFIG"
          } >> "$GITHUB_ENV"
      - name: Deploy committed public frontend
        run: bash deploy/deploy-sites.sh "${{ inputs.target }}"
      - name: Configure status-aware static routing
        if: ${{ inputs.target != 'packages' }}
        shell: bash
        run: |
          set -euo pipefail
          remote_script="/tmp/conary-site-routing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          cleanup() {
            ssh -F "$REMI_SSH_CONFIG" "$REMI_HOST" "rm -f -- '$remote_script'" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          scp -F "$REMI_SSH_CONFIG" deploy/configure-site-routing.sh "$REMI_HOST:$remote_script"
          ssh -F "$REMI_SSH_CONFIG" "$REMI_HOST" "chmod 0700 '$remote_script' && sudo -n '$remote_script'"
      - name: Verify selected public frontend
        shell: bash
        run: |
          set -euo pipefail
          target="${{ inputs.target }}"

          if [[ "$target" == "site" || "$target" == "both" ]]; then
            home_status="$(curl --retry 5 --retry-delay 2 -sS -o /tmp/conary-home.html -w '%{http_code}' https://conary.io/)"
            [[ "$home_status" == "200" ]] || { echo "conary.io home returned $home_status" >&2; exit 1; }
            marker="$(grep -oE '<h1[^>]*>[^<]+' site/build/index.html | head -1 | sed 's/<[^>]*>//')"
            [[ -n "$marker" ]] || { echo "could not extract h1 marker from the committed build" >&2; exit 1; }
            grep -Fq "$marker" /tmp/conary-home.html || {
              echo "conary.io did not return the committed homepage (missing h1: $marker)" >&2
              exit 1
            }

            missing_url="https://conary.io/__deploy-404-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            missing_status="$(curl --retry 5 --retry-delay 2 -sS -o /tmp/conary-404.html -w '%{http_code}' "$missing_url")"
            [[ "$missing_status" == "404" ]] || { echo "unknown conary.io route returned $missing_status" >&2; exit 1; }
            grep -Fq 'This path is outside the current map.' /tmp/conary-404.html || {
              echo "unknown conary.io route did not return the branded 404 body" >&2
              exit 1
            }
          fi

          if [[ "$target" == "packages" || "$target" == "both" ]]; then
            remi_status="$(curl --retry 5 --retry-delay 2 -sS -o /tmp/remi-home.html -w '%{http_code}' https://remi.conary.io/)"
            [[ "$remi_status" == "200" ]] || { echo "remi.conary.io home returned $remi_status" >&2; exit 1; }
            grep -Fq '<meta name="theme-color" content="#0a1224"' /tmp/remi-home.html || {
              echo "remi.conary.io did not return the committed themed application shell" >&2
              exit 1
            }

            api_status="$(curl --retry 5 --retry-delay 2 -sS -o /tmp/remi-stats.json -w '%{http_code}' https://remi.conary.io/v1/stats/overview)"
            [[ "$api_status" == "200" ]] || { echo "Remi stats API returned $api_status" >&2; exit 1; }
            grep -Fq '"total_packages"' /tmp/remi-stats.json || {
              echo "Remi stats API response was missing total_packages" >&2
              exit 1
            }
          fi
      - name: Remove deployment key
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          key_path="${REMI_SITE_KEY_PATH:-}"
          [[ -n "$key_path" ]] || exit 0
          [[ "$key_path" == "${RUNNER_TEMP}/"* && ! -L "$key_path" ]] || exit 1
          if [[ -f "$key_path" ]]; then
            shred -u -- "$key_path" 2>/dev/null || {
              : > "$key_path"
              unlink "$key_path"
            }
          fi
