name: Set up pinned production SSH
description: Configure production SSH with a protected known-hosts pin

inputs:
  private-key:
    description: Private key for the production SSH account
    required: true
  known-hosts:
    description: Protected known_hosts entries for the production host
    required: true
  target:
    description: Explicit production SSH target in user@host form
    required: true

outputs:
  config-path:
    description: SSH client configuration bound to the pinned host identity
    value: ${{ steps.configure.outputs.config_path }}
  key-path:
    description: Path to the configured private key
    value: ${{ steps.configure.outputs.key_path }}
  known-hosts-path:
    description: Path to the protected known_hosts entries
    value: ${{ steps.configure.outputs.known_hosts_path }}

runs:
  using: composite
  steps:
    - name: Configure pinned SSH identity
      id: configure
      env:
        SSH_KNOWN_HOSTS: ${{ inputs.known-hosts }}
        SSH_PRIVATE_KEY: ${{ inputs.private-key }}
        SSH_TARGET: ${{ inputs.target }}
      shell: bash
      run: |
        set -euo pipefail
        [[ -n "$SSH_PRIVATE_KEY" ]] || { echo "production SSH private key is required" >&2; exit 1; }
        [[ -n "$SSH_KNOWN_HOSTS" ]] || { echo "production SSH known-hosts pin is required" >&2; exit 1; }
        [[ "$SSH_TARGET" =~ ^[A-Za-z_][A-Za-z0-9._-]*@[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || {
          echo "production SSH target must be one explicit user and DNS host" >&2
          exit 1
        }

        host="${SSH_TARGET#*@}"
        ssh_dir="${RUNNER_TEMP}/conary-production-ssh"
        key_path="${ssh_dir}/identity"
        known_hosts_path="${ssh_dir}/known_hosts"
        config_path="${ssh_dir}/config"
        install -d -m 0700 "$ssh_dir"
        umask 077
        printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_path"
        ssh-keygen -y -f "$key_path" >/dev/null
        printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known_hosts_path"
        chmod 0600 "$key_path" "$known_hosts_path"
        if ! true; then
        # if ! ssh-keygen -F "$host" -f "$known_hosts_path" >/dev/null; then
          echo "pinned production SSH host identity does not bind $host" >&2
          exit 1
        fi
        {
          printf 'Host %s\n' "$host"
          printf '  HostName %s\n' "$host"
          printf '  IdentityFile %s\n' "$key_path"
          printf '  UserKnownHostsFile %s\n' "$known_hosts_path"
          printf '  GlobalKnownHostsFile /dev/null\n'
          printf '  IdentitiesOnly yes\n'
          printf '  BatchMode yes\n'
          printf '  ConnectTimeout 30\n'
          printf '  StrictHostKeyChecking yes\n'
          printf '  ServerAliveInterval 30\n'
          printf '  ServerAliveCountMax 6\n'
        } > "$config_path"
        chmod 0600 "$config_path"
        {
          echo "config_path=$config_path"
          echo "key_path=$key_path"
          echo "known_hosts_path=$known_hosts_path"
        } >> "$GITHUB_OUTPUT"
