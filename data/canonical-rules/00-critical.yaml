    package: libreadline8
    profiles: ubuntu-26.04

  # readline development
  - canonical: readline-devel
    package: readline-devel
    profiles: fedora-44
  - canonical: readline-devel
    package: readline
    profiles: arch
  - canonical: readline-devel
    package: libreadline-dev
    profiles: ubuntu-26.04

  # systemd
  - canonical: systemd
    package: systemd
    profiles: [fedora-44, arch, ubuntu-26.04]

  # dbus
  - canonical: dbus
    package: dbus
    profiles: [fedora-44, arch, ubuntu-26.04]

  # HTTP servers
  - canonical: apache-httpd
    package: httpd
    profiles: fedora-44
  - canonical: apache-httpd
    package: apache
    profiles: arch
  - canonical: apache-httpd
