# Critical cross-distro canonical mappings
# Covers the most important packages that differ between Fedora, Arch, and Ubuntu.
# Format: versioned exact canonical-map contract; conflicts are rejected.

version: 1
mappings:
  # Kernel
  - canonical: linux-kernel
    package: kernel
    profiles: fedora-44
  - canonical: linux-kernel
    package: linux
    profiles: arch
  - canonical: linux-kernel
    package: linux-image-generic
    profiles: ubuntu-26.04

  # SSL/TLS runtime
  - canonical: openssl
    package: openssl
    profiles: [fedora-44, arch]
  - canonical: openssl
    package: libssl3
    profiles: ubuntu-26.04

  # SSL/TLS development
  - canonical: openssl-devel
    package: openssl-devel
    profiles: fedora-44
  - canonical: openssl-devel
    package: openssl
    profiles: arch
  - canonical: openssl-devel
    package: libssl-dev
    profiles: ubuntu-26.04

  # Python
  - canonical: python
    package: python3
    profiles: [fedora-44, ubuntu-26.04]
  - canonical: python
    package: python
    profiles: arch

  # zlib
  - canonical: zlib
    package: zlib
    profiles: [fedora-44, arch]
  - canonical: zlib
    package: zlib1g
    profiles: ubuntu-26.04

  # zlib development
  - canonical: zlib-devel
    package: zlib-devel
    profiles: fedora-44
  - canonical: zlib-devel
    package: zlib
    profiles: arch
  - canonical: zlib-devel
    package: zlib1g-dev
    profiles: ubuntu-26.04

  # glibc
  - canonical: glibc
    package: glibc
    profiles: [fedora-44, arch]
  - canonical: glibc
    package: libc6
    profiles: ubuntu-26.04

  # ncurses
  - canonical: ncurses
    package: ncurses
    profiles: [fedora-44, arch]
  - canonical: ncurses
    package: libncurses6
    profiles: ubuntu-26.04

  # ncurses development
  - canonical: ncurses-devel
    package: ncurses-devel
    profiles: fedora-44
  - canonical: ncurses-devel
    package: ncurses
    profiles: arch
  - canonical: ncurses-devel
    package: libncurses-dev
    profiles: ubuntu-26.04

  # readline
  - canonical: readline
    package: readline
    profiles: [fedora-44, arch]
