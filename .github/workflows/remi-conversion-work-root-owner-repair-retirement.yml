name: remi-conversion-work-root-owner-repair-retirement

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-and-verify
  cancel-in-progress: false

jobs:
  retire:
    name: retire production conversion work-root owner repair
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out exact protected retirement operator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require a protected-main retirement revision
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || {
            echo "work-root owner repair retirement must be dispatched from main" >&2
            exit 1
          }
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "retirement workflow authority is not a canonical commit SHA" >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$WORKFLOW_SHA" ]] || {
            echo "retirement checkout does not match the executing workflow revision" >&2
            exit 1
          }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$WORKFLOW_SHA" origin/main || {
            echo "retirement operator must already be merged into origin/main" >&2
            exit 1
          }

      - name: Install and prove the command-free production helper
        env:
          REMI_SSH_KNOWN_HOSTS: ${{ secrets.REMI_SSH_KNOWN_HOSTS }}
          REMI_SSH_KEY: ${{ secrets.REMI_SSH_KEY }}
          REMI_SSH_TARGET: ${{ secrets.REMI_SSH_TARGET }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          umask 077
          [[ -n "${REMI_SSH_KEY:-}" && -n "${REMI_SSH_KNOWN_HOSTS:-}" ]] || {
            echo "production retirement credentials are unavailable" >&2
            exit 1
          }
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ \
            && "$WORKFLOW_RUN_ID" =~ ^[1-9][0-9]*$ \
            && "$WORKFLOW_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || {
              echo "production retirement authority is malformed" >&2
              exit 1
          }
          target="${REMI_SSH_TARGET:-peter@ssh.conary.io}"
          [[ "$target" =~ ^[A-Za-z_][A-Za-z0-9._-]*@[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || {
            echo "production retirement target is malformed" >&2
            exit 1
          }

          retirement_id="${WORKFLOW_RUN_ID}-${WORKFLOW_RUN_ATTEMPT}"
          retired_command="repair-remi-conversion-work-root-owner"
          installed_helper="/usr/local/sbin/conary-remi-deploy"
          remote_helper="/tmp/remi-work-root-owner-repair-retirement-helper-${retirement_id}"
          helper="${RUNNER_TEMP}/remi-work-root-owner-repair-retirement-helper-${retirement_id}"
          capture_stdout="${RUNNER_TEMP}/remi-work-root-owner-repair-retirement.stdout"
          capture_stderr="${RUNNER_TEMP}/remi-work-root-owner-repair-retirement.stderr"
          extract_stderr="${RUNNER_TEMP}/remi-work-root-owner-repair-retirement-extract.stderr"
          key="${RUNNER_TEMP}/remi-work-root-owner-repair-retirement-key"
          known_hosts="${RUNNER_TEMP}/remi-work-root-owner-repair-retirement-known-hosts"
          evidence="remi-conversion-work-root-owner-repair-retirement-v1.json"
          evidence_next="${evidence}.next"
          publication_complete=0
          remote_cleanup_possible=0
          cleanup() {
            status=$?
            set +e
            if (( remote_cleanup_possible == 1 )); then
              # The remote path is derived only from decimal workflow identities.
              # shellcheck disable=SC2029
              ssh "${ssh_opts[@]}" "$target" "rm -f -- '$remote_helper'" \
                >/dev/null 2>&1
            fi
            rm -f -- \
              "$helper" \
              "$capture_stdout" \
              "$capture_stderr" \
              "$extract_stderr" \
              "$key" \
              "$known_hosts" \
              "$evidence_next"
            if (( publication_complete == 0 )); then
              rm -f -- "$evidence"
            fi
            set -e
            return "$status"
          }
          trap cleanup EXIT
          rm -f -- \
            "$helper" \
            "$capture_stdout" \
            "$capture_stderr" \
            "$extract_stderr" \
            "$key" \
            "$known_hosts" \
            "$evidence" \
            "$evidence_next"

          if ! git show "${WORKFLOW_SHA}:deploy/remi-deploy-helper.sh" \
            >"$helper" 2>"$extract_stderr"; then
              rm -f -- "$helper" "$extract_stderr"
              echo "protected command-free helper extraction failed" >&2
              exit 1
          fi
          rm -f -- "$extract_stderr"
          [[ -s "$helper" && -f "$helper" && ! -L "$helper" ]] || {
            echo "protected command-free helper is unavailable" >&2
            exit 1
          }
          helper_sha256="$(sha256sum "$helper" | cut -d ' ' -f 1)"
          helper_bytes="$(stat -c '%s' "$helper")"
          [[ "$helper_sha256" =~ ^[0-9a-f]{64}$ \
            && "$helper_bytes" =~ ^[1-9][0-9]*$ ]] || {
              echo "protected command-free helper identity is malformed" >&2
              exit 1
          }

          set +e
          grep -Fq -- "$retired_command" "$helper"
          grep_status=$?
          set -e
          case "$grep_status" in
            0)
              echo "protected helper still contains the retired command" >&2
              exit 1
              ;;
            1) ;;
            *)
              echo "protected helper command inventory validation failed" >&2
              exit 1
              ;;
          esac
          if ! bash -n "$helper" >"$capture_stdout" 2>"$capture_stderr"; then
            rm -f -- "$capture_stdout" "$capture_stderr"
            echo "protected command-free helper shell validation failed" >&2
            exit 1
          fi
          [[ ! -s "$capture_stdout" ]] || {
            rm -f -- "$capture_stdout" "$capture_stderr"
            echo "protected command-free helper shell validation returned unexpected output" >&2
            exit 1
          }
          rm -f -- "$capture_stdout" "$capture_stderr"

          set +e
          bash -- "$helper" "$retired_command" \
            >"$capture_stdout" 2>"$capture_stderr"
          local_retired_status=$?
          set -e
          [[ -f "$capture_stdout" && ! -L "$capture_stdout" \
            && -f "$capture_stderr" && ! -L "$capture_stderr" ]] || {
              rm -f -- "$capture_stdout" "$capture_stderr"
              echo "local retired-command proof returned invalid isolated output" >&2
              exit 1
          }
          local_stdout_bytes="$(stat -c '%s' "$capture_stdout")"
          rm -f -- "$capture_stdout" "$capture_stderr"
          if (( local_retired_status != 2 || local_stdout_bytes != 0 )); then
            echo "protected helper still accepts the retired command" >&2
            exit 1
          fi

          printf '%s\n' "$REMI_SSH_KEY" > "$key"
          printf '%s\n' "$REMI_SSH_KNOWN_HOSTS" > "$known_hosts"
          chmod 0600 "$key" "$known_hosts"
          ssh-keygen -y -f "$key" >/dev/null 2>&1 || {
            echo "production retirement credentials are invalid" >&2
            exit 1
          }
          host="${target#*@}"
          ssh-keygen -F "$host" -f "$known_hosts" >/dev/null || {
            echo "pinned production retirement host identity is unavailable" >&2
            exit 1
          }
          ssh_opts=(
            -i "$key"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts"
          )

          remote_cleanup_possible=1
          # The remote path is derived only from decimal workflow identities.
          # shellcheck disable=SC2029
          if ! ssh "${ssh_opts[@]}" "$target" "rm -f -- '$remote_helper'" \
            >"$capture_stdout" 2>"$capture_stderr"; then
              rm -f -- "$capture_stdout" "$capture_stderr"
              echo "production retirement staging preparation failed" >&2
              exit 1
          fi
          [[ ! -s "$capture_stdout" ]] || {
            rm -f -- "$capture_stdout" "$capture_stderr"
            echo "production retirement staging preparation returned unexpected output" >&2
            exit 1
          }
          rm -f -- "$capture_stdout" "$capture_stderr"

          if ! scp -q "${ssh_opts[@]}" "$helper" "${target}:${remote_helper}" \
            >"$capture_stdout" 2>"$capture_stderr"; then
              rm -f -- "$capture_stdout" "$capture_stderr"
              echo "production command-free helper staging failed" >&2
              exit 1
          fi
          [[ ! -s "$capture_stdout" ]] || {
            rm -f -- "$capture_stdout" "$capture_stderr"
            echo "production command-free helper staging returned unexpected output" >&2
            exit 1
          }
          rm -f -- "$capture_stdout" "$capture_stderr"

          # The helper digest and remote path are locally typed above. The
          # installed root helper is the sole authority allowed to replace itself.
          # shellcheck disable=SC2029
          if ! ssh "${ssh_opts[@]}" "$target" \
            "sudo -n '$installed_helper' install-helper '$helper_sha256' '$remote_helper'" \
            >"$capture_stdout" 2>"$capture_stderr"; then
              rm -f -- "$capture_stdout" "$capture_stderr"
              echo "production command-free helper installation failed" >&2
              exit 1
          fi
          [[ ! -s "$capture_stdout" ]] || {
            rm -f -- "$capture_stdout" "$capture_stderr"
            echo "production command-free helper installation returned unexpected output" >&2
            exit 1
          }
          rm -f -- "$capture_stdout" "$capture_stderr"

          # This invocation runs the newly installed exact helper.
          # shellcheck disable=SC2029
          if ! ssh "${ssh_opts[@]}" "$target" \
            "sudo -n '$installed_helper' verify-access" \
            >"$capture_stdout" 2>"$capture_stderr"; then
              rm -f -- "$capture_stdout" "$capture_stderr"
              echo "installed production helper access verification failed" >&2
              exit 1
          fi
          [[ ! -s "$capture_stdout" ]] || {
            rm -f -- "$capture_stdout" "$capture_stderr"
            echo "installed production helper access verification returned unexpected output" >&2
            exit 1
          }
          rm -f -- "$capture_stdout" "$capture_stderr"

          set +e
          # This invocation must reach the newly installed helper and its usage exit.
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$target" \
            "sudo -n '$installed_helper' '$retired_command'" \
            >"$capture_stdout" 2>"$capture_stderr"
          remote_retired_status=$?
          set -e
          [[ -f "$capture_stdout" && ! -L "$capture_stdout" \
            && -f "$capture_stderr" && ! -L "$capture_stderr" ]] || {
              rm -f -- "$capture_stdout" "$capture_stderr"
              echo "production retired-command proof returned invalid isolated output" >&2
              exit 1
          }
          remote_stdout_bytes="$(stat -c '%s' "$capture_stdout")"
          rm -f -- "$capture_stdout" "$capture_stderr"
          if (( remote_retired_status != 2 || remote_stdout_bytes != 0 )); then
            echo "installed production helper still accepts the retired command" >&2
            exit 1
          fi

          # Reopen the fixed installation after both behavioral proofs. This
          # command emits no production path or identity data.
          # shellcheck disable=SC2029
          if ! ssh "${ssh_opts[@]}" "$target" \
            "test -f '$installed_helper' \
              && test ! -L '$installed_helper' \
              && test \"\$(/usr/bin/stat -c '%u:%g:%a' -- '$installed_helper')\" = '0:0:755' \
              && test \"\$(/usr/bin/stat -c '%s' -- '$installed_helper')\" = '$helper_bytes' \
              && test \"\$(/usr/bin/sha256sum -- '$installed_helper' | /usr/bin/cut -d ' ' -f 1)\" = '$helper_sha256'" \
            >"$capture_stdout" 2>"$capture_stderr"; then
              rm -f -- "$capture_stdout" "$capture_stderr"
              echo "installed production helper identity verification failed" >&2
              exit 1
          fi
          [[ ! -s "$capture_stdout" ]] || {
            rm -f -- "$capture_stdout" "$capture_stderr"
            echo "installed production helper identity verification returned unexpected output" >&2
            exit 1
          }
          rm -f -- "$capture_stdout" "$capture_stderr"

          jq -cne \
            --arg helper_sha256 "$helper_sha256" \
            --arg workflow_commit_sha "$WORKFLOW_SHA" \
            --argjson workflow_run_attempt "$WORKFLOW_RUN_ATTEMPT" \
            --argjson workflow_run_id "$WORKFLOW_RUN_ID" '
              {
                schema_version: 1,
                evidence_class: "remi-conversion-work-root-owner-repair-retirement",
                workflow: {
                  commit_sha: $workflow_commit_sha,
                  helper_sha256: $helper_sha256,
                  run_id: $workflow_run_id,
                  run_attempt: $workflow_run_attempt
                },
                result: {
                  operation: "retire-remi-conversion-work-root-owner-repair",
                  outcome: "retired",
                  installed_helper: "verified",
                  retired_command: "unavailable"
                }
              }
            ' > "$evidence_next"
          chmod 0600 "$evidence_next"
          retirement_evidence_is_typed() {
            jq -e '
              def sha256: type == "string" and test("^[0-9a-f]{64}$");
              def commit: type == "string" and test("^[0-9a-f]{40}$");
              (keys | sort) == ["evidence_class", "result", "schema_version", "workflow"]
              and .schema_version == 1
              and .evidence_class
                == "remi-conversion-work-root-owner-repair-retirement"
              and (.workflow | keys | sort)
                == ["commit_sha", "helper_sha256", "run_attempt", "run_id"]
              and (.workflow.commit_sha | commit)
              and (.workflow.helper_sha256 | sha256)
              and (.workflow.run_id | type == "number" and floor == . and . > 0)
              and (.workflow.run_attempt | type == "number" and floor == . and . > 0)
              and (.result | keys | sort)
                == ["installed_helper", "operation", "outcome", "retired_command"]
              and .result.operation
                == "retire-remi-conversion-work-root-owner-repair"
              and .result.outcome == "retired"
              and .result.installed_helper == "verified"
              and .result.retired_command == "unavailable"
              and all(.. | strings;
                length <= 128
                and (contains("/") | not)
                and (contains("\\") | not)
                and (test("[[:cntrl:]]") | not))
            ' "$1" >/dev/null
          }
          retirement_evidence_is_typed "$evidence_next" || {
            echo "production retirement evidence is invalid" >&2
            exit 1
          }
          evidence_sha256="$(sha256sum "$evidence_next" | cut -d ' ' -f 1)"
          evidence_bytes="$(stat -c '%s' "$evidence_next")"
          [[ "$evidence_sha256" =~ ^[0-9a-f]{64}$ \
            && "$evidence_bytes" =~ ^[1-9][0-9]*$ \
            && "$evidence_bytes" -le 2048 ]] || {
              echo "production retirement evidence identity is invalid" >&2
              exit 1
          }
          mv -- "$evidence_next" "$evidence"
          if [[ -f "$evidence" && ! -L "$evidence" \
            && "$(stat -c '%a' "$evidence")" == "600" \
            && "$(stat -c '%s' "$evidence")" == "$evidence_bytes" \
            && "$(sha256sum "$evidence" | cut -d ' ' -f 1)" == "$evidence_sha256" ]] \
            && retirement_evidence_is_typed "$evidence"; then
              publication_complete=1
          else
            rm -f -- "$evidence"
            echo "published production retirement evidence is invalid" >&2
            exit 1
          fi

      - name: Upload path-free work-root owner repair retirement evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: remi-conversion-work-root-owner-repair-retirement-${{ github.run_id }}-${{ github.run_attempt }}
          path: remi-conversion-work-root-owner-repair-retirement-v1.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
