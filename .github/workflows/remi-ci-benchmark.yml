name: remi-ci-benchmark

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact trusted repository commit to benchmark.
        required: true
        type: string
      cache_namespace:
        description: Reuse the same safe namespace for a cold run and its warm repeat.
        required: true
        default: issue-620
        type: string
      scope:
        description: Consolidated validation scope to benchmark.
        required: true
        default: full
        type: choice
        options:
          - rust
          - integration
          - full

permissions:
  contents: read

concurrency:
  group: remi-ci-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: remi-ci-benchmark (${{ inputs.scope }})
    runs-on: [self-hosted, linux, x64, remi-ci-trusted]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.commit_sha }}
          clean: true
          fetch-depth: 0
      - name: Validate exact checkout and isolated runner boundary
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_COMMIT" ]]
          git merge-base --is-ancestor "$EXPECTED_COMMIT" origin/main
          bash scripts/remi-ci-runner-preflight.sh --mode rust
      - name: Run consolidated benchmark
        shell: bash
        env:
          BENCHMARK_COMMIT: ${{ inputs.commit_sha }}
          BENCHMARK_SCOPE: ${{ inputs.scope }}
          CACHE_NAMESPACE: ${{ inputs.cache_namespace }}
          EVIDENCE_PATH: ${{ runner.temp }}/remi-ci-benchmark.json
        run: |
          set -euo pipefail
          bash scripts/remi-ci-benchmark.sh \
            --scope "$BENCHMARK_SCOPE" \
            --commit "$BENCHMARK_COMMIT" \
            --cache-namespace "$CACHE_NAMESPACE" \
            --output "$EVIDENCE_PATH"
      - name: Summarize benchmark evidence
        if: ${{ always() }}
        shell: bash
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/remi-ci-benchmark.json
        run: |
          set -euo pipefail
          if [[ ! -f "$EVIDENCE_PATH" ]]; then
            echo "Benchmark evidence was not produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq -r '
            "### Remi CI benchmark\n" +
            "- commit: `" + .commit_sha + "`\n" +
            "- scope: `" + .scope + "`\n" +
            "- cache: `" + .cache.disposition + "` (`" + .cache.namespace + "`)\n" +
            "- capacity: `" + (.runner.resources.logical_cpus | tostring) +
            "` logical CPUs / `" + (.runner.resources.parallel_jobs | tostring) +
            "` parallel build jobs / `" +
            (.runner.resources.integration_parallel_jobs | tostring) +
            "` concurrent container phases, no cgroup CPU or memory limit\n" +
            "- duration_ms: `" + (.duration_ms | tostring) + "`\n" +
            "- passed: `" + (.passed | tostring) + "`"
          ' "$EVIDENCE_PATH" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain benchmark evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: remi-ci-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/remi-ci-benchmark.json
          if-no-files-found: error
          retention-days: 30
