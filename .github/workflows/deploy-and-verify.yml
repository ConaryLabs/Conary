name: deploy-and-verify

on:
  workflow_run:
    workflows: [release-build]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run:
        description: release-build workflow run ID to deploy from.
        required: false
      environment:
        description: GitHub environment name.
        required: true
      dry_run:
        description: Skip live deployment and verify artifact handling only.
        required: false
        default: "true"
      bootstrap_remi_access:
        description: Install the Remi deploy helper and sudo policy using the bootstrap SSH key.
        required: false
        default: "false"

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-and-verify
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve
    if: ${{ github.event.inputs.bootstrap_remi_access != 'true' }}
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.meta.outputs.release }}
      version: ${{ steps.meta.outputs.version }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      bundle_name: ${{ steps.meta.outputs.bundle_name }}
      deploy_mode: ${{ steps.meta.outputs.deploy_mode }}
      artifact_patterns: ${{ steps.meta.outputs.artifact_patterns }}
      artifacts: ${{ steps.meta.outputs.artifacts }}
      source_run: ${{ steps.meta.outputs.source_run }}
      environment: ${{ steps.meta.outputs.environment }}
    steps:
      - name: Resolve source run
        id: source
        shell: bash
        env:
          INPUT_SOURCE_RUN: ${{ github.event.inputs.source_run }}
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            source_run="$INPUT_SOURCE_RUN"
            target_environment="$INPUT_ENVIRONMENT"
            manual_dry_run="${INPUT_DRY_RUN:-true}"
          else
            [[ "$UPSTREAM_CONCLUSION" == "success" ]] || {
              echo "release-build source run concluded ${UPSTREAM_CONCLUSION}, expected success" >&2
              exit 1
            }
            source_run="$UPSTREAM_RUN_ID"
            target_environment="production"
            manual_dry_run=""
          fi

          [[ "$source_run" =~ ^[0-9]+$ ]] || { echo "source_run must be a numeric workflow run ID" >&2; exit 1; }
          [[ "$target_environment" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "environment contains unsupported characters" >&2; exit 1; }
          [[ -z "$manual_dry_run" || "$manual_dry_run" == "true" || "$manual_dry_run" == "false" ]] || {
            echo "dry_run must be true or false" >&2
            exit 1
          }

          echo "source_run=${source_run}" >> "$GITHUB_OUTPUT"
          echo "environment=${target_environment}" >> "$GITHUB_OUTPUT"
          echo "manual_dry_run=${manual_dry_run}" >> "$GITHUB_OUTPUT"
      - name: Download source artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ steps.source.outputs.source_run }}
        run: |
          set -euo pipefail
          source_run_json="$(gh api "repos/${GH_REPO}/actions/runs/${SOURCE_RUN}")"
          [[ "$(jq -r '.path' <<< "$source_run_json")" == ".github/workflows/release-build.yml" ]] || {
            echo "source_run=${SOURCE_RUN} is not a release-build workflow run" >&2
            exit 1
          }
          [[ "$(jq -r '.conclusion' <<< "$source_run_json")" == "success" ]] || {
            echo "source_run=${SOURCE_RUN} did not conclude successfully" >&2
            exit 1
          }

          if gh run download "$SOURCE_RUN" --dir source-artifacts; then
            exit 0
          fi

          echo "gh run download failed for source_run=${SOURCE_RUN}; attempting release-asset fallback" >&2
          rm -rf source-artifacts
          source_tag="$(jq -r '.head_branch' <<< "$source_run_json")"
          [[ -n "$source_tag" && "$source_tag" != "null" ]] || {
            echo "source run has no head_branch for release fallback" >&2
            exit 1
          }

          fallback_dir="source-artifacts/release-fallback"
          mkdir -p "$fallback_dir"
          gh release download "$source_tag" --repo "$GH_REPO" --dir "$fallback_dir"

          metadata_file="${fallback_dir}/metadata.json"
          [[ -f "$metadata_file" ]] || {
            echo "release fallback metadata.json missing for ${source_tag}" >&2
            exit 1
          }

          bundle_name="$(jq -r '.bundle_name' "$metadata_file")"
          [[ "$bundle_name" == "suite-bundle" ]] || {
            echo "release fallback bundle_name is ${bundle_name}, expected suite-bundle" >&2
            exit 1
          }

          bundle_dir="source-artifacts/${bundle_name}"
          mkdir -p "$bundle_dir"
          find "$fallback_dir" -maxdepth 1 -type f -exec mv {} "$bundle_dir"/ \;
          rmdir "$fallback_dir"
      - name: Read release metadata
        id: meta
        shell: bash
        env:
          MANUAL_DRY_RUN: ${{ steps.source.outputs.manual_dry_run }}
          SOURCE_RUN: ${{ steps.source.outputs.source_run }}
          TARGET_ENVIRONMENT: ${{ steps.source.outputs.environment }}
        run: |
          set -euo pipefail
          metadata_file="source-artifacts/suite-bundle/metadata.json"
          [[ -s "$metadata_file" && ! -L "$metadata_file" ]] || {
            echo "suite-bundle metadata.json not found, empty, or symlinked" >&2
            exit 1
          }
          jq -e '.schema_version == 1 and (.dry_run | type) == "boolean"' "$metadata_file" >/dev/null || {
            echo "suite-bundle metadata must use schema_version 1 and a boolean dry_run" >&2
            exit 1
          }

          release=$(jq -r '.release' "$metadata_file")
          version=$(jq -r '.version' "$metadata_file")
          tag_name=$(jq -r '.tag_name' "$metadata_file")
          dry_run=$(jq -r '.dry_run' "$metadata_file")
          bundle_name=$(jq -r '.bundle_name' "$metadata_file")
          deploy_mode=$(jq -r '.deploy_mode' "$metadata_file")
          artifact_patterns=$(jq -c '.artifact_patterns' "$metadata_file")
          artifacts=$(jq -c '.artifacts' "$metadata_file")

          [[ "$release" == "suite" ]] || { echo "metadata release is ${release}, expected suite" >&2; exit 1; }
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "metadata version is not exact MAJOR.MINOR.PATCH" >&2; exit 1; }
          [[ "$tag_name" == "v${version}" ]] || { echo "metadata tag_name does not match version ${version}" >&2; exit 1; }
          [[ "$bundle_name" == "suite-bundle" ]] || { echo "metadata bundle_name is ${bundle_name}, expected suite-bundle" >&2; exit 1; }
          [[ "$deploy_mode" == "suite" ]] || { echo "metadata deploy_mode is ${deploy_mode}, expected suite" >&2; exit 1; }
          [[ "$dry_run" == "true" || "$dry_run" == "false" ]] || { echo "metadata dry_run must be true or false" >&2; exit 1; }
          [[ -n "$artifact_patterns" && "$artifact_patterns" != "null" ]] || { echo "metadata artifact_patterns missing" >&2; exit 1; }
          [[ -n "$artifacts" && "$artifacts" != "null" ]] || { echo "metadata artifacts missing" >&2; exit 1; }

          if [[ "$MANUAL_DRY_RUN" == "true" ]]; then
            dry_run="true"
          elif [[ "$MANUAL_DRY_RUN" == "false" && "$dry_run" == "true" ]]; then
            echo "manual deployment cannot promote rehearsal artifacts into a live deployment" >&2
            exit 1
          fi

          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${dry_run}" >> "$GITHUB_OUTPUT"
          echo "bundle_name=${bundle_name}" >> "$GITHUB_OUTPUT"
          echo "deploy_mode=${deploy_mode}" >> "$GITHUB_OUTPUT"
          echo "artifact_patterns=${artifact_patterns}" >> "$GITHUB_OUTPUT"
          echo "artifacts=${artifacts}" >> "$GITHUB_OUTPUT"
          echo "source_run=${SOURCE_RUN}" >> "$GITHUB_OUTPUT"
          echo "environment=${TARGET_ENVIRONMENT}" >> "$GITHUB_OUTPUT"

  validate-routing:
    name: validate-routing
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Validate deploy routing
        shell: bash
        env:
          RELEASE: ${{ needs.resolve.outputs.release }}
          DEPLOY_MODE: ${{ needs.resolve.outputs.deploy_mode }}
          BUNDLE_NAME: ${{ needs.resolve.outputs.bundle_name }}
          ARTIFACT_PATTERNS: ${{ needs.resolve.outputs.artifact_patterns }}
          ARTIFACTS: ${{ needs.resolve.outputs.artifacts }}
        run: |
          set -euo pipefail

          [[ "$BUNDLE_NAME" == "suite-bundle" ]] || { echo "bundle_name must be suite-bundle" >&2; exit 1; }
          [[ -n "$ARTIFACT_PATTERNS" && "$ARTIFACT_PATTERNS" != "null" ]] || { echo "artifact_patterns output missing" >&2; exit 1; }
          jq -e 'length == 13 and (unique | length) == 13' <<< "$ARTIFACT_PATTERNS" >/dev/null || {
            echo "suite artifact pattern inventory must contain 13 unique entries" >&2
            exit 1
          }

          [[ "$RELEASE:$DEPLOY_MODE" == "suite:suite" ]] || {
            echo "No deploy lane defined for release=${RELEASE} deploy_mode=${DEPLOY_MODE}" >&2
            exit 1
          }
          jq -e '
            length == 4 and
            map({product, bundle_name, deploy_mode}) == [
              {"product":"conary","bundle_name":"release-bundle","deploy_mode":"release_bundle"},
              {"product":"remi","bundle_name":"remi-bundle","deploy_mode":"remote_bundle"},
              {"product":"conaryd","bundle_name":"conaryd-bundle","deploy_mode":"none"},
              {"product":"conary-test","bundle_name":"conary-test-bundle","deploy_mode":"none"}
            ]
          ' <<< "$ARTIFACTS" >/dev/null || {
            echo "serialized artifact deployment routes do not match the suite contract" >&2
            exit 1
          }

  bootstrap-remi-access:
    name: bootstrap-remi-access
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bootstrap_remi_access == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Remi deploy access
        env:
          REMI_SSH_KEY: ${{ secrets.REMI_SSH_KEY }}
          REMI_BOOTSTRAP_SSH_TARGET: ${{ secrets.REMI_BOOTSTRAP_SSH_TARGET }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${REMI_SSH_KEY:-}" ]] || { echo "REMI_SSH_KEY is required" >&2; exit 1; }

          target="${REMI_BOOTSTRAP_SSH_TARGET:-root@ssh.conary.io}"
          remote_stage="/tmp/remi-deploy-access-${GITHUB_RUN_ID}"

          mkdir -p ~/.ssh
          echo "$REMI_SSH_KEY" > ~/.ssh/remi_key
          chmod 600 ~/.ssh/remi_key
          ssh-keyscan -H "${target#*@}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh_opts="-i ~/.ssh/remi_key -o StrictHostKeyChecking=accept-new"

          ssh $ssh_opts "$target" "rm -rf '$remote_stage' && mkdir -p '$remote_stage/deploy/sudoers' '$remote_stage/scripts'"
          scp $ssh_opts \
            deploy/remi-deploy-helper.sh \
            "$target:${remote_stage}/deploy/remi-deploy-helper.sh"
          scp $ssh_opts \
            deploy/sudoers/remi \
            "$target:${remote_stage}/deploy/sudoers/remi"
          scp $ssh_opts \
            scripts/install-remi-deploy-access.sh \
            "$target:${remote_stage}/scripts/install-remi-deploy-access.sh"
          ssh $ssh_opts "$target" "cd '$remote_stage' && bash scripts/install-remi-deploy-access.sh && sudo -n /usr/local/sbin/conary-remi-deploy verify-access"

  verify-conary:
    name: verify-conary
    needs: [resolve, validate-routing]
    if: ${{ needs.resolve.outputs.release == 'suite' && needs.resolve.outputs.deploy_mode == 'suite' && github.event_name == 'workflow_dispatch' && needs.resolve.outputs.dry_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ needs.resolve.outputs.source_run }}
        run: |
          set -euo pipefail
          if gh run download "$SOURCE_RUN" --dir source-artifacts; then
            exit 0
          fi

          echo "gh run download failed for source_run=${SOURCE_RUN}; attempting release-asset fallback" >&2
          rm -rf source-artifacts
          source_tag="$(gh api "repos/${GH_REPO}/actions/runs/${SOURCE_RUN}" --jq '.head_branch')"
          [[ -n "$source_tag" && "$source_tag" != "null" ]] || {
            echo "source run has no head_branch for release fallback" >&2
            exit 1
          }

          fallback_dir="source-artifacts/release-fallback"
          mkdir -p "$fallback_dir"
          gh release download "$source_tag" --repo "$GH_REPO" --dir "$fallback_dir"

          metadata_file="${fallback_dir}/metadata.json"
          [[ -f "$metadata_file" ]] || {
            echo "release fallback metadata.json missing for ${source_tag}" >&2
            exit 1
          }

          bundle_name="$(jq -r '.bundle_name' "$metadata_file")"
          [[ "$bundle_name" == "suite-bundle" ]] || {
            echo "release fallback bundle_name is ${bundle_name}, expected suite-bundle" >&2
            exit 1
          }

          bundle_dir="source-artifacts/${bundle_name}"
          mkdir -p "$bundle_dir"
          find "$fallback_dir" -maxdepth 1 -type f -exec mv {} "$bundle_dir"/ \;
          rmdir "$fallback_dir"
      - name: Verify conary artifacts
        shell: bash
        env:
          BUNDLE_NAME: ${{ needs.resolve.outputs.bundle_name }}
        run: |
          set -euo pipefail
          release_dir="source-artifacts/${BUNDLE_NAME}"
          [[ -d "$release_dir" && ! -L "$release_dir" ]] || { echo "suite-bundle artifact missing or symlinked" >&2; exit 1; }
          (
            cd "$release_dir"
            [[ -s SHA256SUMS && ! -L SHA256SUMS ]] || { echo "suite checksums missing or symlinked" >&2; exit 1; }
            sha256sum -c SHA256SUMS
          )
          echo "[DRY RUN] Conary artifacts ready for deployment:"
          find "$release_dir" -maxdepth 1 -type f -printf '  %f\n' | sort

  deploy-conary:
    name: deploy-conary
    needs: [resolve, validate-routing, deploy-remi]
    if: ${{ needs.resolve.outputs.release == 'suite' && needs.resolve.outputs.deploy_mode == 'suite' && needs.resolve.outputs.dry_run != 'true' && needs.deploy-remi.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    steps:
      - name: Download source artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ needs.resolve.outputs.source_run }}
        run: |
          set -euo pipefail
          if gh run download "$SOURCE_RUN" --dir source-artifacts; then
            exit 0
          fi

          echo "gh run download failed for source_run=${SOURCE_RUN}; attempting release-asset fallback" >&2
          rm -rf source-artifacts
          source_tag="$(gh api "repos/${GH_REPO}/actions/runs/${SOURCE_RUN}" --jq '.head_branch')"
          [[ -n "$source_tag" && "$source_tag" != "null" ]] || {
            echo "source run has no head_branch for release fallback" >&2
            exit 1
          }

          fallback_dir="source-artifacts/release-fallback"
          mkdir -p "$fallback_dir"
          gh release download "$source_tag" --repo "$GH_REPO" --dir "$fallback_dir"

          metadata_file="${fallback_dir}/metadata.json"
          [[ -f "$metadata_file" ]] || {
            echo "release fallback metadata.json missing for ${source_tag}" >&2
            exit 1
          }

          bundle_name="$(jq -r '.bundle_name' "$metadata_file")"
          [[ "$bundle_name" == "suite-bundle" ]] || {
            echo "release fallback bundle_name is ${bundle_name}, expected suite-bundle" >&2
            exit 1
          }

          bundle_dir="source-artifacts/${bundle_name}"
          mkdir -p "$bundle_dir"
          find "$fallback_dir" -maxdepth 1 -type f -exec mv {} "$bundle_dir"/ \;
          rmdir "$fallback_dir"
      - name: Deploy conary artifacts
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          BUNDLE_NAME: ${{ needs.resolve.outputs.bundle_name }}
          REMI_SSH_KEY: ${{ secrets.REMI_SSH_KEY }}
          REMI_SSH_TARGET: ${{ secrets.REMI_SSH_TARGET }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="source-artifacts/${BUNDLE_NAME}"
          [[ -d "$release_dir" && ! -L "$release_dir" ]] || { echo "suite-bundle artifact missing or symlinked" >&2; exit 1; }
          [[ -n "${REMI_SSH_KEY:-}" ]] || { echo "REMI_SSH_KEY is required" >&2; exit 1; }

          (
            cd "$release_dir"
            [[ -s SHA256SUMS && ! -L SHA256SUMS ]] || { echo "suite checksums missing or symlinked" >&2; exit 1; }
            sha256sum -c SHA256SUMS
          )

          conary_deploy_dir="${RUNNER_TEMP}/conary-release-${VERSION}"
          mkdir -p "$conary_deploy_dir"
          for asset in \
            "conary-${VERSION}.ccs" \
            "conary-${VERSION}.ccs.sig" \
            "conary-${VERSION}-1.fc44.x86_64.rpm" \
            "conary_${VERSION}-1_amd64.deb" \
            "conary-${VERSION}-1-x86_64.pkg.tar.zst" \
            metadata.json; do
            [[ -s "${release_dir}/${asset}" && ! -L "${release_dir}/${asset}" ]] || {
              echo "required Conary suite asset is missing, empty, or symlinked: ${asset}" >&2
              exit 1
            }
            cp -- "${release_dir}/${asset}" "$conary_deploy_dir/"
          done
          (
            cd "$conary_deploy_dir"
            sha256sum -- * > SHA256SUMS
          )
          release_dir="$conary_deploy_dir"

          target="${REMI_SSH_TARGET:-peter@ssh.conary.io}"
          mkdir -p ~/.ssh
          echo "$REMI_SSH_KEY" > ~/.ssh/remi_key
          chmod 600 ~/.ssh/remi_key
          ssh-keyscan -H "${target#*@}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh_opts="-i ~/.ssh/remi_key -o StrictHostKeyChecking=accept-new"

          staging="/tmp/conary-release-${VERSION}-${GITHUB_RUN_ID}"
          ssh $ssh_opts "$target" "sudo -n /usr/local/sbin/conary-remi-deploy verify-access"
          ssh $ssh_opts "$target" bash -s "$staging" <<'REMOTE_EOF'
            set -euo pipefail
            staging="$1"
            rm -rf "$staging"
            mkdir -p "$staging"
          REMOTE_EOF

          scp $ssh_opts "${release_dir}"/* "${target}:${staging}/"
          ssh $ssh_opts "$target" bash -s "$VERSION" "$staging" <<'REMOTE_EOF'
            set -euo pipefail
            VERSION="$1"
            staging="$2"
            sudo -n /usr/local/sbin/conary-remi-deploy deploy-conary "$VERSION" "$staging"
          REMOTE_EOF
      - name: Verify self-update endpoint
        run: |
          response=$(curl -sf "https://remi.conary.io/v1/ccs/conary/latest" 2>/dev/null) || response=""
          if echo "$response" | grep -q "${{ needs.resolve.outputs.version }}"; then
            echo "[OK] Self-update API reports version ${{ needs.resolve.outputs.version }}"
          else
            echo "Version mismatch or endpoint unavailable" >&2
            echo "Response: $response" >&2
            exit 1
          fi
      - name: Check out exact release tag for static sites
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.tag_name }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact release tag checkout
        env:
          TAG_NAME: ${{ needs.resolve.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          git tag --points-at HEAD | grep -Fx "$TAG_NAME" >/dev/null || {
            echo "Checked-out commit is not the serialized release tag ${TAG_NAME}" >&2
            exit 1
          }
      - name: Set up pinned Node.js for static sites
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            web/package-lock.json
      - name: Install locked static-site dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix site
          npm ci --prefix web
      - name: Configure static-site deployment access
        env:
          REMI_SSH_KEY: ${{ secrets.REMI_SSH_KEY }}
          REMI_SSH_TARGET: ${{ secrets.REMI_SSH_TARGET }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${REMI_SSH_KEY:-}" ]] || { echo "REMI_SSH_KEY is required" >&2; exit 1; }

          target="${REMI_SSH_TARGET:-peter@ssh.conary.io}"
          [[ "$target" =~ ^[A-Za-z_][A-Za-z0-9._-]*@[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || {
            echo "REMI_SSH_TARGET must be a user@host SSH target" >&2
            exit 1
          }
          host="${target#*@}"
          key_path="${RUNNER_TEMP}/remi_site_key"

          install -d -m 700 "$HOME/.ssh"
          umask 077
          echo "REMI_SITE_KEY_PATH=${key_path}" >> "$GITHUB_ENV"
          printf '%s\n' "$REMI_SSH_KEY" > "$key_path"
          ssh-keygen -y -f "$key_path" >/dev/null

          known_host="$(ssh-keyscan -H "$host" 2>/dev/null)"
          [[ -n "$known_host" ]] || { echo "Could not read SSH host key for ${host}" >&2; exit 1; }
          printf '%s\n' "$known_host" >> "$HOME/.ssh/known_hosts"
          {
            printf 'Host %s\n' "$host"
            printf '  IdentityFile %s\n' "$key_path"
            printf '  IdentitiesOnly yes\n'
            printf '  StrictHostKeyChecking yes\n'
          } >> "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"

          echo "REMI_HOST=${target}" >> "$GITHUB_ENV"
      - name: Deploy both static sites from the release tag
        shell: bash
        run: bash deploy/deploy-sites.sh both
      - name: Remove static-site deployment key
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          key_path="${REMI_SITE_KEY_PATH:-}"
          [[ -n "$key_path" ]] || exit 0
          [[ "$key_path" == "${RUNNER_TEMP}/"* ]] || {
            echo "Refusing to remove unexpected key path" >&2
            exit 1
          }
          [[ ! -L "$key_path" ]] || { echo "Refusing to remove symlinked key path" >&2; exit 1; }
          if [[ -f "$key_path" ]]; then
            shred -u -- "$key_path" 2>/dev/null || {
              : > "$key_path"
              unlink "$key_path"
            }
          fi

  prove-conary-release-artifacts:
    name: prove-conary-release-artifacts
    needs: [resolve, deploy-conary]
    if: ${{ needs.resolve.outputs.release == 'suite' && needs.resolve.outputs.deploy_mode == 'suite' && needs.resolve.outputs.dry_run != 'true' && needs.deploy-conary.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/release-artifact-proof.yml
    with:
      tag_name: ${{ needs.resolve.outputs.tag_name }}

  verify-remi:
    name: verify-remi
    needs: [resolve, validate-routing]
    if: ${{ needs.resolve.outputs.release == 'suite' && needs.resolve.outputs.deploy_mode == 'suite' && github.event_name == 'workflow_dispatch' && needs.resolve.outputs.dry_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ needs.resolve.outputs.source_run }}
        run: |
          set -euo pipefail
          if gh run download "$SOURCE_RUN" --dir source-artifacts; then
            exit 0
          fi

          echo "gh run download failed for source_run=${SOURCE_RUN}; attempting release-asset fallback" >&2
          rm -rf source-artifacts
          source_tag="$(gh api "repos/${GH_REPO}/actions/runs/${SOURCE_RUN}" --jq '.head_branch')"
          [[ -n "$source_tag" && "$source_tag" != "null" ]] || {
            echo "source run has no head_branch for release fallback" >&2
            exit 1
          }

          fallback_dir="source-artifacts/release-fallback"
          mkdir -p "$fallback_dir"
          gh release download "$source_tag" --repo "$GH_REPO" --dir "$fallback_dir"

          metadata_file="${fallback_dir}/metadata.json"
          [[ -f "$metadata_file" ]] || {
            echo "release fallback metadata.json missing for ${source_tag}" >&2
            exit 1
          }

          bundle_name="$(jq -r '.bundle_name' "$metadata_file")"
          [[ "$bundle_name" == "suite-bundle" ]] || {
            echo "release fallback bundle_name is ${bundle_name}, expected suite-bundle" >&2
            exit 1
          }

          bundle_dir="source-artifacts/${bundle_name}"
          mkdir -p "$bundle_dir"
          find "$fallback_dir" -maxdepth 1 -type f -exec mv {} "$bundle_dir"/ \;
          rmdir "$fallback_dir"
      - name: Verify remi bundle
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          BUNDLE_NAME: ${{ needs.resolve.outputs.bundle_name }}
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="source-artifacts/${BUNDLE_NAME}"
          [[ -d "$bundle_dir" && ! -L "$bundle_dir" ]] || { echo "suite-bundle artifact missing or symlinked" >&2; exit 1; }
          (
            cd "$bundle_dir"
            [[ -s SHA256SUMS && ! -L SHA256SUMS ]] || { echo "suite checksums missing or symlinked" >&2; exit 1; }
            sha256sum -c SHA256SUMS
          )
          bundle="${bundle_dir}/remi-${VERSION}-linux-x64.tar.gz"
          [[ -s "$bundle" && ! -L "$bundle" ]] || { echo "remi bundle missing, empty, or symlinked" >&2; exit 1; }
          echo "[DRY RUN] remi bundle ready: $bundle"

  deploy-remi:
    name: deploy-remi
    needs: [resolve, validate-routing]
    if: ${{ needs.resolve.outputs.release == 'suite' && needs.resolve.outputs.deploy_mode == 'suite' && needs.resolve.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.tag_name }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact release tag checkout
        env:
          TAG_NAME: ${{ needs.resolve.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          git tag --points-at HEAD | grep -Fx "$TAG_NAME" >/dev/null || {
            echo "Checked-out commit is not the serialized release tag ${TAG_NAME}" >&2
            exit 1
          }
      - name: Download source artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ needs.resolve.outputs.source_run }}
        run: |
          set -euo pipefail
          if gh run download "$SOURCE_RUN" --dir source-artifacts; then
            exit 0
          fi

          echo "gh run download failed for source_run=${SOURCE_RUN}; attempting release-asset fallback" >&2
          rm -rf source-artifacts
          source_tag="$(gh api "repos/${GH_REPO}/actions/runs/${SOURCE_RUN}" --jq '.head_branch')"
          [[ -n "$source_tag" && "$source_tag" != "null" ]] || {
            echo "source run has no head_branch for release fallback" >&2
            exit 1
          }

          fallback_dir="source-artifacts/release-fallback"
          mkdir -p "$fallback_dir"
          gh release download "$source_tag" --repo "$GH_REPO" --dir "$fallback_dir"

          metadata_file="${fallback_dir}/metadata.json"
          [[ -f "$metadata_file" ]] || {
            echo "release fallback metadata.json missing for ${source_tag}" >&2
            exit 1
          }

          bundle_name="$(jq -r '.bundle_name' "$metadata_file")"
          [[ "$bundle_name" == "suite-bundle" ]] || {
            echo "release fallback bundle_name is ${bundle_name}, expected suite-bundle" >&2
            exit 1
          }

          bundle_dir="source-artifacts/${bundle_name}"
          mkdir -p "$bundle_dir"
          find "$fallback_dir" -maxdepth 1 -type f -exec mv {} "$bundle_dir"/ \;
          rmdir "$fallback_dir"
      - name: Deploy remi bundle
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          BUNDLE_NAME: ${{ needs.resolve.outputs.bundle_name }}
          REMI_SSH_KEY: ${{ secrets.REMI_SSH_KEY }}
          REMI_SSH_TARGET: ${{ secrets.REMI_SSH_TARGET }}
          REMI_MAX_CONCURRENT: 32
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="source-artifacts/${BUNDLE_NAME}"
          [[ -d "$bundle_dir" && ! -L "$bundle_dir" ]] || { echo "suite-bundle artifact missing or symlinked" >&2; exit 1; }
          (
            cd "$bundle_dir"
            [[ -s SHA256SUMS && ! -L SHA256SUMS ]] || { echo "suite checksums missing or symlinked" >&2; exit 1; }
            sha256sum -c SHA256SUMS
          )
          bundle="${bundle_dir}/remi-${VERSION}-linux-x64.tar.gz"
          [[ -s "$bundle" && ! -L "$bundle" ]] || { echo "remi bundle missing, empty, or symlinked" >&2; exit 1; }
          [[ -n "${REMI_SSH_KEY:-}" ]] || { echo "REMI_SSH_KEY is required" >&2; exit 1; }

          target="${REMI_SSH_TARGET:-peter@ssh.conary.io}"
          mkdir -p ~/.ssh
          echo "$REMI_SSH_KEY" > ~/.ssh/remi_key
          chmod 600 ~/.ssh/remi_key
          ssh-keyscan -H "${target#*@}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh_opts="-i ~/.ssh/remi_key -o StrictHostKeyChecking=accept-new"

          remote_bundle="/tmp/remi-${VERSION}-${GITHUB_RUN_ID}.tar.gz"
          remote_repositories="/tmp/remi-repositories-${GITHUB_RUN_ID}.toml"
          remote_helper="/tmp/remi-deploy-helper-${GITHUB_RUN_ID}"
          helper_sha="$(sha256sum deploy/remi-deploy-helper.sh | cut -d ' ' -f 1)"
          ssh $ssh_opts "$target" "sudo -n /usr/local/sbin/conary-remi-deploy verify-access"
          scp $ssh_opts deploy/remi-deploy-helper.sh "${target}:${remote_helper}"
          ssh $ssh_opts "$target" \
            "sudo -n /usr/local/sbin/conary-remi-deploy install-helper '$helper_sha' '$remote_helper'"
          scp $ssh_opts "$bundle" "${target}:${remote_bundle}"
          scp $ssh_opts deploy/remi-repositories.toml "${target}:${remote_repositories}"
          ssh $ssh_opts "$target" bash -s \
            "$VERSION" "$remote_bundle" "$remote_repositories" "$REMI_MAX_CONCURRENT" <<'REMOTE_EOF'
            set -euo pipefail
            VERSION="$1"
            remote_bundle="$2"
            remote_repositories="$3"
            max_concurrent="$4"
            sudo -n /usr/local/sbin/conary-remi-deploy deploy-remi \
              "$VERSION" "$remote_bundle" "$remote_repositories" "$max_concurrent"
            sudo -n /usr/local/sbin/conary-remi-deploy verify-ingress

            for attempt in $(seq 1 120); do
              if sudo -n /usr/local/sbin/conary-remi-deploy inspect-remi \
                --require-repopulated
              then
                sudo -n /usr/local/sbin/conary-remi-deploy verify-ingress
                exit 0
              fi
              echo "Remi repopulation is still in progress (${attempt}/120)" >&2
              sleep 30
            done

            sudo -n /usr/local/sbin/conary-remi-deploy inspect-remi
            echo "Remi did not repopulate source and conversion state within one hour" >&2
            exit 1
          REMOTE_EOF
      - name: Verify remi health
        run: curl -fsS https://remi.conary.io/health >/dev/null
      - name: Verify remi readiness
        # /health is an unconditional liveness reply and proves only that the
        # process is listening. /health/ready opens the database, requires the
        # expected schema revision, and checks the serving directories and free
        # space, failing closed when a probe cannot run. Deployment evidence
        # needs the second, not the first.
        run: |
          set -euo pipefail
          body=$(curl -fsS --max-time 30 https://remi.conary.io/health/ready)
          echo "$body"
          echo "$body" | jq -e '.ready == true' >/dev/null

  verify-build-only-routes:
    name: verify-build-only-routes
    needs: [resolve, validate-routing]
    if: ${{ needs.resolve.outputs.release == 'suite' && needs.resolve.outputs.deploy_mode == 'suite' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record build-only artifact routes
        env:
          ARTIFACTS: ${{ needs.resolve.outputs.artifacts }}
        shell: bash
        run: |
          set -euo pipefail
          for product in conaryd conary-test; do
            jq -e \
              --arg product "$product" \
              'any(.[]; .product == $product and .deploy_mode == "none")' \
              <<< "$ARTIFACTS" >/dev/null
            echo "${product}: build-and-release proof only; no deployment configured"
          done
