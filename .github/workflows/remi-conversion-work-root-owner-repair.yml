name: remi-conversion-work-root-owner-repair

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-and-verify
  cancel-in-progress: false

jobs:
  repair:
    name: repair exact production conversion work-root owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out exact protected repair operator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require a protected-main repair revision
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || {
            echo "work-root owner repair must be dispatched from main" >&2
            exit 1
          }
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "repair workflow authority is not a canonical commit SHA" >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$WORKFLOW_SHA" ]] || {
            echo "repair checkout does not match the executing workflow revision" >&2
            exit 1
          }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$WORKFLOW_SHA" origin/main || {
            echo "repair operator must already be merged into origin/main" >&2
            exit 1
          }

      - name: Repair through the fixed production helper
        env:
          REMI_SSH_KNOWN_HOSTS: ${{ secrets.REMI_SSH_KNOWN_HOSTS }}
          REMI_SSH_KEY: ${{ secrets.REMI_SSH_KEY }}
          REMI_SSH_TARGET: ${{ secrets.REMI_SSH_TARGET }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          [[ -n "${REMI_SSH_KEY:-}" && -n "${REMI_SSH_KNOWN_HOSTS:-}" ]] || {
            echo "production repair credentials are unavailable" >&2
            exit 1
          }
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ \
            && "$WORKFLOW_RUN_ID" =~ ^[1-9][0-9]*$ \
            && "$WORKFLOW_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || {
              echo "production repair authority is malformed" >&2
              exit 1
          }
          target="${REMI_SSH_TARGET:-peter@ssh.conary.io}"
          [[ "$target" =~ ^[A-Za-z_][A-Za-z0-9._-]*@[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || {
            echo "production repair target is malformed" >&2
            exit 1
          }

          repair_id="${WORKFLOW_RUN_ID}-${WORKFLOW_RUN_ATTEMPT}"
          remote_helper="/tmp/remi-work-root-owner-repair-helper-${repair_id}"
          helper="${RUNNER_TEMP}/remi-work-root-owner-repair-helper-${repair_id}"
          helper_stdout="${RUNNER_TEMP}/remi-work-root-owner-repair.stdout"
          helper_stderr="${RUNNER_TEMP}/remi-work-root-owner-repair.stderr"
          expected_stdout="${RUNNER_TEMP}/remi-work-root-owner-repair.expected"
          key="${RUNNER_TEMP}/remi-work-root-owner-repair-key"
          known_hosts="${RUNNER_TEMP}/remi-work-root-owner-repair-known-hosts"
          evidence="remi-conversion-work-root-owner-repair-v1.json"
          evidence_next="${evidence}.next"
          remote_cleanup_possible=0
          cleanup() {
            status=$?
            set +e
            if (( remote_cleanup_possible == 1 )); then
              # The remote path is derived only from decimal workflow identities.
              # shellcheck disable=SC2029
              ssh "${ssh_opts[@]}" "$target" "rm -f -- '$remote_helper'" \
                >/dev/null 2>&1
            fi
            rm -f -- \
              "$helper" \
              "$helper_stdout" \
              "$helper_stderr" \
              "$expected_stdout" \
              "$key" \
              "$known_hosts" \
              "$evidence_next"
            set -e
            return "$status"
          }
          trap cleanup EXIT
          rm -f -- "$evidence" "$evidence_next"

          git show "${WORKFLOW_SHA}:deploy/remi-deploy-helper.sh" > "$helper"
          [[ -s "$helper" && ! -L "$helper" ]] || {
            echo "protected repair helper is unavailable" >&2
            exit 1
          }
          helper_sha256="$(sha256sum "$helper" | cut -d ' ' -f 1)"
          [[ "$helper_sha256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "protected repair helper identity is malformed" >&2
            exit 1
          }

          umask 077
          printf '%s\n' "$REMI_SSH_KEY" > "$key"
          printf '%s\n' "$REMI_SSH_KNOWN_HOSTS" > "$known_hosts"
          chmod 0600 "$key" "$known_hosts"
          ssh-keygen -y -f "$key" >/dev/null 2>&1 || {
            echo "production repair credentials are invalid" >&2
            exit 1
          }
          host="${target#*@}"
          ssh-keygen -F "$host" -f "$known_hosts" >/dev/null || {
            echo "pinned production repair host identity is unavailable" >&2
            exit 1
          }
          ssh_opts=(
            -i "$key"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts"
          )

          if ! ssh "${ssh_opts[@]}" "$target" \
            "sudo -n /usr/local/sbin/conary-remi-deploy verify-access" \
            >/dev/null 2>&1; then
              echo "production repair helper access failed" >&2
              exit 1
          fi
          remote_cleanup_possible=1
          if ! scp "${ssh_opts[@]}" "$helper" "${target}:${remote_helper}" \
            >/dev/null 2>&1; then
              echo "production repair helper staging failed" >&2
              exit 1
          fi
          # The helper digest and remote path are locally typed above.
          # shellcheck disable=SC2029
          if ! ssh "${ssh_opts[@]}" "$target" \
            "sudo -n /usr/local/sbin/conary-remi-deploy install-helper '$helper_sha256' '$remote_helper'" \
            >/dev/null 2>&1; then
              echo "production repair helper installation failed" >&2
              exit 1
          fi

          rm -f -- "$helper_stdout" "$helper_stderr"
          set +e
          ssh "${ssh_opts[@]}" "$target" \
            "sudo -n /usr/local/sbin/conary-remi-deploy repair-remi-conversion-work-root-owner" \
            >"$helper_stdout" 2>"$helper_stderr"
          helper_status=$?
          set -e
          [[ -f "$helper_stdout" && ! -L "$helper_stdout" \
            && -f "$helper_stderr" && ! -L "$helper_stderr" ]] || {
              rm -f -- "$helper_stdout" "$helper_stderr"
              echo "production repair helper returned invalid isolated output" >&2
              exit 1
          }
          rm -f -- "$helper_stderr"
          [[ ! -e "$helper_stderr" ]] || {
            echo "private production repair diagnostics were not removed" >&2
            exit 1
          }
          (( helper_status == 0 )) || {
            rm -f -- "$helper_stdout"
            echo "fixed production work-root owner repair failed" >&2
            exit 1
          }
          stdout_bytes="$(stat -c '%s' "$helper_stdout")"
          stdout_lines="$(wc -l < "$helper_stdout")"
          [[ "$stdout_bytes" =~ ^[1-9][0-9]*$ \
            && "$stdout_lines" == "1" \
            && "$stdout_bytes" -le 512 ]] || {
              rm -f -- "$helper_stdout"
              echo "fixed production work-root owner repair returned invalid output" >&2
              exit 1
          }
          printf '%s\n' \
            '{"schema_version":1,"operation":"repair-remi-conversion-work-root-owner","outcome":"repaired","precondition":"owner-drift","postcondition":"validated"}' \
            > "$expected_stdout"
          cmp -s "$helper_stdout" "$expected_stdout" || {
            rm -f -- "$helper_stdout"
            echo "fixed production work-root owner repair returned invalid output" >&2
            exit 1
          }
          operation="$(jq -cer '
            if type == "object"
              and (keys | sort)
                == ["operation", "outcome", "postcondition", "precondition", "schema_version"]
              and .schema_version == 1
              and .operation == "repair-remi-conversion-work-root-owner"
              and .outcome == "repaired"
              and .precondition == "owner-drift"
              and .postcondition == "validated"
            then .
            else error("invalid work-root owner repair result")
            end
          ' "$helper_stdout")" || {
            rm -f -- "$helper_stdout"
            echo "fixed production work-root owner repair returned invalid output" >&2
            exit 1
          }
          rm -f -- "$helper_stdout" "$expected_stdout"

          jq -cne \
            --arg helper_sha256 "$helper_sha256" \
            --argjson operation "$operation" \
            --arg workflow_commit_sha "$WORKFLOW_SHA" \
            --argjson workflow_run_attempt "$WORKFLOW_RUN_ATTEMPT" \
            --argjson workflow_run_id "$WORKFLOW_RUN_ID" '
              {
                schema_version: 1,
                evidence_class: "remi-conversion-work-root-owner-repair",
                workflow: {
                  commit_sha: $workflow_commit_sha,
                  helper_sha256: $helper_sha256,
                  run_id: $workflow_run_id,
                  run_attempt: $workflow_run_attempt
                },
                result: $operation
              }
            ' > "$evidence_next"
          chmod 0600 "$evidence_next"
          repair_evidence_is_typed() {
            jq -e '
              def sha256: type == "string" and test("^[0-9a-f]{64}$");
              def commit: type == "string" and test("^[0-9a-f]{40}$");
              (keys | sort) == ["evidence_class", "result", "schema_version", "workflow"]
              and .schema_version == 1
              and .evidence_class == "remi-conversion-work-root-owner-repair"
              and (.workflow | keys | sort)
                == ["commit_sha", "helper_sha256", "run_attempt", "run_id"]
              and (.workflow.commit_sha | commit)
              and (.workflow.helper_sha256 | sha256)
              and (.workflow.run_id | type == "number" and floor == . and . > 0)
              and (.workflow.run_attempt | type == "number" and floor == . and . > 0)
              and (.result | keys | sort)
                == ["operation", "outcome", "postcondition", "precondition", "schema_version"]
              and .result.schema_version == 1
              and .result.operation == "repair-remi-conversion-work-root-owner"
              and .result.outcome == "repaired"
              and .result.precondition == "owner-drift"
              and .result.postcondition == "validated"
              and all(.. | strings;
                length <= 128
                and (contains("/") | not)
                and (contains("\\") | not)
                and (test("[[:cntrl:]]") | not))
            ' "$1" >/dev/null
          }
          repair_evidence_is_typed "$evidence_next" || {
            echo "production repair evidence is invalid" >&2
            exit 1
          }
          evidence_sha256="$(sha256sum "$evidence_next" | cut -d ' ' -f 1)"
          evidence_bytes="$(stat -c '%s' "$evidence_next")"
          mv -- "$evidence_next" "$evidence"
          if [[ -f "$evidence" && ! -L "$evidence" \
            && "$(stat -c '%a' "$evidence")" == "600" \
            && "$(stat -c '%s' "$evidence")" == "$evidence_bytes" \
            && "$(sha256sum "$evidence" | cut -d ' ' -f 1)" == "$evidence_sha256" ]] \
            && repair_evidence_is_typed "$evidence"; then
              :
          else
            rm -f -- "$evidence"
            echo "published production repair evidence is invalid" >&2
            exit 1
          fi

      - name: Upload path-free work-root owner repair evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: remi-conversion-work-root-owner-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: remi-conversion-work-root-owner-repair-v1.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
