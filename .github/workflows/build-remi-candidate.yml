name: build-remi-candidate

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact commit already merged into main to rebuild for reproducibility proof.
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: remi-candidate-build-${{ github.event_name == 'push' && github.sha || inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  build-remi-candidate:
    name: build-remi-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      CARGO_ENCODED_RUSTFLAGS: ""
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUSTFLAGS: ""
      RUSTC_WRAPPER: sccache
    steps:
      - name: Check out exact merged candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact protected-main source
        id: candidate
        env:
          REQUESTED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "candidate commit must be a full lowercase SHA" >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$REQUESTED_SHA" ]] || {
            echo "checkout does not match requested candidate SHA" >&2
            exit 1
          }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$REQUESTED_SHA" origin/main || {
            echo "candidate must already be merged into origin/main" >&2
            exit 1
          }
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || {
            echo "candidate checkout is not clean" >&2
            exit 1
          }
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
      - name: Start dependency setup clock
        id: setup-start
        shell: bash
        run: echo "started_ns=$(date -u +%s%N)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-rust-workspace
        with:
          toolchain: 1.98.0
      - name: Finish dependency setup clock
        id: setup
        env:
          STARTED_NS: ${{ steps.setup-start.outputs.started_ns }}
        shell: bash
        run: |
          set -euo pipefail
          finished_ns="$(date -u +%s%N)"
          echo "duration_ms=$(( (finished_ns - STARTED_NS) / 1000000 ))" >> "$GITHUB_OUTPUT"
      - name: Start compiler-cache setup clock
        id: cache-start
        shell: bash
        run: echo "started_ns=$(date -u +%s%N)" >> "$GITHUB_OUTPUT"
      - name: Restore and activate Remi compiler-cache policy
        id: remi-cache
        uses: ./.github/actions/setup-remi-candidate-compiler-cache
        with:
          source-sha: ${{ steps.candidate.outputs.sha }}
      - name: Finish compiler-cache setup clock
        id: cache
        env:
          STARTED_NS: ${{ steps.cache-start.outputs.started_ns }}
        shell: bash
        run: |
          set -euo pipefail
          finished_ns="$(date -u +%s%N)"
          echo "duration_ms=$(( (finished_ns - STARTED_NS) / 1000000 ))" >> "$GITHUB_OUTPUT"
      - name: Build exact release-profile Remi binary
        id: build
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          link_timings="${RUNNER_TEMP}/remi-link-timings.tsv"
          rustc_timings="${RUNNER_TEMP}/remi-rustc-timings.tsv"
          cache_stats="${RUNNER_TEMP}/remi-sccache-stats.json"
          : > "$link_timings"
          : > "$rustc_timings"
          export CONARY_GIT_COMMIT="$CANDIDATE_SHA"
          export CONARY_GIT_DIRTY=false
          export CONARY_REAL_LINKER="$(realpath "$(command -v cc)")"
          export CONARY_LINK_TIMINGS_PATH="$link_timings"
          export CONARY_REAL_RUSTC_WRAPPER="$SCCACHE_PATH"
          export CONARY_RUSTC_TIMINGS_PATH="$rustc_timings"
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER="$(pwd)/scripts/timed-linker.sh"
          export RUSTC_WRAPPER="$(pwd)/scripts/timed-rustc-wrapper.sh"
          {
            echo "CONARY_GIT_COMMIT=$CONARY_GIT_COMMIT"
            echo "CONARY_GIT_DIRTY=$CONARY_GIT_DIRTY"
          } >> "$GITHUB_ENV"
          started_ns="$(date -u +%s%N)"
          cargo build -p remi --release --locked
          finished_ns="$(date -u +%s%N)"
          "$SCCACHE_PATH" --show-stats --stats-format json > "$cache_stats"
          jq -e 'type == "object"' "$cache_stats" >/dev/null
          [[ -s "$link_timings" ]] || {
            echo "timed linker emitted no measurements" >&2
            exit 1
          }
          [[ -s "$rustc_timings" ]] || {
            echo "timed Rust compiler wrapper emitted no measurements" >&2
            exit 1
          }
          echo "duration_ms=$(( (finished_ns - started_ns) / 1000000 ))" >> "$GITHUB_OUTPUT"
          echo "link_timings=$link_timings" >> "$GITHUB_OUTPUT"
          echo "rustc_timings=$rustc_timings" >> "$GITHUB_OUTPUT"
          echo "cache_stats=$cache_stats" >> "$GITHUB_OUTPUT"
      - name: Stop Remi compiler cache before bulk save
        run: "$SCCACHE_PATH --stop-server"
      - name: Start Remi compiler-cache save clock
        if: ${{ steps.remi-cache.outputs.cache_hit != 'true' }}
        id: cache-save-start
        shell: bash
        run: echo "started_ns=$(date -u +%s%N)" >> "$GITHUB_OUTPUT"
      - name: Save exact Remi compiler cache
        if: ${{ steps.remi-cache.outputs.cache_hit != 'true' }}
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/remi-release-sccache
          key: ${{ steps.remi-cache.outputs.exact_key }}
      - name: Finish Remi compiler-cache save clock
        if: ${{ steps.remi-cache.outputs.cache_hit != 'true' }}
        id: cache-save
        env:
          STARTED_NS: ${{ steps.cache-save-start.outputs.started_ns }}
        shell: bash
        run: |
          finished_ns="$(date -u +%s%N)"
          echo "duration_ms=$(( (finished_ns - STARTED_NS) / 1000000 ))" >> "$GITHUB_OUTPUT"
      - name: Record exact Remi compiler-cache reuse
        if: ${{ steps.remi-cache.outputs.cache_hit == 'true' }}
        id: cache-save-hit
        shell: bash
        run: echo "duration_ms=0" >> "$GITHUB_OUTPUT"
      - name: Package immutable candidate evidence
        id: package
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          SETUP_MS: ${{ steps.setup.outputs.duration_ms }}
          CACHE_SETUP_MS: ${{ steps.cache.outputs.duration_ms }}
          CACHE_SAVE_MS: ${{ steps.cache-save.outputs.duration_ms || steps.cache-save-hit.outputs.duration_ms }}
          BUILD_MS: ${{ steps.build.outputs.duration_ms }}
          LINK_TIMINGS: ${{ steps.build.outputs.link_timings }}
          RUSTC_TIMINGS: ${{ steps.build.outputs.rustc_timings }}
          CACHE_STATS: ${{ steps.build.outputs.cache_stats }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "remi") | .version')"
          output_dir="${RUNNER_TEMP}/remi-candidate-artifact"
          manifest="$(scripts/remi-candidate-artifact.sh package \
            target/release/remi "$output_dir" "$version" "$CANDIDATE_SHA" \
            "$GITHUB_RUN_ID" "$SETUP_MS" "$CACHE_SETUP_MS" "$CACHE_SAVE_MS" \
            "$BUILD_MS" "$LINK_TIMINGS" "$RUSTC_TIMINGS" "$CACHE_STATS")"
          echo "directory=$output_dir" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify fresh artifact from exact source
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          ARTIFACT_DIR: ${{ steps.package.outputs.directory }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/remi-candidate-artifact.sh verify \
            "$ARTIFACT_DIR" "$CANDIDATE_SHA" "$GITHUB_RUN_ID" "$GITHUB_EVENT_NAME" \
            > "${RUNNER_TEMP}/fresh-artifact-verification.json"
          jq -e '.schema_version == 2' \
            "${RUNNER_TEMP}/fresh-artifact-verification.json" >/dev/null
      - name: Locate prior exact protected build
        id: prior
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build-remi-candidate.yml/runs" \
            -f event=push -f status=success -f head_sha="$CANDIDATE_SHA" \
            -f branch=main -f per_page=100)"
          prior_run_id="$(jq -r \
            --arg sha "$CANDIDATE_SHA" \
            --arg repository "$GITHUB_REPOSITORY" '
              [.workflow_runs[]
                | select(.head_sha == $sha)
                | select(.head_branch == "main")
                | select(.event == "push")
                | select(.conclusion == "success")
                | select(.head_repository.full_name == $repository)
                | select(.path | startswith(".github/workflows/build-remi-candidate.yml"))]
              | sort_by(.run_number)
              | last
              | .id // empty
            ' <<< "$runs")"
          if [[ -n "$prior_run_id" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "run_id=$prior_run_id" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download prior exact protected artifact
        if: steps.prior.outputs.found == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: remi-candidate-${{ steps.candidate.outputs.sha }}
          path: ${{ runner.temp }}/prior-remi-candidate-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.prior.outputs.run_id }}
      - name: Prove same-input binary reproducibility
        if: steps.prior.outputs.found == 'true'
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          CURRENT_DIR: ${{ steps.package.outputs.directory }}
          PRIOR_RUN_ID: ${{ steps.prior.outputs.run_id }}
          PRIOR_DIR: ${{ runner.temp }}/prior-remi-candidate-artifact
        shell: bash
        run: |
          set -euo pipefail
          scripts/remi-candidate-artifact.sh verify \
            "$PRIOR_DIR" "$CANDIDATE_SHA" "$PRIOR_RUN_ID" push >/dev/null
          current_manifest="${CURRENT_DIR}/remi-candidate-manifest.json"
          prior_manifest="${PRIOR_DIR}/remi-candidate-manifest.json"
          jq -e --slurpfile prior "$prior_manifest" '
            .source == $prior[0].source
            and .build == $prior[0].build
            and .artifact.binary_sha256 == $prior[0].artifact.binary_sha256
            and .artifact.binary_bytes == $prior[0].artifact.binary_bytes
            and .artifact.bundle_sha256 == $prior[0].artifact.bundle_sha256
            and .artifact.bundle_bytes == $prior[0].artifact.bundle_bytes
          ' "$current_manifest" >/dev/null || {
            echo "same-input Remi candidate is not byte reproducible" >&2
            exit 1
          }
      - name: Upload exact protected candidate artifact
        id: upload
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: remi-candidate-${{ steps.candidate.outputs.sha }}
          path: |
            ${{ steps.package.outputs.directory }}/remi-candidate-manifest.json
            ${{ steps.package.outputs.directory }}/*.tar.gz
            ${{ steps.package.outputs.directory }}/link-timings.tsv
            ${{ steps.package.outputs.directory }}/rustc-timings.tsv
            ${{ steps.package.outputs.directory }}/sccache-stats.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Summarize candidate build latency
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          MANIFEST: ${{ steps.package.outputs.manifest }}
          PRIOR_FOUND: ${{ steps.prior.outputs.found }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Exact Remi candidate"
            echo
            echo "- commit: \`$CANDIDATE_SHA\`"
            echo "- artifact_digest: \`$ARTIFACT_DIGEST\`"
            echo "- prior_exact_reproducibility_check: \`$PRIOR_FOUND\`"
            jq -r '
              "- dependency_setup_ms: `\(.measurements.dependency_setup_ms)`\n"
              + "- compiler_cache_setup_ms: `\(.measurements.compiler_cache_setup_ms)`\n"
              + "- compiler_cache_save_ms: `\(.measurements.compiler_cache_save_ms)`\n"
              + "- cargo_build_ms: `\(.measurements.cargo_build_ms)`\n"
              + "- rustc_ms_total: `\(.measurements.rustc_ms_total)`\n"
              + "- slowest_rustc: `\(.compiler_timing.slowest_crate)` "
              + "(`\(.compiler_timing.slowest_crate_type)`, "
              + "`\(.compiler_timing.slowest_ms)` ms)\n"
              + "- linker_ms_total: `\(.measurements.linker_ms_total)`\n"
              + "- remi_final_link_ms: `\(.measurements.remi_final_link_ms)`\n"
              + "- bundle_ms: `\(.measurements.bundle_ms)`\n"
              + "- bundle_bytes: `\(.artifact.bundle_bytes)`"
            ' "$MANIFEST"
          } >> "$GITHUB_STEP_SUMMARY"
