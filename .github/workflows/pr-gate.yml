  doctests:
    name: doctests
    runs-on: ubuntu-latest
    needs: gnu-compiler-cache
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Require exact compiler-cache seed
        env:
          PRIMER_RESULT: ${{ needs.gnu-compiler-cache.result }}
        run: test "$PRIMER_RESULT" = success
      - uses: ./.github/actions/setup-rust-workspace
        with:
          compiler-cache: reader
      - name: Run doctests
        run: cargo test --doc --workspace --verbose
      - name: Retain doctest compiler-cache evidence
        if: ${{ always() }}
        uses: ./.github/actions/summarize-rust-cache
        with:
          phase: pr-doctests

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Dependency review
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
            head_ref="${{ github.event.pull_request.head.sha }}"
          else
            base_ref="main"
            head_ref="${GITHUB_SHA}"
          fi

          error_log="$(mktemp)"
          trap 'rm -f "$error_log"' EXIT
          report=""
          for attempt in 1 2 3 4; do
            if report="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/dependency-graph/compare/${base_ref}...${head_ref}" \
              2>"$error_log")"; then
              break
            fi
            if (( attempt == 4 )); then
              echo "Dependency review could not obtain its authoritative report:" >&2
              cat "$error_log" >&2
              exit 1
            fi
            echo "Dependency review API request failed (${attempt}/4); retrying" >&2
            sleep "$((attempt * 5))"
          done

          violations=$(jq '
            [
              .[]
              | select(.change_type != "removed")
              | . as $dep
              | [ .vulnerabilities[]?.severity | ascii_downcase ] as $severities
              | select(any($severities[]?; . == "moderate" or . == "high" or . == "critical"))
              | {
                  manifest,
                  ecosystem,
                  name,
                  version,
                  severities: $severities
                }
            ]
          ' <<<"$report")

          if [[ "$(jq 'length' <<<"$violations")" != "0" ]]; then
            echo "Dependency review found vulnerable dependency changes:" >&2
            jq -r '.[] | "- \(.manifest): \(.name)@\(.version) [\(.severities | join(", "))]"' <<<"$violations" >&2
            exit 1
          fi

          echo "Dependency review found no moderate-or-higher vulnerable dependency changes."
