name: pr-gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  native-matrix-artifacts:
    name: native-matrix-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_ENCODED_RUSTFLAGS: ""
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUSTFLAGS: ""
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_BACKEND: local-disk-bulk-v1
      SCCACHE_CACHE_SIZE: 4G
      SCCACHE_LOCAL_RW_MODE: READ_WRITE
      SCCACHE_VERSION: 0.16.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Bind the exact protected source
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "workflow commit must be a full lowercase SHA" >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || {
            echo "producer checkout does not match the workflow commit" >&2
            exit 1
          }
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || {
            echo "producer checkout is not clean" >&2
            exit 1
          }
      - name: Restore exact prior-attempt native matrix artifact
        id: native-artifact-restore
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/native-matrix-artifact
          key: native-matrix-artifact-v1-${{ github.run_id }}-${{ github.sha }}
      - name: Verify reusable exact-run matrix artifact
        if: ${{ steps.native-artifact-restore.outputs.cache-hit == 'true' }}
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/native-matrix-artifact
        run: |
          set -euo pipefail
          scripts/native-matrix-artifact.sh verify \
            "$ARTIFACT_DIR" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_EVENT_NAME" \
            > "${RUNNER_TEMP}/native-matrix-reused-verification.json"
          jq -e '.schema_version == 1' \
            "${RUNNER_TEMP}/native-matrix-reused-verification.json" >/dev/null
      - name: Start dependency setup clock
        if: ${{ steps.native-artifact-restore.outputs.cache-hit != 'true' }}
        id: setup-start
        run: echo "started_ns=$(date -u +%s%N)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-rust-workspace
        if: ${{ steps.native-artifact-restore.outputs.cache-hit != 'true' }}
        with:
          toolchain: 1.98.0
      - name: Finish dependency setup clock
        if: ${{ steps.native-artifact-restore.outputs.cache-hit != 'true' }}
        id: setup
        env:
          STARTED_NS: ${{ steps.setup-start.outputs.started_ns }}
        run: |
          finished_ns="$(date -u +%s%N)"
          echo "duration_ms=$(( (finished_ns - STARTED_NS) / 1000000 ))" >> "$GITHUB_OUTPUT"
      - name: Install native matrix compiler inputs
        if: ${{ steps.native-artifact-restore.outputs.cache-hit != 'true' }}
        run: >-
          bash scripts/ci-install-ubuntu-packages.sh
          musl-tools gperf linux-libc-dev
      - name: Install the native matrix Rust target
        if: ${{ steps.native-artifact-restore.outputs.cache-hit != 'true' }}
        run: rustup target add x86_64-unknown-linux-musl
      - name: Start compiler-cache setup clock
        if: ${{ steps.native-artifact-restore.outputs.cache-hit != 'true' }}
        id: cache-start
        run: echo "started_ns=$(date -u +%s%N)" >> "$GITHUB_OUTPUT"
      - name: Bind exact native compiler-cache policy
        if: ${{ steps.native-artifact-restore.outputs.cache-hit != 'true' }}
        id: native-cache-policy
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "native compiler-cache source must be a full lowercase SHA" >&2
            exit 1
          }
          native_abi="$(
            dpkg-query --show --showformat='${Package}=${Version}\n' \
              gperf linux-libc-dev musl-dev musl-tools | LC_ALL=C sort
          )"
          identity="$(
            {
              printf 'schema=1\n'
              printf 'rustc=%s\n' "$(rustc -vV)"
              printf 'cargo=%s\n' "$(cargo -vV)"
              printf 'lock=%s\n' "$(sha256sum Cargo.lock | cut -d ' ' -f 1)"
              printf 'target=x86_64-unknown-linux-musl\n'
              printf 'cc=%s\n' "$(musl-gcc --version | sed -n '1p')"
              printf 'native_abi=%s\n' "$native_abi"
              printf 'builder=%s\n' "$(sha256sum scripts/build-static-conary.sh | cut -d ' ' -f 1)"
              printf 'header_probe=%s\n' "$(sha256sum scripts/kernel-header-roots.sh | cut -d ' ' -f 1)"
              printf 'action=%s\n' "$(sha256sum .github/actions/build-static-conary/action.yml | cut -d ' ' -f 1)"
              printf 'features=default\n'
              printf 'test_harness=true\n'
              printf 'rustflags=%s\n' "${RUSTFLAGS:-}"
              printf 'encoded_rustflags=%s\n' "${CARGO_ENCODED_RUSTFLAGS:-}"
              printf 'incremental=%s\n' "${CARGO_INCREMENTAL:-}"
              printf 'dev_debug=%s\n' "${CARGO_PROFILE_DEV_DEBUG:-}"
              printf 'test_debug=%s\n' "${CARGO_PROFILE_TEST_DEBUG:-}"
            } | sha256sum | cut -d ' ' -f 1
          )"
          namespace="native-matrix-musl-local-v1-${identity}"
          restore_prefix="${namespace}-"
          exact_key="${restore_prefix}${GITHUB_SHA}"
          {
            echo "SCCACHE_CACHE_NAMESPACE=$namespace"
            echo "SCCACHE_DIR=$RUNNER_TEMP/native-matrix-sccache"
          } >> "$GITHUB_ENV"
          {
            echo "exact_key=$exact_key"
            echo "restore_prefix=$restore_prefix"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Native matrix compiler-cache identity"
            echo
            echo "- namespace: \`$namespace\`"
            echo "- Cargo.lock_sha256: \`$(sha256sum Cargo.lock | cut -d ' ' -f 1)\`"
            echo "- native_abi: \`$(tr '\n' ' ' <<<"$native_abi" | sed 's/ $//')\`"
            echo "- target: \`x86_64-unknown-linux-musl\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Restore native compiler-cache seed
        if: ${{ steps.native-artifact-restore.outputs.cache-hit != 'true' }}
        id: native-cache-restore
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/native-matrix-sccache
          key: ${{ steps.native-cache-policy.outputs.exact_key }}
          restore-keys: ${{ steps.native-cache-policy.outputs.restore_prefix }}
      - name: Install bounded shared compiler cache
        if: ${{ steps.native-artifact-restore.outputs.cache-hit != 'true' }}
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Finish compiler-cache setup clock
        if: ${{ steps.native-artifact-restore.outputs.cache-hit != 'true' }}
        id: cache
        env:
          STARTED_NS: ${{ steps.cache-start.outputs.started_ns }}
        run: |
          set -euo pipefail
          [[ -x "${SCCACHE_PATH:-}" ]] || {
            echo "sccache action did not expose an executable" >&2
            exit 1
          }
          if [[ -e "$SCCACHE_DIR" ]]; then
            [[ -d "$SCCACHE_DIR" && ! -L "$SCCACHE_DIR" ]] || {
              echo "native compiler cache must be a plain directory" >&2
              exit 1
            }
          else
            mkdir -p "$SCCACHE_DIR"
          fi
          echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"
          "$SCCACHE_PATH" --zero-stats
          finished_ns="$(date -u +%s%N)"
          echo "duration_ms=$(( (finished_ns - STARTED_NS) / 1000000 ))" >> "$GITHUB_OUTPUT"
      - name: Start exact-head artifact build clock
        if: ${{ steps.native-artifact-restore.outputs.cache-hit != 'true' }}
        id: build-start
        run: |
          metrics="${RUNNER_TEMP}/native-matrix-static-build-metrics.json"
          echo "started_ns=$(date -u +%s%N)" >> "$GITHUB_OUTPUT"
          echo "metrics=$metrics" >> "$GITHUB_OUTPUT"
          echo "CONARY_STATIC_BUILD_METRICS_PATH=$metrics" >> "$GITHUB_ENV"
      - name: Build all static matrix executables once
        if: ${{ steps.native-artifact-restore.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/build-static-conary
        with:
          with-test-harness: "true"
      - name: Finish exact-head artifact build clock
        if: ${{ steps.native-artifact-restore.outputs.cache-hit != 'true' }}
        id: build
        env:
          STARTED_NS: ${{ steps.build-start.outputs.started_ns }}
        run: |
          set -euo pipefail
          finished_ns="$(date -u +%s%N)"
          stats="${RUNNER_TEMP}/native-matrix-sccache-stats.json"
          metrics="${{ steps.build-start.outputs.metrics }}"
          "$SCCACHE_PATH" --show-stats --stats-format json > "$stats"
          jq -e 'type == "object"' "$stats" >/dev/null
          jq -e '.schema_version == 1 and .with_test_harness == true' "$metrics" >/dev/null
          echo "duration_ms=$(( (finished_ns - STARTED_NS) / 1000000 ))" >> "$GITHUB_OUTPUT"
          echo "stats=$stats" >> "$GITHUB_OUTPUT"
          echo "metrics=$metrics" >> "$GITHUB_OUTPUT"
      - name: Stop native compiler cache before bulk save
        if: ${{ steps.native-artifact-restore.outputs.cache-hit != 'true' }}
        run: |
          "$SCCACHE_PATH" --stop-server
      - name: Start native compiler-cache save clock
        if: ${{ steps.native-artifact-restore.outputs.cache-hit != 'true' && steps.native-cache-restore.outputs.cache-hit != 'true' }}
        id: cache-save-start
        run: echo "started_ns=$(date -u +%s%N)" >> "$GITHUB_OUTPUT"
      - name: Save exact native compiler cache
        if: ${{ steps.native-artifact-restore.outputs.cache-hit != 'true' && steps.native-cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/native-matrix-sccache
          key: ${{ steps.native-cache-policy.outputs.exact_key }}
      - name: Finish native compiler-cache save clock
        if: ${{ steps.native-artifact-restore.outputs.cache-hit != 'true' && steps.native-cache-restore.outputs.cache-hit != 'true' }}
        id: cache-save
        env:
          STARTED_NS: ${{ steps.cache-save-start.outputs.started_ns }}
        run: |
          finished_ns="$(date -u +%s%N)"
          echo "duration_ms=$(( (finished_ns - STARTED_NS) / 1000000 ))" >> "$GITHUB_OUTPUT"
      - name: Record exact native compiler-cache reuse
        if: ${{ steps.native-artifact-restore.outputs.cache-hit != 'true' && steps.native-cache-restore.outputs.cache-hit == 'true' }}
        id: cache-save-hit
        run: echo "duration_ms=0" >> "$GITHUB_OUTPUT"
      - name: Package immutable exact-head matrix evidence
        if: ${{ steps.native-artifact-restore.outputs.cache-hit != 'true' }}
        id: package
        env:
          BUILD_MS: ${{ steps.build.outputs.duration_ms }}
          CACHE_SAVE_MS: ${{ steps.cache-save.outputs.duration_ms || steps.cache-save-hit.outputs.duration_ms }}
          CACHE_SETUP_MS: ${{ steps.cache.outputs.duration_ms }}
          CACHE_STATS: ${{ steps.build.outputs.stats }}
          BUILD_METRICS: ${{ steps.build.outputs.metrics }}
          SETUP_MS: ${{ steps.setup.outputs.duration_ms }}
        run: |
          set -euo pipefail
          output_dir="${RUNNER_TEMP}/native-matrix-artifact"
          manifest="$(scripts/native-matrix-artifact.sh package \
            "$output_dir" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            "$SETUP_MS" "$CACHE_SETUP_MS" "$CACHE_SAVE_MS" "$BUILD_MS" \
            "$CACHE_STATS" "$BUILD_METRICS")"
          echo "directory=$output_dir" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
      - name: Verify fresh exact-head matrix artifact
        if: ${{ steps.native-artifact-restore.outputs.cache-hit != 'true' }}
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/native-matrix-artifact
        run: |
          scripts/native-matrix-artifact.sh verify \
            "$ARTIFACT_DIR" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_EVENT_NAME" \
            > "${RUNNER_TEMP}/native-matrix-fresh-verification.json"
          jq -e '.schema_version == 1' \
            "${RUNNER_TEMP}/native-matrix-fresh-verification.json" >/dev/null
      - name: Save verified exact-run matrix artifact
        if: ${{ steps.native-artifact-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/native-matrix-artifact
          key: native-matrix-artifact-v1-${{ github.run_id }}-${{ github.sha }}
      - name: Upload immutable exact-head matrix artifact
        id: upload
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-matrix-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-matrix-artifact/native-matrix-artifact-manifest.json
            ${{ runner.temp }}/native-matrix-artifact/native-matrix-artifacts.tar.gz
            ${{ runner.temp }}/native-matrix-artifact/sccache-stats.json
            ${{ runner.temp }}/native-matrix-artifact/static-build-metrics.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Summarize protected matrix build latency
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_REUSED: ${{ steps.native-artifact-restore.outputs.cache-hit == 'true' }}
          MANIFEST: ${{ runner.temp }}/native-matrix-artifact/native-matrix-artifact-manifest.json
        run: |
          {
            echo "### Protected native matrix producer"
            echo
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- artifact_digest: \`$ARTIFACT_DIGEST\`"
            echo "- exact_run_artifact_reused: \`$ARTIFACT_REUSED\`"
            jq -r '
              "- dependency_setup_ms: `\(.measurements.dependency_setup_ms)`\n"
              + "- compiler_cache_setup_ms: `\(.measurements.compiler_cache_setup_ms)`\n"
              + "- compiler_cache_save_ms: `\(.measurements.compiler_cache_save_ms)`\n"
              + "- compiler_cache_backend: `\(.build.sccache_cache_backend)`\n"
              + "- compiler_cache_namespace: `\(.build.sccache_cache_namespace)`\n"
              + "- artifact_build_ms: `\(.measurements.artifact_build_ms)`\n"
              + "- static_dependency_cache_hit: `\(.measurements.static_dependency_cache_hit)`\n"
              + "- static_dependency_ms: `\(.measurements.static_dependency_ms)`\n"
              + "- static_runtime_build_ms: `\(.measurements.static_runtime_build_ms)`\n"
              + "- library_test_build_ms: `\(.measurements.library_test_build_ms)`\n"
              + "- bundle_ms: `\(.measurements.bundle_ms)`\n"
              + "- bundle_bytes: `\(.artifact.bundle_bytes)`"
            ' "$MANIFEST"
          } >> "$GITHUB_STEP_SUMMARY"

  workflow-runtime-policy:
    name: workflow-runtime-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare shell policy tools
        uses: ./.github/actions/setup-shell-policy-tools
      - name: Check GitHub Actions runtime policy
        run: bash scripts/check-github-action-runtimes.sh
      - name: Test GitHub Actions runtime policy checker
        run: bash scripts/test-github-action-runtimes.sh

  release-matrix-policy:
    name: release-matrix-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare shell policy tools
        uses: ./.github/actions/setup-shell-policy-tools
      - name: Check release matrix workflow alignment
        run: bash scripts/check-release-matrix.sh
      - name: Test release matrix policy
        run: bash scripts/test-release-matrix.sh
      - name: Test Remi deploy helper
        run: bash scripts/test-remi-deploy-helper.sh
      - name: Test Remi health probes
        run: bash scripts/test-remi-health.sh
      - name: Test Remi static-site deploy wrapper
        run: bash scripts/test-deploy-sites.sh

  docs-truth:
    name: docs-truth
    runs-on: ubuntu-latest
    env:
      LC_ALL: C
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare shell policy tools
        uses: ./.github/actions/setup-shell-policy-tools
      - name: Check required shell tools
        run: command -v rg >/dev/null
      - name: Check docs truth invariants
        run: bash scripts/check-doc-truth.sh
      - name: Test docs truth checker
        run: bash scripts/test-doc-truth.sh
      - name: Test agent context tool
        run: bash scripts/test-agent-context.sh
      - name: Validate feature ownership cards
        run: bash scripts/agent-context.sh --validate
      - name: Check support bundle privacy
        run: bash scripts/test-support-bundle.sh

  frontends:
    name: frontends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            web/package-lock.json
      - name: Check and build both SvelteKit frontends
        run: bash scripts/check-frontends.sh

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-rust-workspace
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  dependency-consistency:
    name: dependency-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check Rust dependency consistency
        run: |
          python3 scripts/check-rust-dependency-consistency.py
          python3 scripts/check-third-party-divergence.py
          python3 scripts/test-third-party-divergence.py

  gnu-compiler-cache:
    name: gnu-compiler-cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-rust-workspace
        with:
          compiler-cache: writer
      - name: Prime exact workspace test compilation
        run: cargo test --workspace --no-run --verbose
      - name: Retain compiler-cache primer evidence
        if: ${{ always() }}
        uses: ./.github/actions/summarize-rust-cache
        with:
          phase: pr-gnu-cache-primer

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    needs: gnu-compiler-cache
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Require exact compiler-cache seed
        env:
          PRIMER_RESULT: ${{ needs.gnu-compiler-cache.result }}
        run: test "$PRIMER_RESULT" = success
      - uses: ./.github/actions/setup-rust-workspace
        with:
          components: clippy
          compiler-cache: reader
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Retain clippy compiler-cache evidence
        if: ${{ always() }}
        uses: ./.github/actions/summarize-rust-cache
        with:
          phase: pr-clippy

  workspace-test-shards:
    name: workspace-test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: gnu-compiler-cache
    if: ${{ always() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: conary
          - shard: conary-core-repository
          - shard: conary-core-remaining
          - shard: conary-core-targets
          - shard: remaining
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Require exact compiler-cache seed
        env:
          PRIMER_RESULT: ${{ needs.gnu-compiler-cache.result }}
        run: test "$PRIMER_RESULT" = success
      - uses: ./.github/actions/setup-rust-workspace
        with:
          compiler-cache: reader
      - name: Enable exact ownership-test namespaces
        uses: ./.github/actions/setup-exact-ownership-tests
      - name: Run workspace test shard
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          case "$TEST_SHARD" in
            conary) cargo test -p conary --verbose ;;
            conary-core-repository) cargo test -p conary-core --lib repository:: --verbose ;;
            conary-core-remaining)
              cargo test -p conary-core --lib --verbose -- --skip repository::
              ;;
            conary-core-targets) cargo test -p conary-core --bins --test '*' --verbose ;;
            remaining)
              cargo test --workspace --exclude conary-test \
                --exclude conary --exclude conary-core --verbose
              ;;
            *)
              echo "unknown workspace test shard: $TEST_SHARD" >&2
              exit 1
              ;;
          esac
      - name: Retain workspace-shard compiler-cache evidence
        if: ${{ always() }}
        uses: ./.github/actions/summarize-rust-cache
        with:
          phase: pr-workspace-${{ matrix.shard }}

  workspace-tests:
    name: workspace-tests
    runs-on: ubuntu-latest
    needs: workspace-test-shards
    if: ${{ always() }}
    steps:
      - name: Require every workspace test shard
        env:
          SHARDS_RESULT: ${{ needs.workspace-test-shards.result }}
        run: test "$SHARDS_RESULT" = success

  alpm-parity-producer:
    name: alpm-parity-producer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: docker.io/library/archlinux@sha256:fe6972d4dc1f660c0c10f4c41b2de8986bab89e7e2955378f8beadb8ebcd7433
    steps:
      - name: Install pinned Arch build dependencies
        run: |
          sed -i '/^\[options\]/a DisableDownloadTimeout' /etc/pacman.conf
          printf 'Server = https://archive.archlinux.org/repos/2026/08/02/$repo/os/$arch\n' > /etc/pacman.d/mirrorlist
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel openssl xz libseccomp pkgconf cmake perl clang rustup git
          pacman -Scc --noconfirm
      - name: Install exact Rust toolchain
        run: rustup default 1.98.0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test the libalpm parity producer
        run: cargo test -p conary-core --features native-alpm-oracle repository::catalog::parity::alpm --verbose
      - name: Lint the libalpm parity producer
        run: cargo clippy -p conary-core --features native-alpm-oracle --lib --bin conary-alpm-oracle --bin conary-alpm-resolution-oracle -- -D warnings

  rpm-parity-producer:
    name: rpm-parity-producer
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: registry.fedoraproject.org/fedora@sha256:765b2260aa4b4eff379b9a6f983f15fcf41a6f9dda9b272b790e23e92fcbaafb
    steps:
      - name: Install pinned Fedora build dependencies
        run: dnf -y --disablerepo=updates install gcc gcc-c++ openssl-devel xz-devel libseccomp-devel pkgconf-pkg-config cmake perl clang rustup git libsolv-devel-0.7.36-2.fc44.x86_64
      - name: Install exact Rust toolchain
        run: |
          rustup-init -y --default-toolchain 1.98.0 --profile minimal
          "$HOME/.cargo/bin/rustup" component add clippy
          printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test the libsolv parity producer
        run: cargo test -p conary-core --features native-rpm-oracle repository::catalog::parity::rpm --verbose
      - name: Lint the libsolv parity producer
        run: cargo clippy -p conary-core --features native-rpm-oracle --lib --bin conary-rpm-oracle --bin conary-rpm-resolution-oracle -- -D warnings

  debian-parity-producer:
    name: debian-parity-producer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: docker.io/library/ubuntu:26.04@sha256:678c6550cc43645e08669028bc177f50be4e7c5b8cca677067b1914d4afc7a03
    steps:
      - name: Install pinned Ubuntu build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates build-essential libssl-dev liblzma-dev libseccomp-dev pkg-config cmake perl clang rustup git libapt-pkg-dev=3.2.0
          rm -rf /var/lib/apt/lists/*
      - name: Install exact Rust toolchain
        run: |
          rustup default 1.98.0
          rustup component add clippy
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test the apt-pkg parity producer
        run: cargo test -p conary-core --features native-debian-oracle repository::catalog::parity::debian --verbose
      - name: Lint the apt-pkg parity producer
        run: cargo clippy -p conary-core --features native-debian-oracle --lib --bin conary-debian-oracle --bin conary-debian-resolution-oracle -- -D warnings

  generation-db-reflink:
    name: generation-db-reflink
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: gnu-compiler-cache
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Require exact compiler-cache seed
        env:
          PRIMER_RESULT: ${{ needs.gnu-compiler-cache.result }}
        run: test "$PRIMER_RESULT" = success
      - uses: ./.github/actions/setup-rust-workspace
