name: pr-gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  workflow-runtime-policy:
    name: workflow-runtime-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install shell policy tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Check GitHub Actions runtime policy
        run: bash scripts/check-github-action-runtimes.sh
      - name: Test GitHub Actions runtime policy checker
        run: bash scripts/test-github-action-runtimes.sh

  release-matrix-policy:
    name: release-matrix-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install shell policy tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Check release matrix workflow alignment
        run: bash scripts/check-release-matrix.sh
      - name: Test release matrix policy
        run: bash scripts/test-release-matrix.sh
      - name: Test Remi deploy helper
        run: bash scripts/test-remi-deploy-helper.sh
      - name: Test Remi health probes
        run: bash scripts/test-remi-health.sh
      - name: Test Remi static-site deploy wrapper
        run: bash scripts/test-deploy-sites.sh

  docs-truth:
    name: docs-truth
    runs-on: ubuntu-latest
    env:
      LC_ALL: C
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install shell policy tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Check required shell tools
        run: command -v rg >/dev/null
      - name: Check docs truth invariants
        run: bash scripts/check-doc-truth.sh
      - name: Test docs truth checker
        run: bash scripts/test-doc-truth.sh
      - name: Test agent context tool
        run: bash scripts/test-agent-context.sh
      - name: Validate feature ownership cards
        run: bash scripts/agent-context.sh --validate
      - name: Check support bundle privacy
        run: bash scripts/test-support-bundle.sh

  frontends:
    name: frontends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            web/package-lock.json
      - name: Check and build both SvelteKit frontends
        run: bash scripts/check-frontends.sh

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-rust-workspace
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  dependency-consistency:
    name: dependency-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check Rust dependency consistency
        run: |
          python3 scripts/check-rust-dependency-consistency.py
          python3 scripts/check-third-party-divergence.py
          python3 scripts/test-third-party-divergence.py

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-rust-workspace
        with:
          components: clippy
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  workspace-tests:
    name: workspace-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-rust-workspace
      - name: Enable exact ownership-test namespaces
        uses: ./.github/actions/setup-exact-ownership-tests
      - name: Run workspace tests
        run: cargo test --workspace --exclude conary-test --verbose

  alpm-parity-producer:
    name: alpm-parity-producer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: docker.io/library/archlinux@sha256:fe6972d4dc1f660c0c10f4c41b2de8986bab89e7e2955378f8beadb8ebcd7433
    steps:
      - name: Install pinned Arch build dependencies
        run: |
          printf 'Server = https://archive.archlinux.org/repos/2026/08/02/$repo/os/$arch\n' > /etc/pacman.d/mirrorlist
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel openssl xz libseccomp pkgconf cmake perl clang rustup git
          pacman -Scc --noconfirm
      - name: Install exact Rust toolchain
        run: rustup default 1.98.0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test the libalpm parity producer
        run: cargo test -p conary-core --features native-alpm-oracle repository::catalog::parity::alpm --verbose
      - name: Lint the libalpm parity producer
        run: cargo clippy -p conary-core --features native-alpm-oracle --lib --bin conary-alpm-oracle -- -D warnings

  generation-db-reflink:
    name: generation-db-reflink
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-rust-workspace
      - uses: ./.github/actions/test-generation-db-reflink

  conary-test-crate:
    name: conary-test-crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-rust-workspace
      - name: Test conary-test
        run: cargo test -p conary-test --verbose

  native-cross-source-lifecycle:
    name: native-cross-source-lifecycle (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        distro: [fedora44, ubuntu-26.04, arch, artix, cachyos, opensuse-tumbleweed, linux-mint-22.3, pop-os-24.04]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-rust-workspace
      - name: Require the hosted container runtime
        run: docker info
      - uses: ./.github/actions/build-static-conary
      - name: Build the lifecycle harness
        run: cargo build -p conary -p conary-test
      - uses: ./.github/actions/cache-base-image
        with:
          distro: ${{ matrix.distro }}
      - name: Build the ${{ matrix.distro }} test image
        run: cargo run -p conary-test -- images build --distro "${{ matrix.distro }}"
      - name: Capture the native oracle and run Cartesian lifecycle parity
        env:
          CONARY_TEST_REUSE_IMAGE: "1"
        run: >-
          cargo run -p conary-test --
          run
          --distro "${{ matrix.distro }}"
          --phase 4
          --suite native-cross-source-lifecycle
      - name: Verify attributable corpus evidence
        run: |
          result="apps/conary/tests/integration/remi/results/${{ matrix.distro }}-phase4.json"
          bash scripts/check-conary-test-result-gate.sh "$result"
          bash scripts/check-conary-corpus-result-gate.sh "$result"
      - name: Prove authentic Debian derivative state and native APT behavior
        if: ${{ matrix.distro == 'linux-mint-22.3' || matrix.distro == 'pop-os-24.04' }}
        env:
          CONARY_TEST_REUSE_IMAGE: "1"
        run: >-
          cargo run -p conary-test --
          run
          --distro "${{ matrix.distro }}"
          --phase 4
          --suite debian-derivative-acceptance
      - name: Verify Debian derivative evidence
        if: ${{ matrix.distro == 'linux-mint-22.3' || matrix.distro == 'pop-os-24.04' }}
        run: |
          result="apps/conary/tests/integration/remi/results/${{ matrix.distro }}-phase4.json"
          bash scripts/check-conary-test-result-gate.sh "$result"
          jq -e '
            .target_release.schema_version == 2 and
            .target_release.target_profile == "${{ matrix.distro }}" and
            .target_release.checkout_commit == "${{ github.sha }}" and
            .target_release.checkout_dirty == false and
            (.target_release.stages | all(.passed == true)) and
            ([.target_release.stages[].stage] == [
              "release_identity",
              "package_identity",
              "repository_declarations",
              "conary_runtime"
            ]) and
            ([.target_release.artifacts[].role] |
              index("base_image") != null and
              index("release_media") != null and
              index("keyring_package") != null and
              index("identity_package") != null and
              index("apt_declaration") != null and
              index("signing_root") != null and
              index("conary_executable") != null) and
            ([.target_release.artifacts[] |
              select(.role == "signing_root") |
              (.digest_source == "running_target_bytes" and
               (.fingerprints | length > 0))] | all) and
            ([.target_release.artifacts[] |
              select(.role == "release_media") |
              .digest_source] == ["pinned_release_authority"]) and
            ([.target_release.artifacts[] |
              select(.role == "base_image" or
                     .role == "keyring_package" or
                     .role == "identity_package") |
              .digest_source] | all(. == "pinned_build_input"))
          ' "$result"
      - name: Prove authentic rolling derivative state and native repository behavior
        if: ${{ matrix.distro == 'cachyos' || matrix.distro == 'opensuse-tumbleweed' }}
        env:
          CONARY_TEST_REUSE_IMAGE: "1"
        run: >-
          cargo run -p conary-test --
          run
          --distro "${{ matrix.distro }}"
          --phase 4
          --suite rolling-derivative-acceptance
      - name: Verify rolling derivative evidence
        if: ${{ matrix.distro == 'cachyos' || matrix.distro == 'opensuse-tumbleweed' }}
        run: |
          result="apps/conary/tests/integration/remi/results/${{ matrix.distro }}-phase4.json"
          bash scripts/check-conary-test-result-gate.sh "$result"
          jq -e '
            .target_release.schema_version == 2 and
            .target_release.target_profile == "${{ matrix.distro }}" and
            .target_release.checkout_commit == "${{ github.sha }}" and
            .target_release.checkout_dirty == false and
            (.target_release.packages | length >= 4) and
            (.target_release.stages | all(.passed == true)) and
            ([.target_release.artifacts[].role] |
              index("base_image") != null and
              index("native_repository_declaration") != null and
              index("signing_root") != null and
              index("conary_executable") != null) and
            ([.target_release.artifacts[] |
              select(.role == "native_repository_declaration" or .role == "signing_root") |
              .digest_source] | all(. == "running_target_bytes")) and
            ([.target_release.artifacts[] |
              select(.role == "signing_root") |
              (.fingerprints | length > 0)] | all)
          ' "$result"

  native-cross-source-lifecycle-gate:
    name: native-cross-source-lifecycle
    if: ${{ always() }}
    needs: native-cross-source-lifecycle
    runs-on: ubuntu-latest
    steps:
      - name: Require every distro lifecycle job
        env:
          MATRIX_RESULT: ${{ needs.native-cross-source-lifecycle.result }}
        run: |
          if [[ "$MATRIX_RESULT" != "success" ]]; then
            echo "native cross-source lifecycle matrix result: $MATRIX_RESULT" >&2
            exit 1
          fi

  native-daily-driver-corpus:
    name: native-daily-driver-corpus (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        distro: [fedora44, ubuntu-26.04, arch]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-rust-workspace
      - name: Require the hosted container runtime
        run: docker info
      - uses: ./.github/actions/build-static-conary
      - name: Build the daily-driver harness
        run: cargo build -p conary -p conary-test
      - uses: ./.github/actions/cache-base-image
        with:
          distro: ${{ matrix.distro }}
      - name: Build the ${{ matrix.distro }} daily-driver image
        run: cargo run -p conary-test -- images build --distro "${{ matrix.distro }}"
      - name: Run the attributable daily-driver corpus
        env:
          CONARY_TEST_REUSE_IMAGE: "1"
        run: >-
          cargo run -p conary-test --
          run
          --distro "${{ matrix.distro }}"
          --phase 4
          --suite phase4-native-daily-driver-corpus
      - name: Verify daily-driver corpus evidence
        run: |
          result="apps/conary/tests/integration/remi/results/${{ matrix.distro }}-phase4.json"
          bash scripts/check-conary-test-result-gate.sh "$result"
          bash scripts/check-conary-corpus-result-gate.sh "$result"

  native-daily-driver-corpus-gate:
    name: native-daily-driver-corpus
    if: ${{ always() }}
    needs: native-daily-driver-corpus
    runs-on: ubuntu-latest
    steps:
      - name: Require every daily-driver corpus job
        env:
          MATRIX_RESULT: ${{ needs.native-daily-driver-corpus.result }}
        run: |
          if [[ "$MATRIX_RESULT" != "success" ]]; then
            echo "native daily-driver corpus matrix result: $MATRIX_RESULT" >&2
            exit 1
          fi

  native-pm-parity:
    name: native-pm-parity (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        distro: [fedora44, ubuntu-26.04, arch]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-rust-workspace
      - name: Require the hosted container runtime
        run: docker info
      - uses: ./.github/actions/build-static-conary
      - name: Build the native parity harness
        run: cargo build -p conary -p conary-test
      - uses: ./.github/actions/cache-base-image
        with:
          distro: ${{ matrix.distro }}
      - name: Build the ${{ matrix.distro }} native parity image
        run: cargo run -p conary-test -- images build --distro "${{ matrix.distro }}"
      - name: Prove timed-out exec process groups are terminated and reaped
        env:
          CONARY_TEST_TIMEOUT_IMAGE: conary-test-${{ matrix.distro }}:latest
        run: >-
          cargo test -p conary-test
          container::lifecycle::tests::timed_out_container_exec_terminates_and_reaps_process_group
          -- --ignored --exact
      - name: Run the full deterministic native parity suite
        env:
          CONARY_TEST_REUSE_IMAGE: "1"
        run: >-
          cargo run -p conary-test --
          run
          --distro "${{ matrix.distro }}"
          --phase 4
          --suite phase4-native-pm-parity
      - name: Verify full native parity evidence
        run: |
          result="apps/conary/tests/integration/remi/results/${{ matrix.distro }}-phase4.json"
          bash scripts/check-conary-test-result-gate.sh "$result"

  native-pm-parity-gate:
    name: native-pm-parity
    if: ${{ always() }}
    needs: native-pm-parity
    runs-on: ubuntu-latest
    steps:
      - name: Require every full native parity job
        env:
          MATRIX_RESULT: ${{ needs.native-pm-parity.result }}
        run: |
          if [[ "$MATRIX_RESULT" != "success" ]]; then
            echo "native package-manager parity matrix result: $MATRIX_RESULT" >&2
            exit 1
          fi

  doctests:
    name: doctests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-rust-workspace
      - name: Run doctests
        run: cargo test --doc --workspace --verbose

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Dependency review
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
            head_ref="${{ github.event.pull_request.head.sha }}"
          else
            base_ref="main"
            head_ref="${GITHUB_SHA}"
          fi

          report=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/dependency-graph/compare/${base_ref}...${head_ref}")

          violations=$(jq '
            [
              .[]
              | select(.change_type != "removed")
              | . as $dep
              | [ .vulnerabilities[]?.severity | ascii_downcase ] as $severities
              | select(any($severities[]?; . == "moderate" or . == "high" or . == "critical"))
              | {
                  manifest,
                  ecosystem,
                  name,
                  version,
                  severities: $severities
                }
            ]
          ' <<<"$report")

          if [[ "$(jq 'length' <<<"$violations")" != "0" ]]; then
            echo "Dependency review found vulnerable dependency changes:" >&2
            jq -r '.[] | "- \(.manifest): \(.name)@\(.version) [\(.severities | join(", "))]"' <<<"$violations" >&2
            exit 1
          fi

          echo "Dependency review found no moderate-or-higher vulnerable dependency changes."
