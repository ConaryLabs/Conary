  conary-test-crate:
    name: conary-test-crate
    runs-on: ubuntu-latest
    needs: gnu-compiler-cache
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Require exact compiler-cache seed
