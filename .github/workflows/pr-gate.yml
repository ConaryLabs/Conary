name: pr-gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  workflow-runtime-policy:
    name: workflow-runtime-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install shell policy tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Check GitHub Actions runtime policy
        run: bash scripts/check-github-action-runtimes.sh
      - name: Test GitHub Actions runtime policy checker
        run: bash scripts/test-github-action-runtimes.sh

  release-matrix-policy:
    name: release-matrix-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install shell policy tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Check release matrix workflow alignment
        run: bash scripts/check-release-matrix.sh
      - name: Test release matrix policy
        run: bash scripts/test-release-matrix.sh
      - name: Test Remi deploy helper
        run: bash scripts/test-remi-deploy-helper.sh
      - name: Test Remi static-site deploy wrapper
        run: bash scripts/test-deploy-sites.sh

  docs-truth:
    name: docs-truth
    runs-on: ubuntu-latest
    env:
      LC_ALL: C
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install shell policy tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Check required shell tools
        run: command -v rg >/dev/null
      - name: Check docs truth invariants
        run: bash scripts/check-doc-truth.sh
      - name: Test docs truth checker
        run: bash scripts/test-doc-truth.sh
      - name: Test agent context tool
        run: bash scripts/test-agent-context.sh
      - name: Validate feature ownership cards
        run: bash scripts/agent-context.sh --validate
      - name: Check support bundle privacy
        run: bash scripts/test-support-bundle.sh

  frontends:
    name: frontends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            web/package-lock.json
      - name: Check and build both SvelteKit frontends
        run: bash scripts/check-frontends.sh

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-rust-workspace
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  dependency-consistency:
    name: dependency-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check Rust dependency consistency
        run: python3 scripts/check-rust-dependency-consistency.py

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-rust-workspace
        with:
          components: clippy
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  workspace-tests:
    name: workspace-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-rust-workspace
      - name: Run workspace tests
        run: cargo test --workspace --exclude conary-test --verbose

  conary-test-crate:
    name: conary-test-crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-rust-workspace
      - name: Test conary-test
        run: cargo test -p conary-test --verbose

  native-cross-source-lifecycle:
    name: native-cross-source-lifecycle (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        distro: [fedora44, ubuntu-26.04, arch]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-rust-workspace
      - name: Require the hosted container runtime
        run: docker info
      - name: Build the lifecycle harness
        run: cargo build -p conary -p conary-test
      - name: Build the ${{ matrix.distro }} test image
        run: cargo run -p conary-test -- images build --distro "${{ matrix.distro }}"
      - name: Capture the native oracle and run Cartesian lifecycle parity
        env:
          CONARY_TEST_REUSE_IMAGE: "1"
        run: >-
          cargo run -p conary-test --
          run
          --distro "${{ matrix.distro }}"
          --phase 4
          --suite native-cross-source-lifecycle

  native-cross-source-lifecycle-gate:
    name: native-cross-source-lifecycle
    if: ${{ always() }}
    needs: native-cross-source-lifecycle
    runs-on: ubuntu-latest
    steps:
      - name: Require every distro lifecycle job
        env:
          MATRIX_RESULT: ${{ needs.native-cross-source-lifecycle.result }}
        run: |
          if [[ "$MATRIX_RESULT" != "success" ]]; then
            echo "native cross-source lifecycle matrix result: $MATRIX_RESULT" >&2
            exit 1
          fi

  doctests:
    name: doctests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-rust-workspace
      - name: Run doctests
        run: cargo test --doc --workspace --verbose

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Dependency review
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
            head_ref="${{ github.event.pull_request.head.sha }}"
          else
            base_ref="main"
            head_ref="${GITHUB_SHA}"
          fi

          report=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/dependency-graph/compare/${base_ref}...${head_ref}")

          violations=$(jq '
            [
              .[]
              | select(.change_type != "removed")
              | . as $dep
              | [ .vulnerabilities[]?.severity | ascii_downcase ] as $severities
              | select(any($severities[]?; . == "moderate" or . == "high" or . == "critical"))
              | {
                  manifest,
                  ecosystem,
                  name,
                  version,
                  severities: $severities
                }
            ]
          ' <<<"$report")

          if [[ "$(jq 'length' <<<"$violations")" != "0" ]]; then
            echo "Dependency review found vulnerable dependency changes:" >&2
            jq -r '.[] | "- \(.manifest): \(.name)@\(.version) [\(.severities | join(", "))]"' <<<"$violations" >&2
            exit 1
          fi

          echo "Dependency review found no moderate-or-higher vulnerable dependency changes."
