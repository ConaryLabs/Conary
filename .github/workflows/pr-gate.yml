          finished_ns="$(date -u +%s%N)"
          echo "image_build_ms=$(( (finished_ns - started_ns) / 1000000 ))" >> "$GITHUB_STEP_SUMMARY"
      - name: Prove timed-out exec process groups are terminated and reaped
        env:
