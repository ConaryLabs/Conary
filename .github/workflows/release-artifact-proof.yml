name: release-artifact-proof

on:
  workflow_call:
    inputs:
      tag_name:
        description: Published canonical Conary tag to prove.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Published canonical Conary tag to prove.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-artifact-proof-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  native-package-lifecycle:
    name: native-package-lifecycle (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora44
            native_format: rpm
          - distro: ubuntu-26.04
            native_format: deb
          - distro: arch
            native_format: arch
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-workspace
        with:
          toolchain: 1.98.0
      - name: Require the hosted container runtime
        run: docker info
      - name: Resolve the published native package
        id: release
        shell: bash
        env:
          NATIVE_FORMAT: ${{ matrix.native_format }}
        run: |
          set -euo pipefail

          metadata_dir="${RUNNER_TEMP}/conary-release-metadata"
          mkdir -p "$metadata_dir"

          resolved="$(bash scripts/release-matrix.sh resolve-tag "$RELEASE_TAG" --format shell)"
          release="$(sed -n 's/^release=//p' <<< "$resolved")"
          resolved_tag="$(sed -n 's/^tag_name=//p' <<< "$resolved")"
          resolved_version="$(sed -n 's/^version=//p' <<< "$resolved")"
          [[ "$release" == "suite" && "$resolved_tag" == "$RELEASE_TAG" ]] || {
            echo "tag does not resolve to the canonical Conary suite release" >&2
            exit 1
          }

          git fetch --force origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          [[ "$(git cat-file -t "$RELEASE_TAG")" == "tag" ]] || {
            echo "${RELEASE_TAG} is not an annotated tag" >&2
            exit 1
          }
          tag_tree="${RUNNER_TEMP}/conary-release-tag"
          git worktree add --detach "$tag_tree" "${RELEASE_TAG}^{}"

          release_state="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GH_REPO}/releases/tags/${RELEASE_TAG}"
          )"
          [[ "$(jq -r '.tag_name' <<< "$release_state")" == "$RELEASE_TAG" &&
             "$(jq -r '.draft' <<< "$release_state")" == "false" &&
             "$(jq -r '.immutable' <<< "$release_state")" == "true" ]] || {
            echo "${RELEASE_TAG} is not an exact published immutable GitHub release" >&2
            exit 1
          }

          gh release download "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --pattern metadata.json \
            --dir "$metadata_dir"

          metadata="${metadata_dir}/metadata.json"
          [[ -s "$metadata" && ! -L "$metadata" ]] || {
            echo "release metadata is missing, empty, or symlinked" >&2
            exit 1
          }
          jq -e '.schema_version == 1 and (.dry_run | type) == "boolean"' "$metadata" >/dev/null || {
            echo "release metadata must use schema_version 1 and a boolean dry_run" >&2
            exit 1
          }

          release="$(jq -r '.release' "$metadata")"
          tag_name="$(jq -r '.tag_name' "$metadata")"
          version="$(jq -r '.version' "$metadata")"
          dry_run="$(jq -r '.dry_run' "$metadata")"
          [[ "$release" == "suite" ]] || {
            echo "release metadata release is ${release}, expected suite" >&2
            exit 1
          }
          [[ "$tag_name" == "$RELEASE_TAG" ]] || {
            echo "release metadata tag is ${tag_name}, expected ${RELEASE_TAG}" >&2
            exit 1
          }
          [[ "$version" == "$resolved_version" ]] || {
            echo "release metadata version is ${version}, expected ${resolved_version} from ${RELEASE_TAG}" >&2
            exit 1
          }
          [[ "$dry_run" == "false" ]] || {
            echo "release metadata is not a live publication" >&2
            exit 1
          }
          bash "$tag_tree/scripts/release-matrix.sh" assert-owned-version suite "$version"

          case "$NATIVE_FORMAT" in
            rpm) asset="conary-${version}-1.fc44.x86_64.rpm" ;;
            deb) asset="conary_${version}-1_amd64.deb" ;;
            arch) asset="conary-${version}-1-x86_64.pkg.tar.zst" ;;
            *)
              echo "unsupported native package format: ${NATIVE_FORMAT}" >&2
              exit 1
              ;;
          esac

          release_dir="${RUNNER_TEMP}/conary-release-${NATIVE_FORMAT}"
          mkdir -p "$release_dir"
          gh release download "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --pattern SHA256SUMS \
            --pattern "$asset" \
            --dir "$release_dir"
          cp "$metadata" "$release_dir/metadata.json"

          package="${release_dir}/${asset}"
          checksums="${release_dir}/SHA256SUMS"
          [[ -s "$package" && ! -L "$package" ]] || {
            echo "published native package is missing, empty, or symlinked" >&2
            exit 1
          }
          [[ -s "$checksums" && ! -L "$checksums" ]] || {
            echo "published SHA256SUMS is missing, empty, or symlinked" >&2
            exit 1
          }

          (
            cd "$release_dir"
            sha256sum -c SHA256SUMS --ignore-missing
          )

          actual_digest="sha256:$(sha256sum "$package" | awk '{print $1}')"
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json assets)"
          published_digest="$(
            jq -r --arg asset "$asset" \
              '.assets[] | select(.name == $asset) | .digest' \
              <<< "$release_json"
          )"
          [[ "$published_digest" == "$actual_digest" ]] || {
            echo "GitHub digest ${published_digest} does not match ${actual_digest}" >&2
            exit 1
          }

          echo "native_package=${package}" >> "$GITHUB_OUTPUT"
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/build-static-conary
      - name: Build the lifecycle harness
        run: cargo build -p conary -p conary-test
      - name: Prove the signed bootstrap in a clean supported host
        shell: bash
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail

          base_ref="$(target/debug/conary-test images base-ref --distro "$DISTRO")"
          manifest_url="https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}/conary-bootstrap-v1.manifest"

          docker run --rm --privileged \
            --volume "$PWD/site/static/install-conary-preview.sh:/tmp/install-conary-preview.sh:ro" \
            --env "MANIFEST_URL=$manifest_url" \
            --env "DISTRO=$DISTRO" \
            "$base_ref" \
            /bin/bash -euo pipefail -c '
              case "$DISTRO" in
                fedora44)
                  dnf install -y curl openssl sudo ca-certificates
                  ;;
                ubuntu-26.04)
                  apt-get update
                  DEBIAN_FRONTEND=noninteractive apt-get install -y curl openssl sudo ca-certificates
                  ;;
                arch)
                  pacman -Sy --noconfirm curl openssl sudo ca-certificates
                  ;;
                *)
                  echo "unsupported release bootstrap proof target: $DISTRO" >&2
                  exit 1
                  ;;
              esac
              /tmp/install-conary-preview.sh --manifest-url "$MANIFEST_URL" --apply --yes
            '
      - uses: ./.github/actions/cache-base-image
        with:
          distro: ${{ matrix.distro }}
      - name: Install the published native package in the test image
        run: >-
          cargo run -p conary-test --
          images build
          --distro "${{ matrix.distro }}"
          --native-package "${{ steps.release.outputs.native_package }}"
      - name: Run Cartesian lifecycle parity with the published binary
        env:
          CONARY_TEST_REUSE_IMAGE: "1"
        run: >-
          cargo run -p conary-test --
          run
          --distro "${{ matrix.distro }}"
          --phase 4
          --suite native-cross-source-lifecycle
      - name: Verify attributable published-binary corpus evidence
        run: |
          result="apps/conary/tests/integration/remi/results/${{ matrix.distro }}-phase4.json"
          bash scripts/check-conary-test-result-gate.sh "$result"
          bash scripts/check-conary-corpus-result-gate.sh "$result"

  release-artifact-proof:
    name: release-artifact-proof
    if: ${{ always() }}
    needs: native-package-lifecycle
    runs-on: ubuntu-latest
    steps:
      - name: Require every published-package lifecycle job
        env:
          MATRIX_RESULT: ${{ needs.native-package-lifecycle.result }}
        run: |
          if [[ "$MATRIX_RESULT" != "success" ]]; then
            echo "published native package lifecycle matrix result: $MATRIX_RESULT" >&2
            exit 1
          fi
          echo "published native package lifecycle matrix result: $MATRIX_RESULT"
