name: deploy-remi-candidate

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact commit already merged into main to deploy.
        required: true
        type: string
      completion_mode:
        description: Exact deployment state that this run must prove.
        required: true
        type: choice
        options:
          - private-candidates
          - active-repopulation

permissions:
  contents: read

concurrency:
  group: deploy-and-verify
  cancel-in-progress: false

jobs:
  deploy-remi-candidate:
    name: deploy-remi-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require an exact commit already merged into main
        env:
          CANDIDATE_SHA: ${{ github.event.inputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "commit_sha must be a full lowercase commit SHA" >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]] || {
            echo "checkout does not match requested candidate SHA" >&2
            exit 1
          }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main || {
            echo "candidate must already be merged into origin/main" >&2
            exit 1
          }
      - uses: ./.github/actions/setup-rust-workspace
      - name: Build exact Remi candidate bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p remi --release --locked
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "remi") | .version')"
          [[ -n "$version" && "$version" != "null" ]] || {
            echo "failed to resolve Remi package version" >&2
            exit 1
          }
          candidate="remi-${version}-linux-x64"
          cp target/release/remi "$candidate"
          tar czf "${candidate}.tar.gz" "$candidate"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bundle=${candidate}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "binary_sha256=$(sha256sum "$candidate" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Deploy merged Remi candidate
        env:
          VERSION: ${{ steps.bundle.outputs.version }}
          BUNDLE: ${{ steps.bundle.outputs.bundle }}
          REMI_SSH_KEY: ${{ secrets.REMI_SSH_KEY }}
          REMI_SSH_TARGET: ${{ secrets.REMI_SSH_TARGET }}
          REMI_MAX_CONCURRENT: 32
          COMPLETION_MODE: ${{ github.event.inputs.completion_mode }}
          CANDIDATE_SHA: ${{ github.event.inputs.commit_sha }}
          BINARY_SHA256: ${{ steps.bundle.outputs.binary_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${REMI_SSH_KEY:-}" ]] || {
            echo "REMI_SSH_KEY is required" >&2
            exit 1
          }
          case "$COMPLETION_MODE" in
            private-candidates|active-repopulation) ;;
            *)
              echo "unsupported completion_mode: $COMPLETION_MODE" >&2
              exit 1
              ;;
          esac

          target="${REMI_SSH_TARGET:-peter@ssh.conary.io}"
          mkdir -p ~/.ssh
          trap 'rm -f ~/.ssh/remi_key' EXIT
          echo "$REMI_SSH_KEY" > ~/.ssh/remi_key
          chmod 600 ~/.ssh/remi_key
          ssh-keyscan -H "${target#*@}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh_opts="-i ~/.ssh/remi_key -o StrictHostKeyChecking=accept-new"

          remote_bundle="/tmp/remi-${VERSION}-${GITHUB_RUN_ID}.tar.gz"
          remote_repositories="/tmp/remi-repositories-${GITHUB_RUN_ID}.toml"
          remote_helper="/tmp/remi-deploy-helper-${GITHUB_RUN_ID}"
          helper_sha="$(sha256sum deploy/remi-deploy-helper.sh | cut -d ' ' -f 1)"

          ssh $ssh_opts "$target" "sudo -n /usr/local/sbin/conary-remi-deploy verify-access"
          scp $ssh_opts deploy/remi-deploy-helper.sh "${target}:${remote_helper}"
          ssh $ssh_opts "$target" \
            "sudo -n /usr/local/sbin/conary-remi-deploy install-helper '$helper_sha' '$remote_helper'"
          if [[ "$COMPLETION_MODE" == "private-candidates" ]]; then
            ssh $ssh_opts "$target" \
              "sudo -n /usr/local/sbin/conary-remi-deploy inspect-remi" \
              > remi-predeployment-inspection.json
            jq -e '
              (.schema_epoch | type == "string")
              and (.schema_revision | type == "number")
              and (.candidates | type == "array")
              and all(.candidates[];
                (.profile == "fedora-44"
                  or .profile == "ubuntu-26.04"
                  or .profile == "arch")
                and (.profile_revision_sha256 | type == "string")
                and (.run_id | type == "string")
                and (.latest_refresh == null or
                  ((.latest_refresh.run_id | type == "string")
                  and (.latest_refresh.fencing_epoch | type == "number")
                  and (.latest_refresh.started_at | type == "number")))
              )
            ' remi-predeployment-inspection.json >/dev/null
          fi
          scp $ssh_opts "$BUNDLE" "${target}:${remote_bundle}"
          scp $ssh_opts deploy/remi-repositories.toml "${target}:${remote_repositories}"
          set +e
          ssh $ssh_opts "$target" bash -s \
            "$VERSION" "$remote_bundle" "$remote_repositories" "$REMI_MAX_CONCURRENT" \
            "$COMPLETION_MODE" "$CANDIDATE_SHA" "$BINARY_SHA256" \
            > remi-deployment-inspection.json <<'REMOTE_EOF'
            set -euo pipefail
            completion_mode="$5"
            deployed_commit_sha="$6"
            deployed_binary_sha256="$7"
            [[ "$deployed_commit_sha" =~ ^[0-9a-f]{40}$ ]] || {
              echo "candidate commit is not a canonical SHA" >&2
              exit 1
            }
            [[ "$deployed_binary_sha256" =~ ^[0-9a-f]{64}$ ]] || {
              echo "candidate binary digest is not a canonical SHA-256" >&2
              exit 1
            }
            sudo -n /usr/local/sbin/conary-remi-deploy deploy-remi "$1" "$2" "$3" "$4" >&2
            transition_completed_at="$(date -u +%s)"
            sudo -n /usr/local/sbin/conary-remi-deploy verify-ingress >&2
            emit_inspection() {
              jq -c \
                --arg commit_sha "$deployed_commit_sha" \
                --arg binary_sha256 "$deployed_binary_sha256" \
                --arg completion_mode "$completion_mode" \
                --argjson transition_completed_at "$transition_completed_at" '
                  . + {
                    deployment_evidence_schema_version: 1,
                    deployment: {
                      commit_sha: $commit_sha,
                      binary_sha256: $binary_sha256,
                      completion_mode: $completion_mode,
                      transition_completed_at: $transition_completed_at
                    }
                  }
                '
            }
            case "$completion_mode" in
              private-candidates)
                requirement=--require-private-candidates
                description="post-deploy private profile candidates"
                sleep 1
                set +e
                refresh="$(curl --fail-with-body --silent --show-error \
                  --connect-timeout 30 --max-time 7200 --request POST \
                  'http://127.0.0.1:8081/v1/admin/refresh?force=true')"
                refresh_status=$?
                set -e
                if (( refresh_status != 0 )) || ! jq -e '
                  .force == true
                  and (.synced | type == "number")
                  and (.skipped | type == "number")
                  and (.failed | type == "number")
                  and (.results | type == "array")
                  and (.failures | type == "array")
                  and .failed == (.failures | length)
                  and (
                    (.status == "complete" and .failed == 0)
                    or (.status == "partial"
                      and .failed > 0
                      and all(.failures[]; .source_profile == "solus"))
                  )
                ' <<<"$refresh" >/dev/null; then
                  echo "post-deploy forced candidate refresh failed" >&2
                  jq -c '{status, force, synced, skipped, failed}' \
                    <<<"$refresh" >&2 || true
                  sudo -n /usr/local/sbin/conary-remi-deploy inspect-remi \
                    | emit_inspection
                  exit 1
                fi
                jq -c '{status, force, synced, skipped, failed}' \
                  <<<"$refresh" >&2
                if ! inspection="$(sudo -n /usr/local/sbin/conary-remi-deploy \
                  inspect-remi "$requirement" 2>&1)"; then
                  sudo -n /usr/local/sbin/conary-remi-deploy inspect-remi \
                    | emit_inspection
                  echo "Remi ${description} are incomplete after the forced refresh" >&2
                  exit 1
                fi
                sudo -n /usr/local/sbin/conary-remi-deploy verify-ingress >&2
                emit_inspection <<<"$inspection"
                exit 0
                ;;
              active-repopulation)
                requirement=--require-repopulated
                description="active profile universe and conversions"
                ;;
              *)
                echo "unsupported completion mode: $completion_mode" >&2
                exit 1
                ;;
            esac
            for attempt in $(seq 1 120); do
              if inspection="$(sudo -n /usr/local/sbin/conary-remi-deploy \
                inspect-remi "$requirement" 2>&1)"; then
                sudo -n /usr/local/sbin/conary-remi-deploy verify-ingress >&2
                emit_inspection <<<"$inspection"
                exit 0
              fi
              echo "Remi ${description} are still incomplete (${attempt}/120)" >&2
              if (( attempt < 120 )); then
                sleep 30
              fi
            done
            sudo -n /usr/local/sbin/conary-remi-deploy inspect-remi \
              | emit_inspection
            echo "Remi did not complete ${description} within one hour" >&2
            exit 1
          REMOTE_EOF
          deploy_status=$?
          set -e
          [[ -s remi-deployment-inspection.json \
            && ! -L remi-deployment-inspection.json ]] || {
              echo "deployment did not return a final typed inspection" >&2
              exit 1
          }
          jq -e \
            --arg expected_commit "$CANDIDATE_SHA" \
            --arg expected_binary "$BINARY_SHA256" \
            --arg expected_mode "$COMPLETION_MODE" '
            .deployment_evidence_schema_version == 1
            and .deployment.commit_sha == $expected_commit
            and .deployment.binary_sha256 == $expected_binary
            and .deployment.completion_mode == $expected_mode
            and (.deployment.transition_completed_at | type == "number")
            and (.schema_epoch | type == "string")
            and (.schema_revision | type == "number")
            and (.configured_profiles | type == "number")
            and (.candidate_profiles | type == "number")
            and (.candidates | type == "array")
            and all(.candidates[];
              (.profile == "fedora-44"
                or .profile == "ubuntu-26.04"
                or .profile == "arch")
              and (.configured_sources | type == "number")
              and (.packages | type == "number")
              and (.latest_refresh == null or (
                (.latest_refresh.run_id | type == "string")
                and (.latest_refresh.fencing_epoch | type == "number")
                and (.latest_refresh.state | type == "string")
                and (.latest_refresh.run_members | type == "number")
                and (.latest_refresh.candidate_members | type == "number")
                and (.latest_refresh.redactions | type == "array")
              ))
            )
          ' remi-deployment-inspection.json >/dev/null
          if [[ "$COMPLETION_MODE" == "private-candidates" \
            && "$deploy_status" -eq 0 ]]; then
            jq -e --slurpfile baseline remi-predeployment-inspection.json '
              def fencing_epoch($inspection; $profile):
                ([
                  $inspection.candidates[]?
                  | select(.profile == $profile)
                  | .latest_refresh.fencing_epoch
                ] | first) // -1;
              . as $final
              | $baseline[0] as $before
              | ["fedora-44", "ubuntu-26.04", "arch"] as $profiles
              | all($profiles[];
                  . as $profile
                  | ([
                      $final.candidates[]
                      | select(.profile == $profile)
                    ] | length) == 1
                    and ($final.candidates[]
                      | select(.profile == $profile)
                      | (.profile_revision_sha256 | test("^[0-9a-f]{64}$"))
                        and (.run_id | type == "string")
                        and (.latest_refresh.run_id == .run_id)
                        and (.latest_refresh.state == "candidate")
                        and (.latest_refresh.finished_at | type == "number")
                        and (.latest_refresh.started_at
                          > $final.deployment.transition_completed_at))
                    and fencing_epoch($final; $profile)
                      > fencing_epoch($before; $profile)
                )
            ' remi-deployment-inspection.json >/dev/null || {
              echo "private candidates do not come from post-deploy fenced refreshes" >&2
              exit 1
            }
          fi
          if (( deploy_status != 0 )); then
            echo "Remi deployment completion failed; final sanitized inspection retained" >&2
            exit "$deploy_status"
          fi
      - name: Summarize final typed deployment inspection
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -s remi-deployment-inspection.json \
            && ! -L remi-deployment-inspection.json ]]; then
            {
              echo "### Final typed Remi inspection"
              echo
              jq -r '
                .candidates[] |
                "- \(.profile): candidate `\(.profile_revision_sha256 // "absent")`; "
                + "packages \(.packages); latest refresh `\(.latest_refresh.state // "none")`; "
                + "stage `\(.latest_refresh.failure_stage // "none")`; "
                + "category `\(.latest_refresh.failure_category // "none")`; "
                + "members \(.latest_refresh.candidate_members // 0)/\(.latest_refresh.run_members // 0); "
                + "evidence `\(.latest_refresh.failure_evidence_sha256 // "none")`"
              ' remi-deployment-inspection.json
              if [[ -s remi-predeployment-inspection.json \
                && ! -L remi-predeployment-inspection.json ]]; then
                echo
                echo "Post-deploy fencing advances:"
                jq -r --slurpfile final remi-deployment-inspection.json '
                  def epoch($inspection; $profile):
                    ([
                      $inspection.candidates[]?
                      | select(.profile == $profile)
                      | .latest_refresh.fencing_epoch
                    ] | first) // -1;
                  . as $before
                  | $final[0] as $after
                  | ["fedora-44", "ubuntu-26.04", "arch"][] as $profile
                  | "- \($profile): epoch \(epoch($before; $profile)) -> "
                    + "\(epoch($after; $profile))"
                ' remi-predeployment-inspection.json
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload final sanitized deployment inspection
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: remi-deployment-inspection-${{ github.run_id }}
          path: |
            remi-deployment-inspection.json
            remi-predeployment-inspection.json
          if-no-files-found: warn
          retention-days: 30
      - name: Verify the selected Remi completion contract
        env:
          COMPLETION_MODE: ${{ github.event.inputs.completion_mode }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://remi.conary.io/health >/dev/null
          if [[ "$COMPLETION_MODE" == "active-repopulation" ]]; then
            body="$(curl -fsS --max-time 30 https://remi.conary.io/health/ready)"
            echo "$body"
            jq -e '.ready == true' <<<"$body" >/dev/null
          else
            ready_body="$(mktemp)"
            trap 'rm -f "$ready_body"' EXIT
            ready_status="$(curl -sS --max-time 30 -o "$ready_body" -w '%{http_code}' \
              https://remi.conary.io/health/ready)"
            [[ "$ready_status" == "200" || "$ready_status" == "503" ]]
            jq -e '.ready | type == "boolean"' "$ready_body" >/dev/null
            cat "$ready_body"
          fi
      - name: Record exact candidate evidence
        env:
          CANDIDATE_SHA: ${{ github.event.inputs.commit_sha }}
          VERSION: ${{ steps.bundle.outputs.version }}
          BINARY_SHA256: ${{ steps.bundle.outputs.binary_sha256 }}
          COMPLETION_MODE: ${{ github.event.inputs.completion_mode }}
        shell: bash
        run: |
          {
            echo "### Merged Remi candidate deployment"
            echo
            echo "- commit: \`$CANDIDATE_SHA\`"
            echo "- binary version: \`$VERSION\`"
            echo "- binary SHA-256: \`$BINARY_SHA256\`"
            echo "- completion mode: \`$COMPLETION_MODE\`"
            if [[ "$COMPLETION_MODE" == "private-candidates" ]]; then
              echo "- candidate refresh: forced after binary transition; every public fencing epoch advanced"
            fi
            echo "- release/tag created: no"
          } >> "$GITHUB_STEP_SUMMARY"
