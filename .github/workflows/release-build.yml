name: release-build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: Synchronized suite tag to model for this build.
        required: true
      dry_run:
        description: Skip live publication side effects.
        required: false
        default: "true"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.meta.outputs.release }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      version: ${{ steps.meta.outputs.version }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      bundle_name: ${{ steps.meta.outputs.bundle_name }}
      deploy_mode: ${{ steps.meta.outputs.deploy_mode }}
      artifact_patterns: ${{ steps.meta.outputs.artifact_patterns }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          DISPATCH_TAG_NAME: ${{ github.event.inputs.tag_name }}
          DISPATCH_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag_name="$DISPATCH_TAG_NAME"
            dry_run="${DISPATCH_DRY_RUN:-true}"
          else
            tag_name="${GITHUB_REF#refs/tags/}"
            dry_run="false"
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "$dry_run" != "true" ]]; then
            echo "workflow_dispatch is dry-run only; push the canonical tag for live releases" >&2
            exit 1
          fi

          mkdir -p release-metadata
          bash scripts/release-matrix.sh resolve-tag "$tag_name" --format shell > release-metadata/resolved.env
          source release-metadata/resolved.env

          if [[ "$dry_run" != "true" ]]; then
            [[ "$(git cat-file -t "refs/tags/${tag_name}")" == "tag" ]] || {
              echo "live suite tag ${tag_name} must be annotated" >&2
              exit 1
            }
            [[ "$(git rev-parse HEAD)" == "$(git rev-parse "refs/tags/${tag_name}^{}")" ]] || {
              echo "checkout does not match the peeled suite tag ${tag_name}" >&2
              exit 1
            }
            git fetch --no-tags origin \
              refs/heads/main:refs/remotes/origin/main
            git merge-base --is-ancestor "refs/tags/${tag_name}^{}" origin/main || {
              echo "live suite tag ${tag_name} is not reachable from origin/main" >&2
              exit 1
            }
            bash scripts/release-matrix.sh assert-owned-version "$release" "$version"
          fi

          bash scripts/release-matrix.sh metadata-json "$release" "$version" "$tag_name" "$dry_run" > release-metadata/metadata.json
          artifact_patterns="$(jq -c '.artifact_patterns' release-metadata/metadata.json)"

          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${dry_run}" >> "$GITHUB_OUTPUT"
          echo "bundle_name=${bundle_name}" >> "$GITHUB_OUTPUT"
          echo "deploy_mode=${deploy_mode}" >> "$GITHUB_OUTPUT"
          echo "artifact_patterns=${artifact_patterns}" >> "$GITHUB_OUTPUT"

      - name: Upload release metadata
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-metadata
          path: release-metadata/metadata.json
          if-no-files-found: error
          retention-days: 5

  workspace-validation:
    name: workspace-validation
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-rust-workspace
        with:
          components: clippy,rustfmt
          toolchain: 1.98.0
      - name: Enable exact ownership-test namespaces
        uses: ./.github/actions/setup-exact-ownership-tests
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run workspace tests
        run: cargo test --workspace --exclude conary-test --verbose
      - name: Test conary-test
        run: cargo test -p conary-test --verbose
      - name: Run doctests
        run: cargo test --doc --workspace --verbose

  build-ccs:
    name: build-ccs
    needs: [prepare, workspace-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.0
      - name: Cache cargo
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
      - name: Install build dependencies
        run: >-
          bash scripts/ci-install-ubuntu-packages.sh
          libssl-dev liblzma-dev libseccomp-dev pkg-config cmake
      - name: Prepare dry-run release tree
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          release: ${{ needs.prepare.outputs.release }}
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          version: ${{ needs.prepare.outputs.version }}
          dry_run: ${{ needs.prepare.outputs.dry_run }}
          CONARY_RELEASE_LOCKFILE_MODE: online
        run: |
          set -euo pipefail
          if [[ "$dry_run" != "true" ]]; then
            echo "workflow_dispatch is dry-run only; push the canonical tag for live releases" >&2
            exit 1
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$(pwd)"
          ./scripts/release.sh "$release" --prepare-only --target "$version"
          [[ "$tag_name" == "v${version}" ]]
          bash scripts/release-matrix.sh assert-owned-version "$release" "$version"
      - name: Build CCS package
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          DRY_RUN_SIGNING_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              export RELEASE_SIGNING_KEY="$DRY_RUN_SIGNING_KEY"
              echo "[DRY RUN] RELEASE_SIGNING_KEY not set; using deterministic dry-run signing key"
            else
              echo "RELEASE_SIGNING_KEY must be configured for embedded CCS release authority" >&2
              exit 1
            fi
          fi

          cargo build \
            --example sign_hash \
            --manifest-path crates/conary-core/Cargo.toml \
            --release \
            --target-dir target
          authority_dir="$(mktemp -d)"
          trap 'rm -rf -- "$authority_dir"' EXIT
          target/release/examples/sign_hash --write-ccs-authority "$authority_dir"
          bash packaging/ccs/build.sh \
            --version "$VERSION" \
            --key "$authority_dir/release.private"
          target/release/conary ccs verify \
            "packaging/ccs/output/conary-${VERSION}.ccs" \
            --policy "$authority_dir/trust-policy.toml"
      - name: Upload CCS artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ccs-package
          path: packaging/ccs/output/*.ccs
          if-no-files-found: error
          retention-days: 5
      - name: Upload signing helper
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sign-hash
          path: target/release/examples/sign_hash
          if-no-files-found: error
          retention-days: 5

  build-rpm:
    name: build-rpm
    needs: [prepare, workspace-validation]
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora@sha256:765b2260aa4b4eff379b9a6f983f15fcf41a6f9dda9b272b790e23e92fcbaafb
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y rpm-build openssl-devel xz-devel libseccomp-devel pkg-config gcc cmake perl clang systemd-rpm-macros curl git \
          && dnf clean all
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
            -o /tmp/rustup-init
          echo '20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init' | sha256sum -c -
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --default-toolchain 1.98.0 --profile minimal
          rm -f /tmp/rustup-init
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Prepare dry-run release tree
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          release: ${{ needs.prepare.outputs.release }}
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          version: ${{ needs.prepare.outputs.version }}
          dry_run: ${{ needs.prepare.outputs.dry_run }}
          CONARY_RELEASE_LOCKFILE_MODE: online
        run: |
          set -euo pipefail
          if [[ "$dry_run" != "true" ]]; then
            echo "workflow_dispatch is dry-run only; push the canonical tag for live releases" >&2
            exit 1
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$(pwd)"
          ./scripts/release.sh "$release" --prepare-only --target "$version"
          [[ "$tag_name" == "v${version}" ]]
          bash scripts/release-matrix.sh assert-owned-version "$release" "$version"
      - name: Build RPM
        run: bash packaging/rpm/build.sh
      - name: Upload RPM artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rpm-package
          path: packaging/rpm/output/*.rpm
          if-no-files-found: error
          retention-days: 5

  build-deb:
    name: build-deb
    needs: [prepare, workspace-validation]
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/ubuntu@sha256:3131b4cc82a783df6c9df078f86e01819a13594b865c2cad47bd1bca2b7063bb
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            build-essential dpkg-dev debhelper libssl-dev liblzma-dev libseccomp-dev \
            pkg-config cmake perl libclang-dev curl ca-certificates git \
          && rm -rf /var/lib/apt/lists/*
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
            -o /tmp/rustup-init
          echo '20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init' | sha256sum -c -
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --default-toolchain 1.98.0 --profile minimal
          rm -f /tmp/rustup-init
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Prepare dry-run release tree
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          release: ${{ needs.prepare.outputs.release }}
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          version: ${{ needs.prepare.outputs.version }}
          dry_run: ${{ needs.prepare.outputs.dry_run }}
          CONARY_RELEASE_LOCKFILE_MODE: online
        run: |
          set -euo pipefail
          if [[ "$dry_run" != "true" ]]; then
            echo "workflow_dispatch is dry-run only; push the canonical tag for live releases" >&2
            exit 1
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$(pwd)"
          ./scripts/release.sh "$release" --prepare-only --target "$version"
          [[ "$tag_name" == "v${version}" ]]
          bash scripts/release-matrix.sh assert-owned-version "$release" "$version"
      - name: Build DEB
        run: bash packaging/deb/build.sh
      - name: Upload DEB artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: deb-package
          path: packaging/deb/output/*.deb
          if-no-files-found: error
          retention-days: 5

  build-arch:
    name: build-arch
    needs: [prepare, workspace-validation]
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/archlinux@sha256:fe6972d4dc1f660c0c10f4c41b2de8986bab89e7e2955378f8beadb8ebcd7433
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel openssl xz libseccomp pkg-config cmake perl clang rustup git
          pacman -Scc --noconfirm
      - name: Set up build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
      - name: Install Rust toolchain
        run: |
          rustup default 1.98.0
          runuser -u builder -- rustup default 1.98.0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Prepare dry-run release tree
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          release: ${{ needs.prepare.outputs.release }}
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          version: ${{ needs.prepare.outputs.version }}
          dry_run: ${{ needs.prepare.outputs.dry_run }}
          CONARY_RELEASE_LOCKFILE_MODE: online
        run: |
          set -euo pipefail
          if [[ "$dry_run" != "true" ]]; then
            echo "workflow_dispatch is dry-run only; push the canonical tag for live releases" >&2
            exit 1
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$(pwd)"
          ./scripts/release.sh "$release" --prepare-only --target "$version"
          [[ "$tag_name" == "v${version}" ]]
          bash scripts/release-matrix.sh assert-owned-version "$release" "$version"
      - name: Fix ownership for makepkg
        run: chown -R builder:builder .
      - name: Build Arch package
        run: runuser -u builder -- bash packaging/arch/build.sh
      - name: Upload Arch artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: arch-package
          path: packaging/arch/output/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 5

  bundle-conary:
    name: bundle-conary
    needs: [prepare, workspace-validation, build-ccs, build-rpm, build-deb, build-arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
      - name: Collect artifacts and checksums
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          set -euo pipefail

          mkdir -p release-packages
          find release-artifacts -type f \
            \( -name '*.ccs' -o -name '*.rpm' -o -name '*.deb' -o -name '*.pkg.tar.zst' \) \
            -exec cp {} release-packages/ \;
          cp release-artifacts/release-metadata/metadata.json release-packages/metadata.json

          require_exact_asset() {
            local label="$1"
            local expected="$2"
            shift 2
            local -a matches=("$@")

            if [[ ${#matches[@]} -ne 1 || "${matches[0]:-}" != "$expected" || ! -s "$expected" || -L "$expected" ]]; then
              echo "expected exactly one ${label} asset at ${expected}; found ${#matches[@]} matching files" >&2
              exit 1
            fi
          }

          shopt -s nullglob
          require_exact_asset CCS \
            "release-packages/conary-${VERSION}.ccs" \
            release-packages/*.ccs
          require_exact_asset RPM \
            "release-packages/conary-${VERSION}-1.fc44.x86_64.rpm" \
            release-packages/*.rpm
          require_exact_asset DEB \
            "release-packages/conary_${VERSION}-1_amd64.deb" \
            release-packages/*.deb
          require_exact_asset Arch \
            "release-packages/conary-${VERSION}-1-x86_64.pkg.tar.zst" \
            release-packages/*.pkg.tar.zst

          bash scripts/bootstrap-manifest.sh \
            "$TAG_NAME" \
            "$VERSION" \
            release-packages \
            release-packages/conary-bootstrap-v1.manifest

          cd release-packages
          sha256sum -- * > SHA256SUMS
      - name: Sign release bootstrap manifest and CCS package
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          DRY_RUN_SIGNING_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
        run: |
          set -euo pipefail
          chmod +x release-artifacts/sign-hash/sign_hash
          CCS_FILE="release-packages/conary-${VERSION}.ccs"
          BOOTSTRAP_MANIFEST="release-packages/conary-bootstrap-v1.manifest"
          if [[ ! -s "$CCS_FILE" || -L "$CCS_FILE" ]]; then
            echo "Expected CCS package not found at $CCS_FILE" >&2
            exit 1
          fi
          if [[ ! -s "$BOOTSTRAP_MANIFEST" || -L "$BOOTSTRAP_MANIFEST" ]]; then
            echo "Expected bootstrap manifest not found at $BOOTSTRAP_MANIFEST" >&2
            exit 1
          fi
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              export RELEASE_SIGNING_KEY="$DRY_RUN_SIGNING_KEY"
              echo "[DRY RUN] RELEASE_SIGNING_KEY not set; using deterministic dry-run signing key"
            else
              echo "RELEASE_SIGNING_KEY must be configured for conary releases" >&2
              exit 1
            fi
          fi
          if [ "$DRY_RUN" != "true" ]; then
            signing_public_key="$(release-artifacts/sign-hash/sign_hash --show-public-key)"
            trusted_update_keys="$(
              {
                sed -n '/pub const TRUSTED_UPDATE_KEYS/,/];/p' crates/conary-core/src/self_update.rs |
                  grep -Eo '"[0-9a-f]{64}"' |
                  tr -d '"'
              } || true
            )"
            if [[ -z "$trusted_update_keys" ]] || ! grep -Fxq "$signing_public_key" <<< "$trusted_update_keys"; then
              echo "release signing key does not match an embedded trusted update key" >&2
              exit 1
            fi
          fi
          if [ "$DRY_RUN" = "true" ]; then
            release-artifacts/sign-hash/sign_hash --show-public-key > release-packages/REHEARSAL_SIGNING_PUBLIC_KEY.txt
          fi
          release-artifacts/sign-hash/sign_hash "$BOOTSTRAP_MANIFEST" > "${BOOTSTRAP_MANIFEST}.sig"
          release-artifacts/sign-hash/sign_hash "$CCS_FILE" > "${CCS_FILE}.sig"
          release-artifacts/sign-hash/sign_hash --verify "$BOOTSTRAP_MANIFEST" "${BOOTSTRAP_MANIFEST}.sig"
          release-artifacts/sign-hash/sign_hash --verify "$CCS_FILE" "${CCS_FILE}.sig"
      - name: Upload release bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-bundle
          path: release-packages/*
          if-no-files-found: error
          retention-days: 5

  build-remi:
    name: build-remi
    needs: [prepare, workspace-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust-workspace
        with:
          toolchain: 1.98.0
      - name: Prepare dry-run release tree
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          release: ${{ needs.prepare.outputs.release }}
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          version: ${{ needs.prepare.outputs.version }}
          dry_run: ${{ needs.prepare.outputs.dry_run }}
          CONARY_RELEASE_LOCKFILE_MODE: online
        run: |
          set -euo pipefail
          if [[ "$dry_run" != "true" ]]; then
            echo "workflow_dispatch is dry-run only; push the canonical tag for live releases" >&2
            exit 1
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$(pwd)"
          ./scripts/release.sh "$release" --prepare-only --target "$version"
          [[ "$tag_name" == "v${version}" ]]
          bash scripts/release-matrix.sh assert-owned-version "$release" "$version"
      - name: Build remi release binary
        run: cargo build -p remi --release --verbose
      - name: Download metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
          path: release-metadata
      - name: Package remi artifact
        run: |
          mkdir -p release-packages
          cp target/release/remi "release-packages/remi-${{ needs.prepare.outputs.version }}-linux-x64"
          tar czf "release-packages/remi-${{ needs.prepare.outputs.version }}-linux-x64.tar.gz" -C release-packages "remi-${{ needs.prepare.outputs.version }}-linux-x64"
          cp release-metadata/metadata.json release-packages/metadata.json
      - name: Upload remi bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: remi-bundle
          path: release-packages/*
          if-no-files-found: error
          retention-days: 5
      - name: Write build summary
        run: |
          {
            echo "### remi build"
            echo ""
            echo "- tag: \`${{ needs.prepare.outputs.tag_name }}\`"
            echo "- version: \`${{ needs.prepare.outputs.version }}\`"
            echo "- dry_run: \`${{ needs.prepare.outputs.dry_run }}\`"
            echo "- bundle_name: \`remi-bundle\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-conaryd:
    name: build-conaryd
    needs: [prepare, workspace-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust-workspace
        with:
          toolchain: 1.98.0
      - name: Prepare dry-run release tree
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          release: ${{ needs.prepare.outputs.release }}
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          version: ${{ needs.prepare.outputs.version }}
          dry_run: ${{ needs.prepare.outputs.dry_run }}
          CONARY_RELEASE_LOCKFILE_MODE: online
        run: |
          set -euo pipefail
          if [[ "$dry_run" != "true" ]]; then
            echo "workflow_dispatch is dry-run only; push the canonical tag for live releases" >&2
            exit 1
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$(pwd)"
          ./scripts/release.sh "$release" --prepare-only --target "$version"
          [[ "$tag_name" == "v${version}" ]]
          bash scripts/release-matrix.sh assert-owned-version "$release" "$version"
      - name: Build conaryd release binary
        run: cargo build -p conaryd --release --verbose
      - name: Download metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
          path: release-metadata
      - name: Package conaryd artifact
        run: |
          mkdir -p release-packages
          cp target/release/conaryd "release-packages/conaryd-${{ needs.prepare.outputs.version }}-linux-x64"
          tar czf "release-packages/conaryd-${{ needs.prepare.outputs.version }}-linux-x64.tar.gz" -C release-packages "conaryd-${{ needs.prepare.outputs.version }}-linux-x64"
          cp release-metadata/metadata.json release-packages/metadata.json
      - name: Upload conaryd bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: conaryd-bundle
          path: release-packages/*
          if-no-files-found: error
          retention-days: 5
      - name: Write build summary
        run: |
          {
            echo "### conaryd build"
            echo ""
            echo "- tag: \`${{ needs.prepare.outputs.tag_name }}\`"
            echo "- version: \`${{ needs.prepare.outputs.version }}\`"
            echo "- dry_run: \`${{ needs.prepare.outputs.dry_run }}\`"
            echo "- bundle_name: \`conaryd-bundle\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-conary-test:
    name: build-conary-test
    needs: [prepare, workspace-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust-workspace
        with:
          toolchain: 1.98.0
      - name: Prepare dry-run release tree
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          release: ${{ needs.prepare.outputs.release }}
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          version: ${{ needs.prepare.outputs.version }}
          dry_run: ${{ needs.prepare.outputs.dry_run }}
          CONARY_RELEASE_LOCKFILE_MODE: online
        run: |
          set -euo pipefail
          if [[ "$dry_run" != "true" ]]; then
            echo "workflow_dispatch is dry-run only; push the canonical tag for live releases" >&2
            exit 1
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$(pwd)"
          ./scripts/release.sh "$release" --prepare-only --target "$version"
          [[ "$tag_name" == "v${version}" ]]
          bash scripts/release-matrix.sh assert-owned-version "$release" "$version"
      - name: Build conary-test release binary
        run: cargo build -p conary-test --release --verbose
      - name: Download metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
          path: release-metadata
      - name: Package conary-test artifact
        run: |
          mkdir -p release-packages
          cp target/release/conary-test "release-packages/conary-test-${{ needs.prepare.outputs.version }}-linux-x64"
          tar czf "release-packages/conary-test-${{ needs.prepare.outputs.version }}-linux-x64.tar.gz" -C release-packages "conary-test-${{ needs.prepare.outputs.version }}-linux-x64"
          cp release-metadata/metadata.json release-packages/metadata.json
      - name: Upload conary-test bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: conary-test-bundle
          path: release-packages/*
          if-no-files-found: error
          retention-days: 5
      - name: Write build summary
        run: |
          {
            echo "### conary-test build"
            echo ""
            echo "- tag: \`${{ needs.prepare.outputs.tag_name }}\`"
            echo "- version: \`${{ needs.prepare.outputs.version }}\`"
            echo "- dry_run: \`${{ needs.prepare.outputs.dry_run }}\`"
            echo "- bundle_name: \`conary-test-bundle\`"
          } >> "$GITHUB_STEP_SUMMARY"

  bootstrap-rehearsal:
    name: bootstrap-rehearsal (${{ matrix.distro }})
    needs: [prepare, bundle-conary]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora44
            image: registry.fedoraproject.org/fedora@sha256:765b2260aa4b4eff379b9a6f983f15fcf41a6f9dda9b272b790e23e92fcbaafb
          - distro: ubuntu-26.04
            image: docker.io/library/ubuntu@sha256:3131b4cc82a783df6c9df078f86e01819a13594b865c2cad47bd1bca2b7063bb
          - distro: arch
            image: docker.io/library/archlinux@sha256:fe6972d4dc1f660c0c10f4c41b2de8986bab89e7e2955378f8beadb8ebcd7433
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download the complete Conary release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release-bundle
      - name: Prove the signed bootstrap against the constructed artifacts
        shell: bash
        env:
          DISTRO: ${{ matrix.distro }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail

          public_key_override=""
          if [[ -s release-bundle/REHEARSAL_SIGNING_PUBLIC_KEY.txt ]]; then
            public_key_hex="$(tr -d '\n' < release-bundle/REHEARSAL_SIGNING_PUBLIC_KEY.txt)"
            [[ "$public_key_hex" =~ ^[0-9a-f]{64}$ ]] || {
              echo "rehearsal signing public key is malformed" >&2
              exit 1
            }
            public_key_override="$(python3 -c '
          import base64, sys
          print(base64.b64encode(bytes.fromhex("302a300506032b6570032100" + sys.argv[1])).decode())
          ' "$public_key_hex")"
          fi

          python3 -m http.server 18080 \
            --bind 127.0.0.1 \
            --directory release-bundle \
            >"$RUNNER_TEMP/bootstrap-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _ in {1..20}; do
            curl --fail --silent http://127.0.0.1:18080/conary-bootstrap-v1.manifest >/dev/null && break
            sleep 0.25
          done

          docker run --rm --privileged --network host \
            --volume "$PWD/site/static/install-conary-preview.sh:/tmp/install-conary-preview.sh:ro" \
            --env CONARY_BOOTSTRAP_TESTING=1 \
            --env "CONARY_BOOTSTRAP_PUBLIC_KEY_DER_BASE64=$public_key_override" \
            --env CONARY_BOOTSTRAP_ARTIFACT_BASE_URL=http://127.0.0.1:18080 \
            --env CONARY_BOOTSTRAP_MANIFEST_URL=http://127.0.0.1:18080/conary-bootstrap-v1.manifest \
            --env "DISTRO=$DISTRO" \
            "$IMAGE" \
            /bin/bash -euo pipefail -c '
              case "$DISTRO" in
                fedora44)
                  dnf install -y curl openssl sudo ca-certificates
                  ;;
                ubuntu-26.04)
                  apt-get update
                  DEBIAN_FRONTEND=noninteractive apt-get install -y curl openssl sudo ca-certificates
                  ;;
                arch)
                  pacman -Syu --noconfirm curl openssl sudo ca-certificates
                  ;;
                *)
                  echo "unsupported release bootstrap rehearsal target: $DISTRO" >&2
                  exit 1
                  ;;
              esac
              /tmp/install-conary-preview.sh \
                --manifest-url "$CONARY_BOOTSTRAP_MANIFEST_URL" \
                --apply --yes
            '

  bundle-suite:
    name: bundle-suite
    needs:
      - prepare
      - workspace-validation
      - bundle-conary
      - bootstrap-rehearsal
      - build-remi
      - build-conaryd
      - build-conary-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download every product bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
      - name: Assemble and verify the synchronized suite
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p suite-packages

          copy_exact() {
            local source="$1"
            local destination="suite-packages/$2"
            [[ -s "$source" && ! -L "$source" ]] || {
              echo "required suite asset is missing, empty, or symlinked: $source" >&2
              exit 1
            }
            cp -- "$source" "$destination"
          }

          copy_exact release-artifacts/release-metadata/metadata.json metadata.json
          copy_exact "release-artifacts/release-bundle/conary-${VERSION}.ccs" "conary-${VERSION}.ccs"
          copy_exact "release-artifacts/release-bundle/conary-${VERSION}.ccs.sig" "conary-${VERSION}.ccs.sig"
          copy_exact "release-artifacts/release-bundle/conary-${VERSION}-1.fc44.x86_64.rpm" "conary-${VERSION}-1.fc44.x86_64.rpm"
          copy_exact "release-artifacts/release-bundle/conary_${VERSION}-1_amd64.deb" "conary_${VERSION}-1_amd64.deb"
          copy_exact "release-artifacts/release-bundle/conary-${VERSION}-1-x86_64.pkg.tar.zst" "conary-${VERSION}-1-x86_64.pkg.tar.zst"
          copy_exact "release-artifacts/release-bundle/conary-bootstrap-v1.manifest" "conary-bootstrap-v1.manifest"
          copy_exact "release-artifacts/release-bundle/conary-bootstrap-v1.manifest.sig" "conary-bootstrap-v1.manifest.sig"
          copy_exact "release-artifacts/remi-bundle/remi-${VERSION}-linux-x64" "remi-${VERSION}-linux-x64"
          copy_exact "release-artifacts/remi-bundle/remi-${VERSION}-linux-x64.tar.gz" "remi-${VERSION}-linux-x64.tar.gz"
          copy_exact "release-artifacts/conaryd-bundle/conaryd-${VERSION}-linux-x64" "conaryd-${VERSION}-linux-x64"
          copy_exact "release-artifacts/conaryd-bundle/conaryd-${VERSION}-linux-x64.tar.gz" "conaryd-${VERSION}-linux-x64.tar.gz"
          copy_exact "release-artifacts/conary-test-bundle/conary-test-${VERSION}-linux-x64" "conary-test-${VERSION}-linux-x64"
          copy_exact "release-artifacts/conary-test-bundle/conary-test-${VERSION}-linux-x64.tar.gz" "conary-test-${VERSION}-linux-x64.tar.gz"

          if [[ -s release-artifacts/release-bundle/REHEARSAL_SIGNING_PUBLIC_KEY.txt ]]; then
            copy_exact \
              release-artifacts/release-bundle/REHEARSAL_SIGNING_PUBLIC_KEY.txt \
              REHEARSAL_SIGNING_PUBLIC_KEY.txt
          fi

          jq -e \
            --arg version "$VERSION" \
            --arg tag "v${VERSION}" \
            '.schema_version == 1 and
             (.dry_run | type) == "boolean" and
             .release == "suite" and
             .version == $version and
             .tag_name == $tag and
             .bundle_name == "suite-bundle" and
             .deploy_mode == "suite" and
             (.artifact_patterns | length) == 13 and
             (.artifacts | map({product, bundle_name, deploy_mode})) == [
               {"product":"conary","bundle_name":"release-bundle","deploy_mode":"release_bundle"},
               {"product":"remi","bundle_name":"remi-bundle","deploy_mode":"remote_bundle"},
               {"product":"conaryd","bundle_name":"conaryd-bundle","deploy_mode":"none"},
               {"product":"conary-test","bundle_name":"conary-test-bundle","deploy_mode":"none"}
             ]' \
            suite-packages/metadata.json >/dev/null

          for product in remi conaryd conary-test; do
            extracted="$(mktemp -d)"
            tar -xzf "suite-packages/${product}-${VERSION}-linux-x64.tar.gz" -C "$extracted"
            cmp \
              "suite-packages/${product}-${VERSION}-linux-x64" \
              "$extracted/${product}-${VERSION}-linux-x64"
            chmod +x "suite-packages/${product}-${VERSION}-linux-x64"
            version_output="$("suite-packages/${product}-${VERSION}-linux-x64" --version)"
            [[ "$version_output" == "${product} ${VERSION}" ]] || {
              echo "unexpected ${product} version output: ${version_output}" >&2
              exit 1
            }
            rm -rf -- "$extracted"
          done

          (
            cd suite-packages
            mapfile -d '' assets < <(
              find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' | sort -z
            )
            [[ ${#assets[@]} -eq 14 || ${#assets[@]} -eq 15 ]] || {
              echo "expected 14 live suite assets or 15 rehearsal assets; found ${#assets[@]}" >&2
              exit 1
            }
            sha256sum -- "${assets[@]}" > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - name: Upload synchronized suite bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: suite-bundle
          path: suite-packages/*
          if-no-files-found: error
          retention-days: 5
      - name: Publish one immutable suite release
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          verify_release_tag() {
            local phase="$1"
            local actual_commit
            git fetch --force origin \
              "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
            [[ "$(git cat-file -t "refs/tags/${TAG_NAME}")" == "tag" ]] || {
              echo "live suite tag ${TAG_NAME} is no longer annotated ${phase}" >&2
              exit 1
            }
            actual_commit="$(git rev-parse "refs/tags/${TAG_NAME}^{}")"
            [[ "$actual_commit" == "$EXPECTED_COMMIT" ]] || {
              echo "live suite tag ${TAG_NAME} moved to ${actual_commit} ${phase}; expected ${EXPECTED_COMMIT}" >&2
              exit 1
            }
          }

          verify_release_tag "before draft mutation"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            if [[ "$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')" != "true" ]]; then
              echo "release $TAG_NAME is already published; refusing to replace immutable assets" >&2
              exit 1
            fi
          else
            gh release create "$TAG_NAME" \
              --draft \
              --generate-notes \
              --title "Conary ${TAG_NAME} synchronized suite" \
              --verify-tag
          fi

          generated_notes="$(mktemp)"
          release_notes="$(mktemp)"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG_NAME" \
            --jq '.body' > "$generated_notes"
          {
            cat <<EOF
          ## Conary ${TAG_NAME} synchronized pre-alpha suite

          This one source release contains the Conary, Remi, conaryd, and
          conary-test artifacts at version ${VERSION}. It is an early preview
          for disposable, snapshotted, or explicitly non-critical systems, not
          a production recommendation.

          ### Artifact evaluation boundary

          The Conary native packages target x86_64 Fedora 44, Ubuntu 26.04 LTS,
          and Arch Linux. Publication and released-package proof do not make
          this the pinned external-tester release. Assignment is owned by the
          repository's versioned launch-status resource. The tester loop stays
          paused until that resource assigns this exact tag.

          Download \`SHA256SUMS\` and the required artifact. Native Conary
          packages are named:

          - Fedora 44: \`conary-${VERSION}-1.fc44.x86_64.rpm\`
          - Ubuntu 26.04 LTS: \`conary_${VERSION}-1_amd64.deb\`
          - Arch Linux: \`conary-${VERSION}-1-x86_64.pkg.tar.zst\`

          The release-owned bootstrap entry point downloads and verifies the
          product-signed \`conary-bootstrap-v1.manifest\`, selects only the
          exact supported host artifact, and defaults to a non-mutating preview:

          \`\`\`bash
          curl --proto '=https' --tlsv1.2 -fLO https://conary.io/install-conary-preview.sh
          less install-conary-preview.sh
          bash ./install-conary-preview.sh
          bash ./install-conary-preview.sh --apply --yes
          \`\`\`

          Do not pipe the installer into a shell. The explicit apply mode uses
          the native package manager only to install Conary itself; the package
          owns system initialization and built-in repository enrollment.

          Verify downloaded files with:

          \`\`\`bash
          sha256sum -c SHA256SUMS --ignore-missing
          \`\`\`

          The release also contains raw and tarred Linux x86_64 binaries for
          Remi, conaryd, and conary-test. SBOM and provenance sidecars are not
          published yet.

          Defects can be reported with the [pre-alpha tester feedback template](https://github.com/ConaryLabs/Conary/issues/new?template=pre_alpha_feedback.md).

          ## Changes

          EOF
            cat "$generated_notes"
          } > "$release_notes"
          gh release edit "$TAG_NAME" --notes-file "$release_notes"
          rm -f -- "$generated_notes" "$release_notes"

          gh release upload "$TAG_NAME" suite-packages/* --clobber

          remote_assets="$(mktemp)"
          local_names="$(mktemp)"
          remote_names="$(mktemp)"
          gh release view "$TAG_NAME" --json assets > "$remote_assets"
          find suite-packages -maxdepth 1 -type f -printf '%f\n' | sort > "$local_names"
          jq -r '.assets[].name' "$remote_assets" | sort > "$remote_names"
          diff -u "$local_names" "$remote_names" || {
            echo "draft release asset inventory does not match the complete suite" >&2
            exit 1
          }

          while IFS= read -r asset; do
            expected="sha256:$(sha256sum "suite-packages/${asset}" | awk '{print $1}')"
            actual="$(jq -r --arg asset "$asset" '.assets[] | select(.name == $asset) | .digest' "$remote_assets")"
            [[ "$actual" == "$expected" ]] || {
              echo "draft release digest for ${asset} is ${actual}, expected ${expected}" >&2
              exit 1
            }
          done < "$local_names"
          rm -f -- "$remote_assets" "$local_names" "$remote_names"

          verify_release_tag "before publication"
          gh release edit "$TAG_NAME" --draft=false

          release_state="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}"
          )"
          jq -e \
            --arg tag "$TAG_NAME" \
            '.tag_name == $tag and .draft == false and .immutable == true' \
            <<< "$release_state" >/dev/null || {
            echo "published release ${TAG_NAME} is not exact and immutable" >&2
            exit 1
          }
