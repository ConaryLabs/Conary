name: produce-remi-native-oracles

on:
  workflow_dispatch:
    inputs:
      export_run_id:
        description: Successful protected export-remi-native-oracle-inputs run
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: remi-native-oracles-${{ inputs.export_run_id }}
  cancel-in-progress: false

jobs:
  authorize:
    name: authorize exact native-oracle production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    outputs:
      artifact_name: ${{ steps.authority.outputs.artifact_name }}
      deployed_commit: ${{ steps.authority.outputs.deployed_commit }}
      export_id: ${{ steps.authority.outputs.export_id }}
      fedora_candidate: ${{ steps.authority.outputs.fedora_candidate }}
      ubuntu_candidate: ${{ steps.authority.outputs.ubuntu_candidate }}
      arch_candidate: ${{ steps.authority.outputs.arch_candidate }}
    steps:
      - name: Check out protected oracle operator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a protected-main workflow revision
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || {
            echo "native-oracle production must be dispatched from main" >&2
            exit 1
          }
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
      - name: Bind one successful exact native-oracle export
        id: source
        env:
          EXPORT_RUN_ID: ${{ inputs.export_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPORT_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "export run ID must be a positive decimal integer" >&2
            exit 1
          }
          source_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXPORT_RUN_ID}")"
          jq -e --arg repository "$GITHUB_REPOSITORY" '
            .event == "workflow_dispatch" and
            .status == "completed" and
            .conclusion == "success" and
            .head_branch == "main" and
            .head_repository.full_name == $repository and
            .path == ".github/workflows/export-remi-native-oracle-inputs.yml"
          ' <<<"$source_run" >/dev/null
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXPORT_RUN_ID}/artifacts")"
          artifact_name="$(jq -er --arg run_id "$EXPORT_RUN_ID" '
            [.artifacts[] |
              select(.expired == false) |
              select(.name | test("^remi-native-oracle-input-[1-9][0-9]*-" + $run_id + "$"))] |
            if length == 1 then .[0].name else error("expected one exact unexpired export artifact") end
          ' <<<"$artifacts")"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
      - name: Download exact exported native metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          path: ${{ runner.temp }}/native-oracle-export
          run-id: ${{ inputs.export_run_id }}
          github-token: ${{ github.token }}
      - name: Independently reopen export and deployed candidate authority
        id: authority
        env:
          ARTIFACT_NAME: ${{ steps.source.outputs.artifact_name }}
          EXPORT_RUN_ID: ${{ inputs.export_run_id }}
        run: |
          set -euo pipefail
          export_root="${RUNNER_TEMP}/native-oracle-export"
          inspection="${export_root}/remi-deployment-inspection.json"
          verification="${export_root}/native-oracle-input-verification.json"
          mapfile -t transports < <(find "$export_root" -maxdepth 1 -type f -name 'native-oracle-input-*.tar' -print)
          [[ "${#transports[@]}" -eq 1 ]] || {
            echo "export artifact must contain exactly one native-oracle transport" >&2
            exit 1
          }
          jq -e '
            .deployment_evidence_schema_version == 3 and
            .deployment.outcome == "complete" and
            .deployment.completion_mode == "private-candidates" and
            (.deployment.commit_sha | test("^[0-9a-f]{40}$")) and
            ([.candidates[].profile] == ["fedora-44", "ubuntu-26.04", "arch"]) and
            ([.candidates[].profile_revision_sha256] | all(test("^[0-9a-f]{64}$")))
          ' "$inspection" >/dev/null
          jq -e '
            .schema_version == 1 and
            (.export_id | test("^[a-z0-9][a-z0-9.-]*$")) and
            ([.profiles[].profile] == ["fedora-44", "ubuntu-26.04", "arch"]) and
            (.transport.sha256 | test("^[0-9a-f]{64}$")) and
            .transport.size > 0
          ' "$verification" >/dev/null
          deployed_commit="$(jq -er '.deployment.commit_sha' "$inspection")"
          fedora_candidate="$(jq -er '.candidates[] | select(.profile == "fedora-44") | .profile_revision_sha256' "$inspection")"
          ubuntu_candidate="$(jq -er '.candidates[] | select(.profile == "ubuntu-26.04") | .profile_revision_sha256' "$inspection")"
          arch_candidate="$(jq -er '.candidates[] | select(.profile == "arch") | .profile_revision_sha256' "$inspection")"
          jq -e --arg fedora "$fedora_candidate" --arg ubuntu "$ubuntu_candidate" --arg arch "$arch_candidate" '
            [.profiles[] | "\(.profile)=\(.profile_revision_sha256)"] == [
              "fedora-44=" + $fedora,
              "ubuntu-26.04=" + $ubuntu,
              "arch=" + $arch
            ]
          ' "$verification" >/dev/null
          git merge-base --is-ancestor "$deployed_commit" origin/main
          export_id="$(jq -er '.export_id' "$verification")"
          python3 scripts/verify-native-oracle-input-transport.py \
            --transport "${transports[0]}" \
            --export-id "$export_id" \
            --expected-candidate "fedora-44=${fedora_candidate}" \
            --expected-candidate "ubuntu-26.04=${ubuntu_candidate}" \
            --expected-candidate "arch=${arch_candidate}" \
            --output-dir "${RUNNER_TEMP}/authorized-native-input" \
            --evidence "${RUNNER_TEMP}/authorized-verification.json"
          cmp "$verification" "${RUNNER_TEMP}/authorized-verification.json"
          {
            echo "artifact_name=$ARTIFACT_NAME"
            echo "deployed_commit=$deployed_commit"
            echo "export_id=$export_id"
            echo "fedora_candidate=$fedora_candidate"
            echo "ubuntu_candidate=$ubuntu_candidate"
            echo "arch_candidate=$arch_candidate"
          } >> "$GITHUB_OUTPUT"

  produce:
    name: native oracle (${{ matrix.profile }})
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: fedora-44
            architecture: x86_64
            image: registry.fedoraproject.org/fedora@sha256:765b2260aa4b4eff379b9a6f983f15fcf41a6f9dda9b272b790e23e92fcbaafb
            feature: native-rpm-oracle
            package_bin: conary-rpm-oracle
            resolution_bin: conary-rpm-resolution-oracle
          - profile: ubuntu-26.04
            architecture: amd64
            image: docker.io/library/ubuntu:26.04@sha256:678c6550cc43645e08669028bc177f50be4e7c5b8cca677067b1914d4afc7a03
            feature: native-debian-oracle
            package_bin: conary-debian-oracle
            resolution_bin: conary-debian-resolution-oracle
          - profile: arch
            architecture: x86_64
            image: docker.io/library/archlinux@sha256:fe6972d4dc1f660c0c10f4c41b2de8986bab89e7e2955378f8beadb8ebcd7433
            feature: native-alpm-oracle
            package_bin: conary-alpm-oracle
            resolution_bin: conary-alpm-resolution-oracle
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install pinned Fedora producer dependencies
        if: ${{ matrix.profile == 'fedora-44' }}
        run: >-
          dnf -y --disablerepo=updates install
          gcc gcc-c++ openssl-devel xz-devel libseccomp-devel
          pkgconf-pkg-config cmake perl clang rustup git python3 jq
          libsolv-devel-0.7.36-2.fc44.x86_64
      - name: Install exact Fedora Rust toolchain
        if: ${{ matrix.profile == 'fedora-44' }}
        run: |
          rustup-init -y --default-toolchain 1.98.0 --profile minimal
          printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install pinned Ubuntu producer dependencies
        if: ${{ matrix.profile == 'ubuntu-26.04' }}
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates build-essential libssl-dev liblzma-dev libseccomp-dev \
            pkg-config cmake perl clang rustup git python3 jq libapt-pkg-dev=3.2.0
          rm -rf /var/lib/apt/lists/*
          rustup default 1.98.0
      - name: Install pinned Arch producer dependencies
        if: ${{ matrix.profile == 'arch' }}
        run: |
          sed -i '/^\[options\]/a DisableDownloadTimeout' /etc/pacman.conf
          printf 'Server = https://archive.archlinux.org/repos/2026/08/02/$repo/os/$arch\n' > /etc/pacman.d/mirrorlist
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel openssl xz libseccomp pkgconf cmake perl clang rustup git python jq
          pacman -Scc --noconfirm
          rustup default 1.98.0
      - name: Check out protected oracle operator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: operator
          persist-credentials: false
      - name: Check out exact deployed producer source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: producer
          ref: ${{ needs.authorize.outputs.deployed_commit }}
          persist-credentials: false
      - name: Require exact clean producer source
        working-directory: producer
        env:
          DEPLOYED_COMMIT: ${{ needs.authorize.outputs.deployed_commit }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$DEPLOYED_COMMIT" ]]
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
      - name: Download exact exported native metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.authorize.outputs.artifact_name }}
          path: ${{ runner.temp }}/native-oracle-export
          run-id: ${{ inputs.export_run_id }}
          github-token: ${{ github.token }}
      - name: Independently reopen exact lane input
        env:
          FEDORA_CANDIDATE: ${{ needs.authorize.outputs.fedora_candidate }}
          UBUNTU_CANDIDATE: ${{ needs.authorize.outputs.ubuntu_candidate }}
          ARCH_CANDIDATE: ${{ needs.authorize.outputs.arch_candidate }}
        run: |
          set -euo pipefail
          mapfile -t transports < <(find "${RUNNER_TEMP}/native-oracle-export" -maxdepth 1 -type f -name 'native-oracle-input-*.tar' -print)
          [[ "${#transports[@]}" -eq 1 ]]
          python3 operator/scripts/verify-native-oracle-input-transport.py \
            --transport "${transports[0]}" \
            --export-id "${{ needs.authorize.outputs.export_id }}" \
            --expected-candidate "fedora-44=${FEDORA_CANDIDATE}" \
            --expected-candidate "ubuntu-26.04=${UBUNTU_CANDIDATE}" \
            --expected-candidate "arch=${ARCH_CANDIDATE}" \
            --output-dir "${RUNNER_TEMP}/native-input" \
            --evidence "${RUNNER_TEMP}/native-input-verification.json"
      - name: Build exact deployed native producers
        working-directory: producer
        run: >-
          cargo build --release -p conary-core
          --features "${{ matrix.feature }}"
          --bin "${{ matrix.package_bin }}"
          --bin "${{ matrix.resolution_bin }}"
      - name: Produce and reopen complete native oracle lane
        env:
          DEPLOYED_COMMIT: ${{ needs.authorize.outputs.deployed_commit }}
          EXPORT_ID: ${{ needs.authorize.outputs.export_id }}
        run: |
          set -euo pipefail
          python3 operator/scripts/produce-native-oracle-lane.py \
            --input-root "${RUNNER_TEMP}/native-input" \
            --profile "${{ matrix.profile }}" \
            --architecture "${{ matrix.architecture }}" \
            --package-producer "${GITHUB_WORKSPACE}/producer/target/release/${{ matrix.package_bin }}" \
            --resolution-producer "${GITHUB_WORKSPACE}/producer/target/release/${{ matrix.resolution_bin }}" \
            --output-root "${RUNNER_TEMP}/native-oracles-${{ matrix.profile }}" \
            --export-id "$EXPORT_ID" \
            --deployed-commit "$DEPLOYED_COMMIT" \
            > "${RUNNER_TEMP}/native-oracles-${{ matrix.profile }}.json"
          cmp \
            "${RUNNER_TEMP}/native-oracles-${{ matrix.profile }}.json" \
            <(jq -c . "${RUNNER_TEMP}/native-oracles-${{ matrix.profile }}/evidence.json")
      - name: Require pinned native implementation identity
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/native-oracles-${PROFILE}/evidence.json"
          case "$PROFILE" in
            fedora-44)
              jq -e '
                .package_oracle.implementation == {ecosystem:"rpm",name:"libsolv",projection_schema:1,version:"0.7.36"} and
                .resolution_oracle.implementation == {ecosystem:"rpm",name:"libsolv",projection_schema:1,version:"0.7.36"}
              ' "$evidence" >/dev/null
              ;;
            ubuntu-26.04)
              jq -e '
                .package_oracle.implementation == {ecosystem:"debian",name:"apt-pkg",projection_schema:1,version:"3.2.0"} and
                .resolution_oracle.implementation == {ecosystem:"debian",name:"apt-pkg",projection_schema:1,version:"3.2.0"}
              ' "$evidence" >/dev/null
              ;;
            arch)
              jq -e '
                .package_oracle.implementation.ecosystem == "alpm" and
                .package_oracle.implementation.name == "libalpm" and
                .package_oracle.implementation.projection_schema == 1 and
                .package_oracle.implementation.version == .resolution_oracle.implementation.version and
                .resolution_oracle.implementation.ecosystem == "alpm" and
                .resolution_oracle.implementation.name == "libalpm" and
                .resolution_oracle.implementation.projection_schema == 1
              ' "$evidence" >/dev/null
              ;;
          esac
      - name: Upload exact native oracle lane
        id: upload
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: remi-native-oracles-${{ matrix.profile }}-${{ inputs.export_run_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-oracles-${{ matrix.profile }}
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
      - name: Record exact native oracle identities
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          PROFILE: ${{ matrix.profile }}
        run: |
          evidence="${RUNNER_TEMP}/native-oracles-${PROFILE}/evidence.json"
          {
            echo "### Exact production native oracle: ${PROFILE}"
            echo
            jq -r '
              "- deployed_commit: `\(.deployed_commit)`\n" +
              "- export_id: `\(.export_id)`\n" +
              "- profile_revision: `\(.profile_revision_sha256)`\n" +
              "- package_manifest: `\(.package_oracle.manifest_sha256)`\n" +
              "- package_rows: `\(.package_oracle.artifact.counts.packages)`\n" +
              "- resolution_manifest: `\(.resolution_oracle.manifest_sha256)`\n" +
              "- resolution_roots: `\(.resolution_oracle.artifact.counts.roots)`\n" +
              "- implementation: `\(.package_oracle.implementation.name) \(.package_oracle.implementation.version)`"
            ' "$evidence"
            echo "- artifact_digest: \`$ARTIFACT_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  complete:
    name: native oracle production
    if: ${{ always() }}
    needs: produce
    runs-on: ubuntu-latest
    steps:
      - name: Require every pinned producer lane
        env:
          PRODUCER_RESULT: ${{ needs.produce.result }}
        run: test "$PRODUCER_RESULT" = success
