name: summarize-rust-cache
description: Retain exact compiler-cache hit, miss, write, and error evidence.
inputs:
  phase:
    description: Stable protected job phase label.
    required: true
runs:
  using: composite
  steps:
    - name: Summarize compiler-cache evidence
      shell: bash
      env:
        CACHE_PHASE: ${{ inputs.phase }}
      run: |
        set -euo pipefail
        [[ "$CACHE_PHASE" =~ ^[a-z0-9-]+$ ]] || {
          echo "compiler-cache phase must be a lowercase slug" >&2
          exit 1
        }
        [[ -x "${SCCACHE_PATH:-}" ]] || {
          echo "compiler-cache summary has no sccache executable" >&2
          exit 1
        }
        [[ "${SCCACHE_GHA_VERSION:-}" =~ ^protected-gnu-v1-[0-9a-f]{64}$ ]] || {
          echo "compiler-cache summary has no exact protected namespace" >&2
          exit 1
        }
        stats="${RUNNER_TEMP}/${CACHE_PHASE}-sccache-stats.json"
        "$SCCACHE_PATH" --show-stats --stats-format json > "$stats"
        jq -e '
          .version == "0.16.0"
          and (.stats.compile_requests | type == "number")
          and (.stats.cache_hits.counts | type == "object")
          and (.stats.cache_misses.counts | type == "object")
          and (.stats.cache_errors.counts | type == "object")
          and (.stats.cache_writes | type == "number")
          and (.stats.cache_read_errors | type == "number")
          and (.stats.cache_write_errors | type == "number")
          and (.stats.cache_timeouts | type == "number")
        ' "$stats" >/dev/null
        {
          echo "### Rust compiler-cache result: $CACHE_PHASE"
          echo
          echo "- namespace: \`${SCCACHE_GHA_VERSION}\`"
          jq -r '
            "- compile_requests: `\(.stats.compile_requests)`\n"
            + "- cache_hits: `\([.stats.cache_hits.counts[]] | add // 0)`\n"
            + "- cache_misses: `\([.stats.cache_misses.counts[]] | add // 0)`\n"
            + "- cache_errors: `\([.stats.cache_errors.counts[]] | add // 0)`\n"
            + "- cache_writes: `\(.stats.cache_writes)`\n"
            + "- cache_read_errors: `\(.stats.cache_read_errors)`\n"
            + "- cache_write_errors: `\(.stats.cache_write_errors)`\n"
            + "- cache_timeouts: `\(.stats.cache_timeouts)`"
          ' "$stats"
        } >> "$GITHUB_STEP_SUMMARY"
