name: restore-native-matrix-artifact
description: >-
  Download, independently verify, and reopen the immutable exact-head static
  binaries shared by protected distro matrix consumers.
inputs:
  commit-sha:
    description: Exact checked-out workflow commit bound by the artifact.
    required: true
  run-id:
    description: Workflow run that produced and uploaded the artifact.
    required: true
  event-name:
    description: Workflow event bound by the artifact provenance.
    required: true
outputs:
  restore-ms:
    description: Download plus verification and reopen duration in milliseconds.
    value: ${{ steps.verify.outputs.duration_ms }}
runs:
  using: composite
  steps:
    - name: Start exact-head artifact restore clock
      id: start
      shell: bash
      run: echo "started_ns=$(date -u +%s%N)" >> "$GITHUB_OUTPUT"
    - name: Download exact-head native matrix artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: native-matrix-${{ inputs.commit-sha }}
        path: ${{ runner.temp }}/native-matrix-artifact
    - name: Verify and reopen exact-head native matrix artifact
      id: verify
      shell: bash
      env:
        ARTIFACT_COMMIT: ${{ inputs.commit-sha }}
        ARTIFACT_EVENT: ${{ inputs.event-name }}
        ARTIFACT_RUN_ID: ${{ inputs.run-id }}
        ARTIFACT_STARTED_NS: ${{ steps.start.outputs.started_ns }}
      run: |
        set -euo pipefail
        result="${RUNNER_TEMP}/native-matrix-artifact-verification.json"
        scripts/native-matrix-artifact.sh verify \
          "${RUNNER_TEMP}/native-matrix-artifact" \
          "$ARTIFACT_COMMIT" "$ARTIFACT_RUN_ID" "$ARTIFACT_EVENT" > "$result"
        finished_ns="$(date -u +%s%N)"
        duration_ms=$(( (finished_ns - ARTIFACT_STARTED_NS) / 1000000 ))
        echo "duration_ms=$duration_ms" >> "$GITHUB_OUTPUT"
        {
          echo "### Exact-head native matrix artifact"
          echo
          echo "- commit: \`$ARTIFACT_COMMIT\`"
          echo "- producer_run_id: \`$ARTIFACT_RUN_ID\`"
          echo "- artifact_restore_verify_ms: \`$duration_ms\`"
          jq -r '
            "- producer_dependency_setup_ms: `\(.measurements.dependency_setup_ms)`\n"
            + "- producer_compiler_cache_setup_ms: `\(.measurements.compiler_cache_setup_ms)`\n"
            + "- producer_compiler_cache_save_ms: `\(.measurements.compiler_cache_save_ms)`\n"
            + "- producer_artifact_build_ms: `\(.measurements.artifact_build_ms)`\n"
            + "- producer_static_dependency_cache_hit: `\(.measurements.static_dependency_cache_hit)`\n"
            + "- producer_static_dependency_ms: `\(.measurements.static_dependency_ms)`\n"
            + "- producer_static_runtime_build_ms: `\(.measurements.static_runtime_build_ms)`\n"
            + "- producer_library_test_build_ms: `\(.measurements.library_test_build_ms)`\n"
            + "- producer_bundle_ms: `\(.measurements.bundle_ms)`"
          ' "$result"
        } >> "$GITHUB_STEP_SUMMARY"
