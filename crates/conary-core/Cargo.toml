[package]
name = "conary-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
description = "Core library for the Conary package manager"
license.workspace = true
build = "build.rs"

[features]
default = ["composefs-rs"]
composefs-rs = ["dep:composefs"]
native-alpm-oracle = ["dep:alpm", "dep:clap"]
native-rpm-oracle = ["dep:clap"]
native-debian-oracle = ["dep:clap"]

[dependencies]
# Database
rusqlite.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Hashing for file integrity
sha1.workspace = true
sha2.workspace = true
md-5 = "0.11.0"                  # MD5 for the Debian package md5sums contract
sha3 = "0.10.9"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Logging
tracing.workspace = true

# Package format parsing. Keep rpm's PGP signature feature disabled; Conary
# handles repository/package trust separately and only needs RPM metadata/payload parsing here.
rpm.workspace = true
rpm-version.workspace = true
debversion.workspace = true
alpm-types.workspace = true
alpm = { workspace = true, optional = true }
semver.workspace = true
bzip2 = "0.6"
num-traits = "0.2"
mlua = { version = "0.11.4", features = ["lua54", "vendored"] }

# Temp files for RPM extraction
tempfile.workspace = true

# HTTP client for repository downloads
reqwest.workspace = true

# Serialization for repository metadata and CCS manifests
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true
urlencoding = "2"                # URL percent-encoding for API paths
ciborium = "0.2"                 # CBOR encoding for binary CCS manifests

# Date/time handling for repository sync timestamps
chrono.workspace = true

# Delta compression for efficient updates
zstd = "0.13"

# Content-Defined Chunking for efficient dedup and deltas
fastcdc = "4.0.1"
walkdir.workspace = true                  # Directory traversal for chunk store
xattr = "1.6"

# Parallel processing for concurrent downloads
rayon.workspace = true

# SAT-based dependency resolver
resolvo = "0.12.0"

# Progress bars for downloads
indicatif.workspace = true

# GPG signature verification (pure Rust OpenPGP implementation)
sequoia-openpgp.workspace = true

# Repository metadata parsing
tar.workspace = true                     # Tarball extraction for Arch repos
flate2.workspace = true                  # Gzip compression (for Arch, Debian, Fedora)
liblzma.workspace = true          # XZ/LZMA compression (for Arch)
rfc822-like = "0.2"             # RFC 822 parser for Debian/Ubuntu Packages files
quick-xml = "0.41"              # XML parser for Fedora/RPM repodata
ar.workspace = true             # AR archive parsing for DEB packages
zip.workspace = true
glob.workspace = true
log.workspace = true                      # Logging facade for transaction module

# Transaction engine dependencies
uuid.workspace = true
fs2.workspace = true                      # File locking for transaction safety
crc32fast = "1.4"                # Fast CRC32 for journal integrity

# Container isolation for scriptlets (Linux namespaces)
nix.workspace = true
libc.workspace = true                    # Low-level syscalls for resource limits

# Ed25519 signatures for CCS package signing
ed25519-dalek.workspace = true
rand.workspace = true                     # Random number generation for key generation
rand_core_06 = { package = "rand_core", version = "0.6", features = ["getrandom"] }  # For ed25519-dalek compat
base64.workspace = true                  # Base64 encoding for signatures
hex.workspace = true                      # Hex encoding for chunk hashes

# Regex for scriptlet analysis
regex.workspace = true
tree-sitter.workspace = true
tree-sitter-bash.workspace = true
shlex = "1.3"

# Enum string conversion macros
strum = "0.28"
strum_macros = "0.28"

# Sigstore integration
sigstore.workspace = true
const-oid.workspace = true
pem.workspace = true
rustls-pki-types.workspace = true
webpki.workspace = true
x509-cert.workspace = true

# Async runtime
tokio.workspace = true

# URL parsing for peer endpoints
url.workspace = true
mdns-sd.workspace = true

# Diff output
diffy = "0.5.0"

# Binary format parsing
goblin = "0.10.4"

# External command discovery
which = "8.0.0"
clap = { workspace = true, optional = true }

# Platform directories
dirs = "6.0.0"
target-lexicon.workspace = true

# Capability enforcement (landlock filesystem + seccomp syscall filtering)
landlock = "0.4"
libseccomp.workspace = true
caps.workspace = true
seccompiler = "0.5"

# Async repository helpers
async-trait.workspace = true
futures.workspace = true

# composefs-rs: EROFS image builder for composefs (optional, feature-gated)
composefs = { version = "0.7", default-features = false, optional = true }

[dev-dependencies]
criterion.workspace = true

[build-dependencies]
cc = "1.2"
pkg-config = "0.3"

[[bin]]
name = "conary-alpm-oracle"
path = "src/bin/conary-alpm-oracle.rs"
required-features = ["native-alpm-oracle"]

[[bin]]
name = "conary-alpm-resolution-oracle"
path = "src/bin/conary-alpm-resolution-oracle.rs"
required-features = ["native-alpm-oracle"]

[[bin]]
name = "conary-rpm-oracle"
path = "src/bin/conary-rpm-oracle.rs"
required-features = ["native-rpm-oracle"]

[[bin]]
name = "conary-rpm-resolution-oracle"
path = "src/bin/conary-rpm-resolution-oracle.rs"
required-features = ["native-rpm-oracle"]

[[bin]]
name = "conary-debian-oracle"
path = "src/bin/conary-debian-oracle.rs"
required-features = ["native-debian-oracle"]

[[bench]]
name = "erofs_build"
harness = false
required-features = ["composefs-rs"]

[[bench]]
name = "selected_root_delta"
harness = false

[[bench]]
name = "generation_db_snapshot"
harness = false

[[bench]]
name = "installed_inventory"
harness = false

[[bench]]
name = "package_transaction_staging"
harness = false
