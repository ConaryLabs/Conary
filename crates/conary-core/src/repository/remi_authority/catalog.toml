# crates/conary-core/src/repository/remi_authority/catalog.toml
#
# Public CCS package-authority pins for Conary's canonical Remi service.
# Private signing keys remain only on the Remi host. Rotation must update this
# catalog and republish current artifacts before a new key becomes active.

schema_version = 1
endpoint = "https://remi.conary.io"

[[profiles]]
profile = "fedora-44"

[[profiles.keys]]
